<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rotina Family — Sprint 2</title>
<style>
:root{--p:#6d42d8;--bg:#f6f7fb;--line:#e7e4ef;--text:#272a3c;--muted:#6f7485}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--text)}.app{height:100%;display:grid;grid-template-columns:220px minmax(0,1fr)}.side{background:#fff;border-right:1px solid var(--line);padding:22px 14px}.brand{font-weight:900;font-size:18px;padding:5px 10px 21px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;text-align:left;color:#54586a;border-radius:10px;padding:11px 12px;font-weight:750;cursor:pointer}.nav button.active{background:#f1edff;color:var(--p)}.content{min-width:0;height:100%;position:relative}.frame{border:0;width:100%;height:100%;display:block}.placeholder{height:100%;display:none;place-items:center;padding:20px}.placeholder.show{display:grid}.placeholder>div{max-width:560px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;text-align:center}.placeholder h2{margin:0 0 8px}.placeholder p{margin:0;color:var(--muted);line-height:1.5}.version{position:fixed;right:7px;bottom:7px;background:#fff;border:1px solid #ddd;border-radius:999px;padding:4px 7px;color:#7a7f8e;font-size:9px;z-index:20}
@media(max-width:900px){.app{display:block}.side{height:48px;padding:5px;border-right:0;border-bottom:1px solid var(--line);overflow:hidden}.brand{display:none}.nav{display:flex;overflow-x:auto;gap:4px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{white-space:nowrap;flex:0 0 auto;padding:8px 9px;font-size:12px}.content{height:calc(100% - 48px)}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Rotina Family<small>ADM • Sprint 2</small></div><nav class="nav" id="nav"><button data-route="inicio">⌂ Início</button><button data-route="tarefas">✓ Tarefas</button><button data-route="participantes">👥 Participantes</button><button data-route="monitor">◉ Monitor</button><button data-route="recompensas">🎁 Recompensas</button><button data-route="relatorios">▥ Relatórios</button><button data-route="master">⚙ Master</button></nav></aside><main class="content"><iframe class="frame" id="frame"></iframe><div class="placeholder" id="placeholder"><div><h2 id="phTitle"></h2><p>Esta área ainda não entrou nesta parte do Sprint 2. O menu permanece disponível para você voltar às telas já em avaliação.</p></div></div></main></div><div class="version">Sprint 2 shell v1</div>
<script>
const frame=document.getElementById('frame'),placeholder=document.getElementById('placeholder');let current='';const pages={tarefas:'sprint2-tarefas-preview-v9.html',participantes:'sprint2-participantes-preview-v3.html?embedded=1',monitor:'sprint2-tarefas-preview-v9.html'};
function activate(route){document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===route))}
function route(){return (location.hash||'#participantes').slice(1)}
function hideInnerNavigation(doc){try{const style=doc.createElement('style');style.textContent='.side{display:none!important}.app{grid-template-columns:minmax(0,1fr)!important}.main{max-width:100vw!important}';doc.head.appendChild(style)}catch(_){}}
function prepareTasks(wanted){let tries=0;const timer=setInterval(()=>{tries++;try{const outer=frame.contentDocument,innerFrame=outer?.querySelector('#app');if(!innerFrame?.contentDocument){if(tries>40)clearInterval(timer);return}const d=innerFrame.contentDocument;hideInnerNavigation(d);if(wanted==='monitor')d.querySelector('#navMonitor')?.click();else d.querySelector('#navTasks')?.click();clearInterval(timer);log('route_ready',wanted)}catch(_){if(tries>40)clearInterval(timer)}},100)}
function show(routeName){current=routeName;activate(routeName);if(pages[routeName]){placeholder.classList.remove('show');frame.style.display='block';const src=pages[routeName];if(frame.getAttribute('src')!==src){frame.setAttribute('src',src)}else if(routeName==='monitor'||routeName==='tarefas')prepareTasks(routeName);if(routeName==='tarefas'||routeName==='monitor')frame.onload=()=>prepareTasks(routeName);else frame.onload=()=>{try{hideInnerNavigation(frame.contentDocument)}catch(_){}}}else{frame.style.display='none';placeholder.classList.add('show');phTitle.textContent=routeName.charAt(0).toUpperCase()+routeName.slice(1);log('placeholder_open',routeName)}}
function log(event,recurso){const item={aplicativo:'adm',versaoMonitor:1,evento:'operacao.sprint2_shell.'+event,nivel:'info',detalhes:{operacao:event,recurso:String(recurso||''),resultado:'ok',versao:1},grupoId:'SPRINT2-PREVIEW',perfilId:'',sessaoId:'sprint2-shell-v1',clienteEm:new Date().toISOString(),pagina:'sprint2-adm-preview-v1.html',navegador:'browser',online:navigator.onLine,visibilidade:document.visibilityState,instalado:false};if(navigator.onLine)fetch('https://rotina-family-onesignal-scheduler.rotina-family-onesignal-scheduler.workers.dev/app-log',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({events:[item]})}).catch(()=>{})}
document.querySelectorAll('[data-route]').forEach(b=>b.addEventListener('click',()=>{location.hash=b.dataset.route}));window.addEventListener('hashchange',()=>{show(route());log('nav',route())});window.addEventListener('error',()=>{const itemRoute=route();log('runtime_error',itemRoute)});show(route());log('open',route());
</script></body></html>
