<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotina Family ADM</title>
  <style>body{font-family:Segoe UI,Tahoma,sans-serif;background:#f4f7f6;color:#334155;margin:0;display:grid;place-items:center;min-height:100vh}.loading{padding:24px;text-align:center}</style>
</head>
<body>
  <div class="loading">Carregando Rotina Family ADM...</div>
  <script>
    (async()=>{
      try{
        const r=await fetch('./index-ADMIN-v8.html',{cache:'no-store'});
        if(!r.ok) throw new Error('Falha ao carregar painel');
        let html=await r.text();
        const addons=[
          '<script type="module" src="./adm-score-history-cards.js?v=2"><\\/script>',
          '<script type="module" src="./adm-monitor-history-fix.js?v=3"><\\/script>',
          '<script type="module" src="./family-alarm-admin.js?v=4"><\\/script>',
          '<script type="module" src="./reward-redemption-notifications.js?v=1"><\\/script>'
        ];
        for(const addon of addons){const m=addon.match(/src="\.\/(.+?)\?/);const nome=m?.[1]||'';if(nome&&!html.includes(nome))html=html.replace('</body>',addon+'\n</body>');}
        document.open();document.write(html);document.close();
      }catch(e){
        document.body.innerHTML='<div class="loading"><strong>Não foi possível abrir o painel.</strong><br><a href="./index-ADMIN-v8.html">Tentar abrir diretamente</a></div>';
      }
    })();
  </script>
</body>
</html>
