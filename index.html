<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotina Family ADM</title>
  <style>body{font-family:Segoe UI,Tahoma,sans-serif;background:#f4f7f6;color:#334155;margin:0;display:grid;place-items:center;min-height:100vh}.loading{padding:24px;text-align:center}</style>
</head>
<body>
  <div class="loading">Carregando Rotina Family ADM...</div>
  <script>
    (async()=>{
      try{
        const r=await fetch('./index-ADMIN-v8.html',{cache:'no-store'});
        if(!r.ok) throw new Error('Falha ao carregar painel');
        let html=await r.text();

        // O ADM Master é resolvido antes do fluxo normal do ADM encerrar uma sessão
        // sem vínculo familiar. A autoridade Master não depende de CLI/grupo/comercial.
        const masterBridge = `    async function aguardarConfirmacaoMaster(user, timeoutMs = 5000) {
        if (!user) return false;
        if (window.rotinaMasterSession?.master === true && window.rotinaMasterSession?.uid === user.uid) return true;
        return await new Promise(resolve => {
            let finalizado = false;
            const concluir = valor => {
                if (finalizado) return;
                finalizado = true;
                clearTimeout(timer);
                window.removeEventListener('rotina-admin-master-ready', aoResolver);
                resolve(valor === true);
            };
            const aoResolver = evento => {
                const sessao = evento.detail || {};
                if (sessao.master === true && (!sessao.uid || sessao.uid === user.uid)) concluir(true);
                else if (sessao.motivo === 'nao-autorizado') concluir(false);
            };
            window.addEventListener('rotina-admin-master-ready', aoResolver);
            const timer = setTimeout(() => concluir(window.rotinaMasterSession?.master === true), timeoutMs);
            window.dispatchEvent(new CustomEvent('rotina-admin-session-ready', { detail: { grupoId: '', masterCandidate: true } }));
        });
    }

    function abrirShellMaster(user) {
        adminLogadoAtual = {
            id: 'MASTER-SYSTEM',
            uid: user.uid,
            email: String(user.email || '').trim().toLowerCase(),
            tipoAcesso: 'master',
            codigoAdmin: 'MASTER',
            codigoCliente: '',
            grupoId: ''
        };
        document.getElementById('telaAcesso').style.display = 'none';
        document.getElementById('sistemaPrincipal').style.display = 'block';
        document.getElementById('displayCodigoAdmin').innerText = 'MASTER';
        document.getElementById('displayCodigoCliente').innerText = 'SISTEMA';
        window.dispatchEvent(new CustomEvent('rotina-admin-session-ready', { detail: { grupoId: '', master: true } }));
        setTimeout(vincularGrupoBaseMaster, 0);
    }

    // O Master permanece uma identidade global. Este vínculo é apenas operacional:
    // permite que as telas normais do ADM leiam perfis/tarefas do grupo-base CLI-4071.
    // A autoridade Master vem exclusivamente da sessão segura confirmada pelo Worker;
    // não depende do tipoAcesso legado salvo no documento de administradores.
    const MASTER_OPERATIONAL_BASE_GROUP = 'CLI-4071';
    let masterOperationalBound = false;

    function vincularGrupoBaseMaster() {
        if (window.rotinaMasterSession?.master !== true) return false;
        if (!adminLogadoAtual) return false;
        const groupId = MASTER_OPERATIONAL_BASE_GROUP;
        const alreadyBound = masterOperationalBound
            && adminLogadoAtual.codigoCliente === groupId
            && adminLogadoAtual.grupoId === groupId;

        adminLogadoAtual.codigoCliente = groupId;
        adminLogadoAtual.grupoId = groupId;
        const displayGrupo = document.getElementById('displayCodigoCliente');
        if (displayGrupo) displayGrupo.innerText = groupId;

        if (!alreadyBound) {
            iniciarEscutasFirebase();
            Promise.resolve(carregarRegraAtraso()).catch(error => console.warn('Falha ao carregar regra do grupo-base Master.', error));
            masterOperationalBound = true;
        } else {
            atualizarSelects();
        }

        window.dispatchEvent(new CustomEvent('rotina-master-operational-group-ready', { detail: { grupoId: groupId } }));
        return true;
    }

    window.rotinaMasterVincularGrupoBase = vincularGrupoBaseMaster;
    window.addEventListener('rotina-admin-master-ready', event => {
        if (event.detail?.master === true) setTimeout(vincularGrupoBaseMaster, 0);
    });
    window.addEventListener('rotina-admin-session-ready', event => {
        if (event.detail?.master === true || window.rotinaMasterSession?.master === true) {
            setTimeout(vincularGrupoBaseMaster, 0);
        }
    });

`;
        const loginAnchor = '    window.realizarLogin = async () => {';
        if(!html.includes('async function aguardarConfirmacaoMaster(') && html.includes(loginAnchor)) html=html.replace(loginAnchor,masterBridge+loginAnchor);

        html=html.replace(
          "            if(snap.empty) throw new Error('Cadastro administrativo não encontrado.');",
          `            if(snap.empty) {
                if (await aguardarConfirmacaoMaster(cred.user)) {
                    abrirShellMaster(cred.user);
                    return;
                }
                throw new Error('Cadastro administrativo não encontrado.');
            }`
        );

        html=html.replace(
          `            if(snap.empty) {
                await signOut(auth);
                alert('Sessão autenticada sem cadastro administrativo correspondente.');
                return;
            }`,
          `            if(snap.empty) {
                if (await aguardarConfirmacaoMaster(user)) {
                    abrirShellMaster(user);
                    return;
                }
                await signOut(auth);
                alert('Sessão autenticada sem cadastro administrativo correspondente.');
                return;
            }`
        );

        html=html.replace('./admin-master.js?v=1','./admin-master.js?v=2');
        html=html.replace('./sw.js?v=39','./sw.js?v=42');
        html=html.replace('./sw.js?v=40','./sw.js?v=42');
        html=html.replace('./sw.js?v=41','./sw.js?v=42');

        const addons=[
          '<script type="module" src="./adm-score-history-cards.js?v=2"><\\/script>',
          '<script type="module" src="./adm-monitor-history-fix.js?v=3"><\\/script>',
          '<script type="module" src="./family-alarm-admin.js?v=6"><\\/script>',
          '<script type="module" src="./reward-redemption-notifications.js?v=2"><\\/script>',
          '<script type="module" src="./commercial-access-admin.js?v=2"><\\/script>',
          '<script src="./master-family-tree.js?v=2"><\\/script>',
          '<script type="module" src="./app-monitoring-dashboard.js?v=2"><\\/script>',
          '<script src="./admin-master-integrity-fix.js?v=1"><\\/script>'
        ];
        for(const addon of addons){const m=addon.match(/src="\.\/(.+?)\?/);const nome=m?.[1]||'';if(nome&&!html.includes(nome))html=html.replace('</body>',addon+'\n</body>');}
        document.open();document.write(html);document.close();
      }catch(e){
        document.body.innerHTML='<div class="loading"><strong>Não foi possível abrir o painel.</strong><br><a href="./index-ADMIN-v8.html">Tentar abrir diretamente</a></div>';
      }
    })();
  </script>
</body>
</html>
