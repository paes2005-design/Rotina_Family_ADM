<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar Rotina Family ADM</title><style>body{font-family:system-ui,sans-serif;background:#f4f7f6;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;color:#1f2937}.box{background:#fff;max-width:440px;width:100%;padding:28px;border-radius:20px;box-shadow:0 12px 35px rgba(0,0,0,.12);text-align:center}h1{font-size:1.4rem;color:#357abd}.ok{font-weight:700;color:#166534}</style></head><body><div class="box"><h1>Recuperando o Rotina Family ADM</h1><p id="msg">Limpando a versão antiga do aplicativo...</p></div><script>(async()=>{const msg=document.getElementById('msg');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope.includes('/Rotina_Family_ADM/')).map(r=>r.unregister()));}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('rotina-family-adm-')).map(k=>caches.delete(k)));}msg.className='ok';msg.textContent='Recuperação concluída. Abrindo o aplicativo atualizado...';setTimeout(()=>location.replace('./?recovered='+Date.now()),900);}catch(e){msg.textContent='Não foi possível limpar tudo automaticamente. Feche o navegador e abra novamente.';console.error(e);}})();</script></body></html>
