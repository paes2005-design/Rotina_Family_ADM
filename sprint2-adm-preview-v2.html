<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rotina Family — Sprint 2</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f7fb}#frame{border:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<iframe id="frame" title="Rotina Family Sprint 2"></iframe>
<script>
const frame=document.getElementById('frame');
const ENDPOINT='https://rotina-family-onesignal-scheduler.rotina-family-onesignal-scheduler.workers.dev/app-log';
let lastSrc='';
function current(){const r=(location.hash||'#tarefas').slice(1);return ['tarefas','participantes','monitor'].includes(r)?r:'tarefas'}
function routeUrl(r){return r==='participantes'?'sprint2-participantes-preview-v4.html':'sprint2-tarefas-preview-v9.html'}
function log(event,recurso,level='info'){const item={aplicativo:'adm',versaoMonitor:3,evento:'operacao.sprint2_router.'+event,nivel:level,detalhes:{operacao:event,recurso:String(recurso||''),resultado:level==='error'?'erro':'ok',versao:3},grupoId:'SPRINT2-PREVIEW',perfilId:'',sessaoId:'sprint2-router-v3',clienteEm:new Date().toISOString(),pagina:'sprint2-adm-preview-v2.html',navegador:'browser',online:navigator.onLine,visibilidade:document.visibilityState,instalado:false};if(navigator.onLine)fetch(ENDPOINT,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({events:[item]})}).catch(()=>{})}
function prepareParticipants(){log('participants_ready','participantes')}
function prepareTasks(wanted){let tries=0;const timer=setInterval(()=>{tries++;try{const outer=frame.contentDocument,innerFrame=outer?.querySelector('#app');if(!innerFrame?.contentDocument){if(tries>60){clearInterval(timer);log('tasks_prepare_timeout',wanted,'error')}return}const d=innerFrame.contentDocument,nav=d.querySelector('.nav');if(!d.querySelector('#navParticipants')&&nav){const b=d.createElement('button');b.id='navParticipants';b.innerHTML='<span class="ico">👥</span>Participantes';const monitor=d.querySelector('#navMonitor');nav.insertBefore(b,monitor||null);b.addEventListener('click',()=>{location.hash='#participantes'});}if(wanted==='monitor')d.querySelector('#navMonitor')?.click();else d.querySelector('#navTasks')?.click();clearInterval(timer);log('tasks_ready',wanted)}catch(e){if(tries>60){clearInterval(timer);log('tasks_prepare_error',String(e&&e.message||e),'error')}}},100)}
function show(){const r=current(),src=routeUrl(r);if(lastSrc!==src){lastSrc=src;frame.src=src;frame.onload=()=>{if(r==='participantes')prepareParticipants();else prepareTasks(r)}}else{if(r==='participantes')prepareParticipants();else prepareTasks(r)}log('nav',r)}
window.addEventListener('hashchange',show);window.addEventListener('error',e=>log('runtime_error',String(e&&e.message||current()),'error'));show();log('open',current());
</script>
</body>
</html>
