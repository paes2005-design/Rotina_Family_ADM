name: Sprint 2 Monitor V3 central store integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sprint2-monitor-v3-central-store-integration.yml'
      - 'scripts/sprint2_monitor_v3_integrate_store.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar arquitetura Store central e auditar leitores ativos
        run: python scripts/sprint2_monitor_v3_integrate_store.py

      - name: Confirmar escopo da alteracao
        shell: bash
        run: |
          git diff --name-only | sort | tee /tmp/changed.txt
          printf '%s\n' index-ADMIN-v9.html sprint2-monitor-realdata-v2.js sw.js | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Validar ausencia de leitura direta e rastreio seguro
        shell: bash
        run: |
          node --check sprint2-monitor-realdata-v2.js
          node --check sw.js
          python - <<'PY'
          from pathlib import Path
          m=Path('sprint2-monitor-realdata-v2.js').read_text(encoding='utf-8')
          forbidden=['getDocFromServer(','getDocsFromServer(','getDocFromCache(','getDocsFromCache(','onSnapshot(','storeCentral:false']
          remaining=[x for x in forbidden if x in m]
          assert not remaining, f'Leituras diretas restantes no Monitor: {remaining}'
          assert "monitor-realdata-v3.7-history-trace" in m
          assert "rotinaSprint2SyncNow('monitor-manual')" in m
          assert "origem:'store-central',leituraFirebase:0" in m
          assert "tarefaId:clean(x?.__sourceId)" in m
          assert "execucaoId:clean(x?.__executionId)" in m
          assert "perfilId:clean(x?.__pid)" in m
          assert "historicoEsperadoId:expectedHistoryId(x)" in m
          assert "origemOcorrencia:clean(x?.__resultSource)" in m
          print('MONITOR_STORE_ONLY_AUDIT=OK')
          print('MONITOR_HISTORY_TRACE_AUDIT=OK')
          PY

      - name: Publicar correcao auditada
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-ADMIN-v9.html sprint2-monitor-realdata-v2.js sw.js
          if git diff --cached --quiet; then
            echo 'Correcao ja aplicada.'
          else
            git commit -m 'Sprint 2.1: Monitor rastreia historico ausente pelo Store'
            git push origin main
          fi
