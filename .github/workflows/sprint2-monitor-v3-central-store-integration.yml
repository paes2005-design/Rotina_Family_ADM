name: Sprint 2.1 task edit days migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sprint2-monitor-v3-central-store-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply clean task edit days migration
        run: python .github/scripts/unlock_task_edit_days.py
      - name: Validate behavior and release metadata
        shell: bash
        run: |
          set -euo pipefail
          node --check sprint2-tarefas-realdata-v2.js
          node --check sw.js
          grep -q "tarefas-realdata-v4.4-edit-days" sprint2-tarefas-realdata-v2.js
          grep -q "const newDays=days.filter(d=>!r.days.includes(d))" sprint2-tarefas-realdata-v2.js
          grep -q "docsAdicionados:newDays.length" sprint2-tarefas-realdata-v2.js
          grep -q "Marque outros dias para adicioná-los à tarefa" sprint2-tarefas-realdata-v2.js
          ! grep -q "editor.mode==='edit'&&r&&!r.days.includes(day)" sprint2-tarefas-realdata-v2.js
          ! grep -q "available&&!available.includes(d)" sprint2-tarefas-realdata-v2.js
          grep -q "sprint2-tarefas-realdata-v2.js?v=20260913-edit-days-v46" index-ADMIN-v9.html
          grep -q "rotina-family-adm-v104-production-20260913.3" sw.js
          grep -q "ROTINA_SW_VERSION='104'" sw.js
          grep -q "ROTINA_BUILD_ID='20260913.3'" sw.js
      - name: Publish audited change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sprint2-tarefas-realdata-v2.js index-ADMIN-v9.html sw.js
          if git diff --cached --quiet; then
            echo 'Task edit days migration already applied.'
          else
            git commit -m 'Sprint 2.1: allow adding days while editing tasks'
            git push origin main
          fi
