name: Sprint 2 Monitor V3 central store integration

on:
  push:
    paths:
      - '.github/workflows/sprint2-monitor-v3-central-store-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Expor carga inicial do login ao store central
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sprint2-integracao-login-realdata-v1.js')
          s=p.read_text(encoding='utf-8')
          old="runtime.redemptions=redemptionsSnap.docs.map(d=>({id:d.id,...d.data()}));mapRealDataToState();"
          new="runtime.redemptions=redemptionsSnap.docs.map(d=>({id:d.id,...d.data()}));runtime.lastLoadedAt=Date.now();mapRealDataToState();"
          assert old in s, 'ponto da carga inicial do login nao encontrado'
          s=s.replace(old,new,1)
          anchor="function readOnlyToast(){"
          expose="window.rotinaSprint2BaseSnapshot=()=>({groupId:runtime.groupId,taskDocs:runtime.taskDocs.map(x=>({...x})),history:runtime.history.map(x=>({...x})),lastLoadedAt:Number(runtime.lastLoadedAt)||0});\n\nfunction readOnlyToast(){"
          assert anchor in s, 'ancora para snapshot base nao encontrada'
          s=s.replace(anchor,expose,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Carregar store antes do Monitor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sprint2-integracao-monitor-v2.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="sprint2-integracao-login-realdata-v1.js"></script><script src="sprint2-monitor-realdata-v2.js"></script>'
          new='<script src="sprint2-integracao-login-realdata-v1.js"></script><script src="sprint2-data-store-v1.js"></script><script src="sprint2-monitor-realdata-v2.js"></script>'
          assert old in s, 'ordem de scripts da pagina Sprint 2 nao encontrada'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Migrar Monitor para store central
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('sprint2-monitor-realdata-v2.js')
          s=p.read_text(encoding='utf-8')
          assert 'const CACHE_TTL_MS=120000;' in s, 'TTL antigo nao encontrado'
          s=s.replace('const CACHE_TTL_MS=120000;','const CACHE_TTL_MS=5*60*1000;',1)

          pattern=r"async function loadData\(force=false\)\{[\s\S]*?\n\}\n\nfunction fillParticipants\(\)\{"
          match=re.search(pattern,s)
          assert match, 'loadData do Monitor nao encontrado'
          replacement="""async function loadData(force=false){
  const g=groupId();
  if(!g||g==='SISTEMA'||!document.body.classList.contains('rf-auth-ready'))return false;
  try{
    if(window.rotinaSprint2EnsureData&&window.rotinaSprint2DataSnapshot){
      if(force&&window.rotinaSprint2SyncNow)await window.rotinaSprint2SyncNow('monitor-manual');
      else await window.rotinaSprint2EnsureData();
      const shared=window.rotinaSprint2DataSnapshot();
      if(shared&&clean(shared.groupId).toUpperCase()===g){
        taskDocs=(shared.taskDocs||[]).map(x=>({...x}));
        historyDocs=(shared.history||[]).map(x=>({...x}));
        executionDocs=(shared.executions||[]).map(x=>({...x}));
        alarmDocs=(shared.alarms||[]).map(x=>({...x}));
        lastGroup=g;lastLoadAt=Number(shared.lastServerSync)||Date.now();
        await log('sprint2.monitor_v3_dados',{tarefas:taskDocs.length,historico:historyDocs.length,execucoes:executionDocs.length,alarmes:alarmDocs.length,storeCentral:true});
        return true;
      }
    }
  }catch(e){console.warn('Monitor V3 store central:',e)}
  if(!force&&g===lastGroup&&Date.now()-lastLoadAt<CACHE_TTL_MS&&taskDocs.length)return true;
  if(!await firebaseReady())return false;
  try{
    const q=c=>fs.query(fs.collection(db,c),fs.where('grupoId','==',g));
    const [ts,hs,es,as]=await Promise.all([
      fs.getDocsFromServer(q('tarefas')),
      fs.getDocsFromServer(q('historico')),
      fs.getDocsFromServer(q('execucoes')).catch(()=>({docs:[]})),
      fs.getDocsFromServer(q('despertadores')).catch(()=>({docs:[]}))
    ]);
    taskDocs=ts.docs.map(d=>({id:d.id,...d.data()}));
    historyDocs=hs.docs.map(d=>({id:d.id,...d.data()}));
    executionDocs=(es.docs||[]).map(d=>({id:d.id,...d.data()}));
    alarmDocs=(as.docs||[]).map(d=>({id:d.id,...d.data()}));
    lastGroup=g;lastLoadAt=Date.now();
    await log('sprint2.monitor_v3_dados',{tarefas:taskDocs.length,historico:historyDocs.length,execucoes:executionDocs.length,alarmes:alarmDocs.length,storeCentral:false});
    return true;
  }catch(e){
    console.error('Monitor V3 dados:',e);
    await log('sprint2.monitor_v3_dados_erro',{mensagem:String(e?.message||e).slice(0,80)},'error');
    return false;
  }
}

function fillParticipants(){"""
          s=s[:match.start()]+replacement+s[match.end():]

          old="msg.textContent=ativo?'Alarme ativado.':'Alarme retirado.';lastLoadAt=0;setTimeout(()=>{closeModal();render(true)},350);"
          new="msg.textContent=ativo?'Alarme ativado.':'Alarme retirado.';if(window.rotinaSprint2SyncLocal)await window.rotinaSprint2SyncLocal('monitor-alarme-cache-local').catch(()=>{});setTimeout(()=>{closeModal();render(false)},350);"
          assert old in s, 'pos-write do alarme nao encontrado'
          s=s.replace(old,new,1)

          old="msg.textContent='Decisão registrada na ocorrência.';lastLoadAt=0;setTimeout(()=>{closeModal();render(true)},350);"
          new="msg.textContent='Decisão registrada na ocorrência.';if(window.rotinaSprint2SyncLocal)await window.rotinaSprint2SyncLocal('monitor-revisao-cache-local').catch(()=>{});setTimeout(()=>{closeModal();render(false)},350);"
          assert old in s, 'pos-write da revisao nao encontrado'
          s=s.replace(old,new,1)

          old="Cache de tela: 2 minutos, com atualização manual."
          new="Store central: sincronização remota a cada 5 minutos; ações locais reaproveitam o cache persistente sem nova leitura cobrada."
          assert old in s, 'texto de cache antigo nao encontrado'
          s=s.replace(old,new,1)

          old="document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$('view-monitor')?.classList.contains('active')&&Date.now()-lastLoadAt>CACHE_TTL_MS)render(true)});window.addEventListener('online',()=>{if($('view-monitor')?.classList.contains('active')){lastLoadAt=0;render(true)}});return true;"
          new="document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$('view-monitor')?.classList.contains('active')&&Date.now()-lastLoadAt>CACHE_TTL_MS)render(true)});window.addEventListener('online',()=>{if($('view-monitor')?.classList.contains('active')&&Date.now()-lastLoadAt>CACHE_TTL_MS)render(true)});window.addEventListener('rotina-sprint2-cache-updated',()=>{if($('view-monitor')?.classList.contains('active'))render(false)});return true;"
          assert old in s, 'eventos finais do Monitor nao encontrados'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Sintaxe
        shell: bash
        run: |
          node --check sprint2-integracao-login-realdata-v1.js
          node --check sprint2-data-store-v1.js
          node --check sprint2-monitor-realdata-v2.js

      - name: Auditar arquitetura de dados
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const login=fs.readFileSync('sprint2-integracao-login-realdata-v1.js','utf8');
          const store=fs.readFileSync('sprint2-data-store-v1.js','utf8');
          const monitor=fs.readFileSync('sprint2-monitor-realdata-v2.js','utf8');
          const html=fs.readFileSync('sprint2-integracao-monitor-v2.html','utf8');
          const ok=(v,m)=>{if(!v)throw new Error(m);console.log('OK - '+m)};

          ok(login.includes('window.rotinaSprint2BaseSnapshot'),'login expoe a carga inicial sem nova consulta');
          ok(login.includes('runtime.lastLoadedAt=Date.now()'),'carga inicial informa quando veio do servidor');
          ok(store.includes('const SYNC_MS=5*60*1000'),'store possui ciclo remoto unico de 5 minutos');
          ok(store.includes("persistent")===false,'store nao cria segundo mecanismo de persistencia concorrente');
          ok(store.includes("window.rotinaSprint2SyncLocal")&&store.includes('getDocsFromCache'),'acoes locais podem reler IndexedDB sem leitura remota cobrada');
          ok(store.includes("window.rotinaSprint2SyncNow")&&store.includes('getDocsFromServer'),'atualizacao manual possui caminho remoto explicito');
          ok(store.includes("['tarefas','historico','execucoes','despertadores']"),'store centraliza as colecoes operacionais do Monitor');
          ok(store.includes("queryGroup('execucoes',true)")&&store.includes("queryGroup('despertadores',true)"),'primeira carga reutiliza tarefas/historico do login e complementa somente dados faltantes');
          const loginPos=html.indexOf('sprint2-integracao-login-realdata-v1.js');
          const storePos=html.indexOf('sprint2-data-store-v1.js');
          const monitorPos=html.indexOf('sprint2-monitor-realdata-v2.js');
          ok(loginPos>=0&&storePos>loginPos&&monitorPos>storePos,'ordem de carga e Login -> Store -> Monitor');
          ok(monitor.includes('window.rotinaSprint2DataSnapshot')&&monitor.includes('storeCentral:true'),'Monitor prioriza o store compartilhado');
          ok(monitor.includes('storeCentral:false'),'leitura direta fica apenas como fallback de resiliencia');
          ok(monitor.includes('const CACHE_TTL_MS=5*60*1000'),'Monitor segue a mesma janela de cinco minutos');
          ok(monitor.includes("rotinaSprint2SyncLocal('monitor-alarme-cache-local')")&&monitor.includes("rotinaSprint2SyncLocal('monitor-revisao-cache-local')"),'writes do Monitor atualizam pelo cache local sem forcar servidor');
          ok(monitor.includes("rotina-sprint2-cache-updated"),'Monitor reage a uma unica fonte de atualizacao compartilhada');
          ok(monitor.includes("if(x.__state!=='final')return null"),'store nao reintroduziu calculo de atraso em pendentes');
          ok(!monitor.includes("batch.update(taskRef,patch)"),'revisao continua sem duplicar resultado em tarefas');
          console.log('SPRINT2_CENTRAL_STORE_RESULT=16/16');
          NODE

      - name: Confirmar isolamento da Sprint 2
        shell: bash
        run: |
          git diff --name-only | sort | tee /tmp/changed.txt
          printf '%s\n' sprint2-integracao-login-realdata-v1.js sprint2-integracao-monitor-v2.html sprint2-monitor-realdata-v2.js | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Publicar integracao auditada
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sprint2-integracao-login-realdata-v1.js sprint2-integracao-monitor-v2.html sprint2-monitor-realdata-v2.js
          git commit -m 'Sprint 2: conecta Monitor V3 ao store central de dados'
          git push
