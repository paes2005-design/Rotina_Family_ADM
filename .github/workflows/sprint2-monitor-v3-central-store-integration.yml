name: Sprint 2 Monitor V3 central store integration

on:
  push:
    paths:
      - '.github/workflows/sprint2-monitor-v3-central-store-integration.yml'
      - 'scripts/sprint2_monitor_v3_integrate_store.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Integrar e auditar store central
        run: python scripts/sprint2_monitor_v3_integrate_store.py

      - name: Confirmar isolamento da Sprint 2
        shell: bash
        run: |
          git diff --name-only | sort | tee /tmp/changed.txt
          printf '%s\n' sprint2-integracao-login-realdata-v1.js sprint2-integracao-monitor-v2.html sprint2-monitor-realdata-v2.js | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Publicar integracao auditada
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sprint2-integracao-login-realdata-v1.js sprint2-integracao-monitor-v2.html sprint2-monitor-realdata-v2.js
          git commit -m 'Sprint 2: conecta Monitor V3 ao store central de dados'
          git push
