name: Hotfix ADM runtime e restituição 2026-08-27

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-adm-runtime-20260827.yml'
      - 'scripts/hotfix-adm-runtime-20260827.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Aplicar hotfix
        run: python scripts/hotfix-adm-runtime-20260827.py
      - name: Validar sintaxe e invariantes
        shell: bash
        run: |
          set -euo pipefail
          node --check adm-justification-review.js
          node --check adm-auth-session-v1.js
          node --check adm-startup-stability-v1.js
          node --check adm-zero-points-restitution-20260827.js
          node --check runtime-build-info.js
          node --check sw.js
          python - <<'PY'
          from pathlib import Path
          just=Path('adm-justification-review.js').read_text(encoding='utf-8')
          auth=Path('adm-auth-session-v1.js').read_text(encoding='utf-8')
          startup=Path('adm-startup-stability-v1.js').read_text(encoding='utf-8')
          rest=Path('adm-zero-points-restitution-20260827.js').read_text(encoding='utf-8')
          entry=Path('index.html').read_text(encoding='utf-8')
          main=Path('index-ADMIN-v8.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          runtime=Path('runtime-build-info.js').read_text(encoding='utf-8')
          assert 'getDocs' not in just and 'getDoc' not in just, 'Justificativa ainda faz leitura no clique'
          assert 'rotinaAdmCacheSnapshot' in just
          assert 'histRefs.forEach(ref=>batch.set' in just
          assert 'const VERSION = 7;' in auth and 'const MAX_RESTORE_RETRIES = 1;' in auth
          assert 'await signOut(auth);' not in auth.split('async function installPromotedSession',1)[1].split('async function secureLogin',1)[0]
          assert 'const VERSION = 5;' in startup and 'const MAX_RETRIES = 1;' in startup
          assert '[6500]' in startup and 'flowStartedAt' in startup
          assert "ACTIVE_DATE='2026-08-27'" in rest
          assert "won===0" in rest and 'finalStatus(h.status)' in rest
          assert "entry=20260827.3" in entry
          assert 'adm-zero-points-restitution-20260827.js?v=1' in main
          assert "sw.js?v=62" in main
          assert "ROTINA_SW_VERSION='62'" in sw and "ROTINA_BUILD_ID='20260827.3'" in sw
          assert "build:'20260827.3'" in runtime and "expectedServiceWorkerVersion:'62'" in runtime
          print('HOTFIX_ADM_VALIDADO=OK')
          PY
      - name: Persistir alterações
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adm-justification-review.js adm-auth-session-v1.js adm-startup-stability-v1.js adm-zero-points-restitution-20260827.js runtime-build-info.js index.html index-ADMIN-v8.html sw.js
          if git diff --cached --quiet; then
            echo 'Hotfix já aplicado.'
          else
            git commit -m "Corrigir ADM e restituir pontos zerados de 27/08"
            git push origin HEAD:main
          fi
