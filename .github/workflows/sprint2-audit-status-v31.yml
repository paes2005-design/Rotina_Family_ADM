name: Sprint 2 Audit Status V31
on:
  push:
    paths:
      - '.github/triggers/sprint2-audit-status-v31.txt'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/sprint2-current-integration-audit.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace("tarefas-realdata-v3.0-series-editor", "tarefas-realdata-v3.1-series-status")
          marker="require('(s.alarms||[])' in tasks,'Tarefas lê despertadores pelo Store central')"
          add="""require('tv3Active' in tasks and '>Ativa</option>' in tasks and '>Inativa</option>' in tasks,'editor integrado restaura status Ativa/Inativa')
          require('ativa:v.active' in tasks,'status ativo/inativo é persistido nos documentos de Tarefas')
          require("mode:v.active?v.alarm:'off'" in tasks,'tarefa inativa também desliga seus alarmes')
          """
          if marker not in s: raise SystemExit('marcador não encontrado')
          s=s.replace(marker, marker+'\n          '+add.strip(),1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name paes2005-design
          git config user.email paes2005@gmail.com
          git add .github/workflows/sprint2-current-integration-audit.yml
          git commit -m "Sprint 2: audita status ativo e inativo de tarefas"
          git push
