name: Sprint 2 realdata live log snapshot

on:
  push:
    paths:
      - '.github/workflows/sprint2-realdata-live-log-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DIAG_URL: https://rotina-family-onesignal-scheduler.rotina-family-onesignal-scheduler.workers.dev/diagnostico-tecnico
  MON_URL: https://rotina-family-onesignal-scheduler.rotina-family-onesignal-scheduler.workers.dev/monitoramento

jobs:
  realdata-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Ler saude viva do Worker
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 25 "$MON_URL" -o /tmp/monitor.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/monitor.json',encoding='utf-8'))
          print('MONITOR_STATUS=',d.get('status'))
          print('LAST_RUN_AT=',d.get('lastRunAt'))
          print('HEALTH_REASONS=',json.dumps(d.get('healthReasons',{}),ensure_ascii=False))
          PY

      - name: Ler eventos vivos da integracao realdata e Monitor
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 25 "$DIAG_URL?limit=1000" -o /tmp/diag.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/diag.json',encoding='utf-8'))
          print('DIAG_STATUS=',d.get('status'))
          print('GENERATED_AT=',d.get('generatedAt'))
          logs=d.get('logs',[]) or []
          arr=[]
          monitor=[]
          for x in logs:
              e=str(x.get('evento',''))
              p=str(x.get('pagina',''))
              if e.startswith('sprint2.realdata_') or e.startswith('sprint2.monitor_') or p in ('sprint2-integracao-login-realdata-v1.html','sprint2-integracao-monitor-v1.html'):
                  arr.append(x)
              if e.startswith('sprint2.monitor_') or p=='sprint2-integracao-monitor-v1.html':
                  monitor.append(x)
          arr.sort(key=lambda x:str(x.get('clienteEm','')),reverse=True)
          monitor.sort(key=lambda x:str(x.get('clienteEm','')),reverse=True)
          print('REALDATA_EVENT_COUNT=',len(arr))
          counts={}
          for x in arr:
              e=str(x.get('evento','')); counts[e]=counts.get(e,0)+1
          print('REALDATA_EVENT_COUNTS=',json.dumps(counts,ensure_ascii=False,sort_keys=True))
          mcounts={}
          for x in monitor:
              e=str(x.get('evento','')); mcounts[e]=mcounts.get(e,0)+1
          print('SPRINT2_MONITOR_EVENT_COUNT=',len(monitor))
          print('SPRINT2_MONITOR_EVENT_COUNTS=',json.dumps(mcounts,ensure_ascii=False,sort_keys=True))
          print('SPRINT2_MONITOR_ERRORS=',sum(1 for x in monitor if str(x.get('nivel','')).lower() in ('error','fatal')))
          for x in monitor[:80]:
              safe={'clienteEm':x.get('clienteEm'),'evento':x.get('evento'),'nivel':x.get('nivel'),'grupoId':x.get('grupoId'),'pagina':x.get('pagina'),'detalhes':x.get('detalhes',{})}
              print('SPRINT2_MONITOR_EVENT=',json.dumps(safe,ensure_ascii=False))
          PY
