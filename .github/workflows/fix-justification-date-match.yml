name: Corrigir correspondencia de data da justificativa
on:
  push:
    paths:
      - '.github/triggers/fix-justification-date-match.txt'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Alinhar Monitor e Justificativas ao mesmo historico
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('adm-justification-review.js')
          s=p.read_text()
          old="const candidatos=historico.filter(h=>String(h.tarefaId||'')===String(t.id||'')&&String(h.data||'')===data&&(!t.perfilId||!h.perfilId||String(h.perfilId)===String(t.perfilId)));"
          new="const candidatos=historico.filter(h=>String(h.tarefaId||'')===String(t.id||'')&&String(h.data||h.dataExecucao||'')===data&&(!t.perfilId||!h.perfilId||String(h.perfilId)===String(t.perfilId)));"
          if old not in s: raise SystemExit('Filtro de data esperado nao encontrado')
          s=s.replace(old,new,1)
          old_try="  try{\n    if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(data))throw new Error('Selecione a data da ocorrência no Monitor antes de revisar.');"
          new_try="  try{\n    window.rotinaLog?.('justificativa.abertura_inicio',{data,temId:Boolean(ctx.id)},'info');\n    if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(data))throw new Error('Selecione a data da ocorrência no Monitor antes de revisar.');"
          if old_try not in s: raise SystemExit('Inicio de abertura esperado nao encontrado')
          s=s.replace(old_try,new_try,1)
          old_catch="  }catch(e){console.error('Revisão de justificativa:',e);msg.textContent=e.message||'Não foi possível carregar a justificativa.';}"
          new_catch="  }catch(e){console.error('Revisão de justificativa:',e);window.rotinaLog?.('justificativa.abertura_erro',{data,temId:Boolean(ctx.id),mensagem:String(e?.message||e).slice(0,140)},'error');msg.textContent=e.message||'Não foi possível carregar a justificativa.';}"
          if old_catch not in s: raise SystemExit('Catch de abertura esperado nao encontrado')
          s=s.replace(old_catch,new_catch,1)
          p.write_text(s)

          p=Path('adm-startup-stability-v1.js'); s=p.read_text(); s=s.replace("./adm-justification-review.js?v=6","./adm-justification-review.js?v=7"); p.write_text(s)
          p=Path('sw.js'); s=p.read_text(); s=s.replace("rotina-family-adm-v71","rotina-family-adm-v72").replace("ROTINA_SW_VERSION='71'","ROTINA_SW_VERSION='72'").replace("20260830.1","20260830.2").replace("adm-justification-review.js?v=6","adm-justification-review.js?v=7"); p.write_text(s)
          p=Path('runtime-build-info.js'); s=p.read_text(); s=s.replace("20260830.1","20260830.2").replace("expectedServiceWorkerVersion:'71'","expectedServiceWorkerVersion:'72'"); p.write_text(s)
          p=Path('index.html'); s=p.read_text(); s=s.replace("20260830.1","20260830.2"); p.write_text(s)
          PY
          node --check adm-justification-review.js
          node --check adm-startup-stability-v1.js
          node --check sw.js
          grep -F "h.data||h.dataExecucao" adm-justification-review.js
          grep -F "justificativa.abertura_inicio" adm-justification-review.js
          grep -F "rotina-family-adm-v72" sw.js
      - name: Publicar correção
        shell: bash
        run: |
          git config user.name 'rotina-family-fix-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add adm-justification-review.js adm-startup-stability-v1.js sw.js runtime-build-info.js index.html
          git commit -m 'Alinhar data do historico entre Monitor e Justificativas'
          git push
