name: Corrigir travamento e captura da justificativa
on:
  push:
    paths:
      - '.github/triggers/fix-justification-date-match.txt'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corrigir guardiao e captura do clique
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'{label}: trecho esperado nao encontrado')
              return text.replace(old, new, 1)

          # 1) Depois de sessao_pronta, o guardiao nao pode mais cobrir o painel.
          p=Path('adm-startup-stability-v1.js')
          s=p.read_text()
          s=replace_once(s, 'const VERSION = 6;', 'const VERSION = 7;', 'versao startup')
          s=replace_once(
              s,
              "import './adm-justification-review.js?v=7';",
              "import './adm-justification-review.js?v=8';",
              'versao justificativa importada'
          )
          s=replace_once(
              s,
              "function show(text = 'Carregando painel...') {\n  const el = shield();",
              "function show(text = 'Carregando painel...') {\n  if(sessionReady && authenticated){hide();return;}\n  const el = shield();",
              'bloqueio do shield apos sessao pronta'
          )
          old_guard="""  const accessVisible = visible(access);\n  const mainVisible = visible(main);\n\n  if (accessVisible || mainVisible) {"""
          new_guard="""  const accessVisible = visible(access);\n  const mainVisible = visible(main);\n\n  if (sessionReady && authenticated) {\n    if (!mainVisible && main) {\n      main.style.display = 'block';\n      if (access) access.style.display = 'none';\n      log('startup.adm_painel_restaurado_pos_sessao', { motivo: reason }, 'warning');\n    }\n    blankSince = 0;\n    hide();\n    return;\n  }\n\n  if (accessVisible || mainVisible) {"""
          s=replace_once(s, old_guard, new_guard, 'restauracao do painel apos sessao pronta')
          p.write_text(s)

          # 2) Capturar a bandeira antes de listeners antigos poderem interromper o clique.
          p=Path('adm-justification-review.js')
          s=p.read_text()
          s=replace_once(
              s,
              "if(mobile){e.preventDefault();const r=mobile.closest('tr');",
              "if(mobile){window.rotinaLog?.('justificativa.clique_capturado',{origem:'mobile'},'info');e.preventDefault();const r=mobile.closest('tr');",
              'telemetria clique mobile'
          )
          s=replace_once(
              s,
              "  if(flag){\n    e.preventDefault();",
              "  if(flag){\n    window.rotinaLog?.('justificativa.clique_capturado',{origem:'desktop'},'info');\n    e.preventDefault();",
              'telemetria clique desktop'
          )
          marker="document.addEventListener('click',e=>{"
          pos=s.rfind(marker)
          if pos < 0:
              raise SystemExit('listener da justificativa nao encontrado')
          tail=s[pos:].rstrip()
          if tail.endswith('});'):
              end=s.rfind('\n});')
              if end < pos:
                  raise SystemExit('fim do listener da justificativa nao encontrado')
              s=s[:end]+'\n},true);'+s[end+4:]
          elif not tail.endswith('},true);'):
              raise SystemExit('formato inesperado do listener da justificativa')
          p.write_text(s)

          # 3) Forcar atualizacao do PWA e deixar a versao auditavel.
          p=Path('index-ADMIN-v8.html')
          s=p.read_text()
          s=replace_once(s, './adm-startup-stability-v1.js?v=5', './adm-startup-stability-v1.js?v=6', 'versao startup no html')
          p.write_text(s)

          p=Path('sw.js')
          s=p.read_text()
          s=s.replace("rotina-family-adm-v72","rotina-family-adm-v73")
          s=s.replace("ROTINA_SW_VERSION='72'","ROTINA_SW_VERSION='73'")
          s=s.replace('20260830.2','20260830.3')
          s=s.replace('adm-justification-review.js?v=7','adm-justification-review.js?v=8')
          p.write_text(s)

          p=Path('runtime-build-info.js')
          s=p.read_text().replace('20260830.2','20260830.3').replace("expectedServiceWorkerVersion:'72'","expectedServiceWorkerVersion:'73'")
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text().replace('20260830.2','20260830.3')
          p.write_text(s)
          PY
          node --check adm-startup-stability-v1.js
          node --check adm-justification-review.js
          node --check sw.js
          grep -F "const VERSION = 7" adm-startup-stability-v1.js
          grep -F "sessionReady && authenticated" adm-startup-stability-v1.js
          grep -F "justificativa.clique_capturado" adm-justification-review.js
          grep -F "},true);" adm-justification-review.js
          grep -F "rotina-family-adm-v73" sw.js
          grep -F "20260830.3" runtime-build-info.js
      - name: Publicar correção
        shell: bash
        run: |
          git config user.name 'rotina-family-fix-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add adm-startup-stability-v1.js adm-justification-review.js index-ADMIN-v8.html sw.js runtime-build-info.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Impedir retravamento do ADM e capturar clique da justificativa'
          git push
