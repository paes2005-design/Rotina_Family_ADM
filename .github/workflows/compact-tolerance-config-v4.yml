name: Compact tolerance config v4

on:
  push:
    paths:
      - '.github/triggers/compact-tolerance-config-v4.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove obsolete controls and legacy inline rule
        shell: python
        run: |
          from pathlib import Path

          p=Path('adm-tolerance-rule-v3.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("    <input id=\"regraPct75\" type=\"hidden\" value=\"75\">\n    <input id=\"regraPct50\" type=\"hidden\" value=\"50\">\n    <input id=\"regraPct0\" type=\"hidden\" value=\"0\">\n","")
          s=s.replace("<div id=\"previewRegraAtrasoAdmin\" style=\"padding:10px;background:#f8fafc;border-radius:8px;font-size:13px;margin:10px 0\"></div>","<div id=\"previewRegraAtrasoAdmin\" style=\"padding:8px;background:#f8fafc;border-radius:8px;font-size:12px;line-height:1.35;margin:8px 0\"></div>")
          p.write_text(s,encoding='utf-8')

          h=Path('index-ADMIN-v8.html')
          t=h.read_text(encoding='utf-8')
          start=t.find('<div id="modalRegraAtrasoAdmin"')
          end=t.find('\n\n<script type="module">',start)
          if start<0 or end<0:
              raise SystemExit('modal block not found')
          modal='''<div id="modalRegraAtrasoAdmin" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10000;align-items:center;justify-content:center;padding:16px">
  <div style="background:white;max-width:520px;width:100%;border-radius:16px;padding:22px;box-shadow:0 12px 40px rgba(0,0,0,.25)">
    <h2 style="margin-top:0">Configurar janela adicional de tolerância</h2>
    <p style="color:#666;font-size:13px">Defina somente quanto da janela adicional padrão de 25% será utilizada. As faixas de 75% e 50% são calculadas automaticamente e não são configuráveis.</p>
    <div class="form-group"><label>Uso da janela adicional padrão (%)</label><input id="regraPct100" type="number" min="0" max="100" value="100"></div>
    <div id="previewRegraAtrasoAdmin" style="padding:8px;background:#f8fafc;border-radius:8px;font-size:12px;line-height:1.35;margin:8px 0"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
      <button class="btn-action" style="width:auto;background:#64748b" onclick="fecharConfiguracaoRegraAtraso()">Cancelar</button>
      <button class="btn-action" style="width:auto;background:#2563eb" onclick="salvarConfiguracaoRegraAtraso()">Salvar tolerância</button>
    </div>
  </div>
</div>'''
          t=t[:start]+modal+t[end:]
          a=t.find('    const REGRA_ATRASO_PADRAO = { dentroLimites:100, atrasoLeve:75, atrasoMaior:50, estourado:0 };')
          b=t.find('    async function hashPin(pin) {',a)
          if a<0 or b<0:
              raise SystemExit('legacy inline rule block not found')
          t=t[:a]+"    async function carregarRegraAtraso(){}\n\n"+t[b:]
          h.write_text(t,encoding='utf-8')
      - name: Validate cleanup
        run: |
          node --check adm-tolerance-rule-v3.js
          if grep -q 'Primeiros +12,5% após zerar' index-ADMIN-v8.html; then exit 1; fi
          if grep -q 'regraPct75' index-ADMIN-v8.html; then exit 1; fi
          if grep -q 'regraPct50' index-ADMIN-v8.html; then exit 1; fi
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adm-tolerance-rule-v3.js index-ADMIN-v8.html
          git commit -m "Remove legacy tolerance controls from ADM"
          git push
