name: Compact tolerance config v4

on:
  push:
    paths:
      - '.github/triggers/compact-tolerance-config-v4.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove obsolete controls and keep current panel size
        shell: python
        run: |
          from pathlib import Path
          p=Path('adm-tolerance-rule-v3.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("    <input id=\"regraPct75\" type=\"hidden\" value=\"75\">\n    <input id=\"regraPct50\" type=\"hidden\" value=\"50\">\n    <input id=\"regraPct0\" type=\"hidden\" value=\"0\">\n","")
          s=s.replace("<div id=\"previewRegraAtrasoAdmin\" style=\"padding:10px;background:#f8fafc;border-radius:8px;font-size:13px;margin:10px 0\"></div>","<div id=\"previewRegraAtrasoAdmin\" style=\"padding:8px;background:#f8fafc;border-radius:8px;font-size:12px;line-height:1.35;margin:8px 0\"></div>")
          s=s.replace("A regra padrão permite uma janela adicional máxima de 25% da tolerância-base, dividida igualmente entre as faixas 75% e 50%. Escolha quanto dessa janela adicional a família utilizará. <strong>Este ajuste muda somente o tempo, nunca os percentuais fixos de pontuação 100% / 75% / 50% / 0%.</strong>","Escolha quanto da janela adicional padrão de 25% da tolerância-base a família utilizará. O sistema divide automaticamente essa janela entre as faixas 75% e 50%. <strong>A pontuação continua fixa em 100% / 75% / 50% / 0%.</strong>")
          p.write_text(s,encoding='utf-8')
      - name: Validate syntax
        run: node --check adm-tolerance-rule-v3.js
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adm-tolerance-rule-v3.js
          git commit -m "Simplify tolerance configuration panel"
          git push
