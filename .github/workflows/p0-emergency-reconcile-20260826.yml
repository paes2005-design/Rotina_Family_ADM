name: P0 emergency reconciliation 2026-08-26

on:
  push:
    branches: [main]
    paths:
      - '.github/p0-emergency-reconcile-20260826-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Inject emergency reconciliation module
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-ADMIN-v8.html')
          s=p.read_text(encoding='utf-8')
          tag='<script type="module" src="./adm-emergency-reconcile-20260826.js?v=1"></script>'
          if 'adm-emergency-reconcile-20260826.js' not in s:
              if '</body>' not in s: raise SystemExit('body close marker missing')
              s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')

      - name: Validate
        run: |
          node --check adm-emergency-reconcile-20260826.js
          grep -F "adm-emergency-reconcile-20260826.js?v=1" index-ADMIN-v8.html
          grep -F "compensacaoTecnicaMotivo:'indisponibilidade_app_2026-08-26'" adm-emergency-reconcile-20260826.js

      - name: Commit loader
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-ADMIN-v8.html
          git diff --cached --quiet || git commit -m "Activate emergency task reconciliation"
          git push origin main
