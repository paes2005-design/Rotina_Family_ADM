name: Corrigir versionamento ADM
on:
  push:
    paths:
      - '.github/triggers/fix-version-pipeline.txt'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Alinhar build e Service Worker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          build='20260830.7'
          sw='77'

          def replace_exact(path, old, new, expected=1):
              p=Path(path)
              s=p.read_text()
              count=s.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: esperado {expected} ocorrência(s) de {old!r}, achei {count}')
              p.write_text(s.replace(old,new))

          replace_exact('index-ADMIN-v8.html', "navigator.serviceWorker.register('./sw.js?v=69',{updateViaCache:'none'})", f"navigator.serviceWorker.register('./sw.js?v={sw}',{{updateViaCache:'none'}})")

          p=Path('index.html'); s=p.read_text()
          if s.count('20260830.5') != 2:
              raise SystemExit(f'index.html: esperado 2 ocorrências de 20260830.5, achei {s.count("20260830.5")}')
          p.write_text(s.replace('20260830.5', build))

          p=Path('runtime-build-info.js'); s=p.read_text()
          if "build:'20260830.5'" not in s or "expectedServiceWorkerVersion:'75'" not in s:
              raise SystemExit('runtime-build-info.js não está no estado esperado')
          s=s.replace("build:'20260830.5'", f"build:'{build}'")
          s=s.replace("expectedServiceWorkerVersion:'75'", f"expectedServiceWorkerVersion:'{sw}'")
          p.write_text(s)

          p=Path('sw.js'); s=p.read_text()
          required=["const CACHE_NAME='rotina-family-adm-v76'","const ROTINA_SW_VERSION='76'","const ROTINA_BUILD_ID='20260830.6'","runtime-build-info.js?v=20260830.6"]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('sw.js não está no estado esperado: '+repr(missing))
          s=s.replace("const CACHE_NAME='rotina-family-adm-v76'", "const CACHE_NAME='rotina-family-adm-v77'")
          s=s.replace("const ROTINA_SW_VERSION='76'", "const ROTINA_SW_VERSION='77'")
          s=s.replace("const ROTINA_BUILD_ID='20260830.6'", "const ROTINA_BUILD_ID='20260830.7'")
          s=s.replace('runtime-build-info.js?v=20260830.6','runtime-build-info.js?v=20260830.7')
          p.write_text(s)

          checks={
            'index-ADMIN-v8.html': ["./sw.js?v=77"],
            'index.html': ['20260830.7'],
            'runtime-build-info.js': ["build:'20260830.7'", "expectedServiceWorkerVersion:'77'"],
            'sw.js': ["rotina-family-adm-v77", "ROTINA_SW_VERSION='77'", "ROTINA_BUILD_ID='20260830.7'", 'runtime-build-info.js?v=20260830.7']
          }
          for path, needles in checks.items():
              text=Path(path).read_text()
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'FALHA {path}: {needle}')
          print('VERSION_PIPELINE_OK build=20260830.7 sw=77')
          PY
      - name: Gravar correção
        shell: bash
        run: |
          git config user.name 'rotina-family-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index-ADMIN-v8.html index.html runtime-build-info.js sw.js
          git commit -m 'Alinhar pipeline de atualização no build 20260830.7'
          git push
