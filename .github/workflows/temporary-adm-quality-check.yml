name: Rotina Family ADM regression audit
on:
  push:
    paths:
      - '.github/workflows/temporary-adm-quality-check.yml'
      - 'adm-regression-audit.js'
      - '*.js'
      - '*.css'
      - '*.html'
      - 'manifest.json'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and JSON
        run: |
          node --check dashboard-ranking-pro.js
          node --check monitor-pro.js
          node --check rewards-admin-ui-v2.js
          node --check manage-pro.js
          node --check mobile-app-ui.js
          node --check adm-justification-review.js
          node --check adm-early-start-ui.js
          node --check adm-score-history-cards.js
          node --check adm-monitor-history-fix.js
          node --check family-alarm-admin.js
          node --check alarm-date-core.js
          node --check reward-redemption-notifications.js
          node --check adm-regression-audit.js
          node --check sprint2-tarefas-v9-audit.js
          node --check sw.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest OK')"
      - name: Sprint 2 tarefas v9 audit
        run: node sprint2-tarefas-v9-audit.js
      - name: Sprint 2 remote telemetry smoke test
        shell: bash
        run: |
          body='{"events":[{"aplicativo":"adm","versaoMonitor":9,"evento":"sprint2.tarefas.ci_smoke","nivel":"info","detalhes":{"source":"github-actions-v9"},"grupoId":"SPRINT2-PREVIEW","perfilId":"","sessaoId":"ci-v9","clienteEm":"2026-08-28T08:00:00.000Z","pagina":"sprint2-tarefas-preview-v9.html","navegador":"CI","online":true,"visibilidade":"visible","instalado":false}]}'
          response=$(curl --fail-with-body -sS -X POST 'https://rotina-family-onesignal-scheduler.rotina-family-onesignal-scheduler.workers.dev/app-log' -H 'content-type: application/json' --data "$body")
          echo "$response"
          RESPONSE="$response" node -e "const r=JSON.parse(process.env.RESPONSE); if(Number(r.accepted)!==1||Number(r.dropped)!==0) throw new Error('Worker nao confirmou o log'); console.log('REMOTE_TELEMETRY=OK')"
      - name: Legacy ADM regression audit (non-blocking)
        continue-on-error: true
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='adm-regression-audit.js';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace("rotina-family-adm-v46","rotina-family-adm-v64");
          s=s.replace("assert(notify.includes(\"collection(db, 'resgates')\"),'redemption notification listens to the resgates collection');","assert(notify.includes(\"window.rotinaAdmCacheSnapshot?.().resgates\"),'redemption notification reads the shared ADM cache');");
          fs.writeFileSync(p,s);
          NODE
          node adm-regression-audit.js
      - name: Historical monitor and service worker isolation
        run: |
          node <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('adm-monitor-history-fix.js','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg);console.log('OK - '+msg)};
          assert(!h.includes('setInterval('),'historical monitor adds no continuous polling');
          assert(h.includes("collection(db,'historico')")&&h.includes("where('grupoId','==',grupoId)"),'historical monitor reads group history');
          assert(h.includes("(h.data||h.dataExecucao)===data"),'historical occurrence is bound to selected date');
          assert(h.includes('h.tarefaId===t.id'),'history is matched to the scheduled task');
          assert(h.includes('toleranciaConsumidaSeg'),'exact tolerance consumption is displayed');
          assert(h.includes('inicioExecutadoEm')&&h.includes('terminoExecutadoEm'),'exact execution timestamps are used');
          assert(h.includes("| Consumido: ${formatarSegundos(consumido)}"),'monitor exposes consumed tolerance');
          assert(sw.includes("const CACHE_NAME='rotina-family-adm-v64'"),'ADM cache is v64');
          assert(sw.includes("'./adm-monitor-history-fix.js'"),'historical monitor is cached offline');
          assert(sw.includes("adm-monitor-history-fix.js?v=3")&&sw.includes('faltantes.push'),'historical monitor remains available to production ADM');
          assert(sw.includes('function deveAplicarAddons(url)'),'service worker has an explicit addon scope guard');
          assert(sw.includes('url.pathname===APP_MAIN_PATH'),'addons are restricted to the production ADM path');
          assert(sw.includes('deveAplicarAddons(url)?respostaComAddons(response):response'),'preview navigations are returned without production addon injection');
          console.log('ALL ADM HISTORICAL MONITOR / SW ISOLATION CHECKS PASSED');
          NODE
