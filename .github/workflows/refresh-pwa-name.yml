name: Refresh ADM PWA name
on:
  push:
    paths:
      - '.github/workflows/refresh-pwa-name.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force fresh ADM manifest and cache
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              n=s.count(old)
              if n != 1: raise SystemExit(f'{path}: expected 1 occurrence, found {n}: {old}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          replace_exact('index-ADMIN-v8.html','<title>Espaço de Metas — Painel do Administrador</title>','<title>Rotina Family ADM</title>')
          replace_exact('index-ADMIN-v8.html','<link rel="manifest" href="manifest.json">','<link rel="manifest" href="manifest.json?v=34">')
          replace_exact('index-ADMIN-v8.html',"navigator.serviceWorker.register('./sw.js')","navigator.serviceWorker.register('./sw.js?v=34')")
          replace_exact('sw.js',"const CACHE_NAME='rotina-family-adm-v33';","const CACHE_NAME='rotina-family-adm-v34';")
          replace_exact('sw.js',"'./manifest.json'","'./manifest.json?v=34'")
          replace_exact('sw.js',"/\\.(?:js|css|html)$/.test(url.pathname)","/\\.(?:js|css|html|json)$/.test(url.pathname)")
          PY
      - name: Verify fresh ADM PWA identity
        run: |
          grep -F '<title>Rotina Family ADM</title>' index-ADMIN-v8.html
          grep -F 'manifest.json?v=34' index-ADMIN-v8.html
          grep -F "sw.js?v=34" index-ADMIN-v8.html
          grep -F "rotina-family-adm-v34" sw.js
          grep -F "html|json" sw.js
          grep -F '"name": "Rotina Family ADM"' manifest.json
          grep -F '"short_name": "Rotina Family ADM"' manifest.json
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/refresh-pwa-name.yml
          git add index-ADMIN-v8.html sw.js .github/workflows/refresh-pwa-name.yml
          git commit -m "Force fresh Rotina Family ADM PWA identity"
          git push
