name: Sprint 2 observability Recompensas V1
on:
  push:
    paths:
      - '.github/triggers/sprint2-observability-rewards-v1.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit-observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrar observabilidade
        run: python scripts/sprint2_observability_rewards_v1.py
      - name: Validar sintaxe
        run: |
          node --check sprint2-observability-v1.js
          node --check sprint2-recompensas-realdata-v1.js
          node --check sprint2-data-store-v1.js
      - name: Auditar telemetria e arquitetura
        run: |
          python - <<'PY'
          from pathlib import Path
          o=Path('sprint2-observability-v1.js').read_text()
          h=Path('sprint2-integracao-recompensas-v1.html').read_text()
          r=Path('sprint2-recompensas-realdata-v1.js').read_text()
          s=Path('sprint2-data-store-v1.js').read_text()
          checks={
            'grupo dinamico no log': "document.getElementById('topGroup')" in o,
            'pagina dinamica no log': "location.pathname" in o,
            'telemetria real carregada': 'sprint2-observability-v1.js' in h,
            'recompensas usa techLog': 'window.techLog' in r,
            'js sem listener recompensas': 'onSnapshot(' not in r,
            'uma escuta central': s.count('fs.onSnapshot(')==1,
            'escuta apenas execucoes': "fs.collection(db,'execucoes')" in s,
          }
          for k,v in checks.items(): print(('OK' if v else 'FALHA'),k)
          if not all(checks.values()): raise SystemExit(1)
          print(f'OK: {sum(checks.values())}/{len(checks)} verificações')
          PY
      - name: Preservar módulos fechados
        run: git diff --exit-code -- sprint2-participantes-realdata-v1.js sprint2-monitor-realdata-v2.js sprint2-integracao-participantes-v1.html
      - name: Publicar ajuste de observabilidade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sprint2-integracao-recompensas-v1.html
          if git diff --cached --quiet; then
            echo 'Sem alterações pendentes.'
          else
            git commit -m 'Sprint 2: corrige identificação dos logs de Recompensas'
            git push
          fi