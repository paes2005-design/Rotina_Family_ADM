name: Sprint 2.0 - corrigir identificacao de build ADM

on:
  push:
    paths:
      - '.github/workflows/sprint2-fix-adm-build-identification.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Alinhar build e telemetria do ADM
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: esperado 1 match, encontrado {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Runtime de identificação: nova release e novo SW esperado.
          replace_once('runtime-build-info.js', "build:'20260915.5'", "build:'20260915.6'")
          replace_once('runtime-build-info.js', "expectedServiceWorkerVersion:'107'", "expectedServiceWorkerVersion:'108'")

          # HTML oficial: carregar o runtime de build e identificar esta release.
          p = Path('index-ADMIN-v9.html')
          text = p.read_text(encoding='utf-8')
          anchor = '<script src="sprint2-observability-v1.js"></script>'
          runtime = '<script src="runtime-build-info.js?v=20260915.6"></script>'
          if runtime not in text:
              if text.count(anchor) != 1:
                  raise SystemExit(f'index-ADMIN-v9.html: anchor de observabilidade encontrado {text.count(anchor)} vezes')
              text = text.replace(anchor, anchor + runtime, 1)
          text = text.replace("window.ROTINA_OFFICIAL_BUILD={channel:'production',version:'20260915.5',appVersion:'2.0.0'};", "window.ROTINA_OFFICIAL_BUILD={channel:'production',version:'20260915.6',appVersion:'2.0.0'};", 1)
          text = text.replace("navigator.serviceWorker.register('./sw.js?v=20260915.5'", "navigator.serviceWorker.register('./sw.js?v=20260915.6'", 1)
          p.write_text(text, encoding='utf-8')

          # Entrada do app: não continuar apontando para a release antiga.
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          if '20260905.12' not in text:
              raise SystemExit('index.html: release antiga esperada não encontrada')
          text = text.replace('20260905.12', '20260915.6')
          p.write_text(text, encoding='utf-8')

          # Service Worker: cache e resposta de build devem refletir a mesma release.
          replace_once('sw.js', "const CACHE_NAME='rotina-family-adm-v107-sprint2-days-20260915.5';", "const CACHE_NAME='rotina-family-adm-v108-build-id-20260915.6';")
          replace_once('sw.js', "const ROTINA_SW_VERSION='107';", "const ROTINA_SW_VERSION='108';")
          replace_once('sw.js', "const ROTINA_BUILD_ID='20260915.5';", "const ROTINA_BUILD_ID='20260915.6';")

          p = Path('sw.js')
          text = p.read_text(encoding='utf-8')
          text = text.replace("'./','./index.html','./index-ADMIN-v9.html','./manifest.json?v=20260905.12',", "'./','./index.html','./index-ADMIN-v9.html','./manifest.json?v=20260915.6',", 1)
          anchor = "'./sprint2-teste-core.js','./sprint2-observability-v1.js','./sprint2-integracao-login-realdata-bridge-v1.js',"
          replacement = "'./sprint2-teste-core.js','./sprint2-observability-v1.js','./runtime-build-info.js?v=20260915.6','./sprint2-integracao-login-realdata-bridge-v1.js',"
          if text.count(anchor) != 1:
              raise SystemExit(f'sw.js: anchor APP_SHELL encontrado {text.count(anchor)} vezes')
          text = text.replace(anchor, replacement, 1)
          text = text.replace("index-ADMIN-v9.html?release=20260905.12", "index-ADMIN-v9.html?release=20260915.6")
          p.write_text(text, encoding='utf-8')

          # Auditoria estrutural antes do commit.
          checks = {
              'runtime-build-info.js': ["build:'20260915.6'", "expectedServiceWorkerVersion:'108'"],
              'index-ADMIN-v9.html': ['runtime-build-info.js?v=20260915.6', "version:'20260915.6'", "./sw.js?v=20260915.6"],
              'index.html': ['./sw.js?v=20260915.6', "params.set('release','20260915.6')", 'index-ADMIN-v9.html?release=20260915.6'],
              'sw.js': ["ROTINA_SW_VERSION='108'", "ROTINA_BUILD_ID='20260915.6'", 'runtime-build-info.js?v=20260915.6', 'release=20260915.6'],
          }
          for path, needles in checks.items():
              data = Path(path).read_text(encoding='utf-8')
              missing = [x for x in needles if x not in data]
              if missing:
                  raise SystemExit(f'{path}: auditoria falhou: {missing}')
          print('AUDITORIA_OK build=20260915.6 sw=108')
          PY
      - name: Commitar correção
        run: |
          git config user.name "paes2005-design"
          git config user.email "paes2005@gmail.com"
          git add runtime-build-info.js index-ADMIN-v9.html index.html sw.js
          git diff --cached --check
          git commit -m "Sprint 2.0: corrige identificacao do build ADM"
          git push
