name: Rename ADM app label
on:
  push:
    paths:
      - '.github/workflows/rename-app-label.yml'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename installed ADM app label only
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index-ADMIN-v8.html')
          s = p.read_text(encoding='utf-8')
          old = '<meta name="apple-mobile-web-app-title" content="Metas Admin">'
          new = '<meta name="apple-mobile-web-app-title" content="Rotina Family ADM">'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one old ADM app-title, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify labels
        run: |
          grep -F '<meta name="apple-mobile-web-app-title" content="Rotina Family ADM">' index-ADMIN-v8.html
          grep -F '<title>Rotina Family ADM</title>' index.html
          grep -F '"name": "Rotina Family ADM"' manifest.json
          grep -F '"short_name": "Rotina Family ADM"' manifest.json
      - name: Commit label change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/rename-app-label.yml
          git add index-ADMIN-v8.html .github/workflows/rename-app-label.yml
          git commit -m "Rename ADM app label to Rotina Family ADM"
          git push
