name: Sprint2 Monitor Remove Legend V31

on:
  push:
    paths:
      - '.github/workflows/sprint2-monitor-remove-legend-v31.yml'

permissions:
  contents: write

jobs:
  close-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover legenda redundante do Monitor V3.1
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sprint2-monitor-realdata-v2.js')
          s=p.read_text(encoding='utf-8')
          old="  const legend=`<div class=\"monitor-v2-legend\"><span class=\"result-pending\">⚪ Pendente</span><span class=\"result-running\">🔵 Em andamento</span><span class=\"result-100\">🟢 No prazo · 100%</span><span class=\"result-75\">🟡 Atraso leve · 75%</span><span class=\"result-50\">🟠 Atraso maior · 50%</span><span class=\"result-0\">🔴 Tolerância estourada · 0%</span></div>`;\n"
          if old not in s:
              raise SystemExit('legenda atual nao encontrada')
          s=s.replace(old,'',1)
          s=s.replace("  $('monitorTimeline').innerHTML=legend+(rows.length?header+rows.map(rowHtml).join(''):'<div class=\"notice\">Nenhuma ocorrência corresponde aos filtros.</div>');","  $('monitorTimeline').innerHTML=rows.length?header+rows.map(rowHtml).join(''):'<div class=\"notice\">Nenhuma ocorrência corresponde aos filtros.</div>';",1)
          s=s.replace("  $('monitorMobile').innerHTML=legend+(rows.length?rows.map(cardHtml).join(''):'<div class=\"notice\">Nenhuma ocorrência corresponde aos filtros.</div>');","  $('monitorMobile').innerHTML=rows.length?rows.map(cardHtml).join(''):'<div class=\"notice\">Nenhuma ocorrência corresponde aos filtros.</div>';",1)
          if 'const legend=' in s:
              raise SystemExit('declaracao de legenda permaneceu')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar fechamento do Monitor
        shell: bash
        run: |
          node --check sprint2-monitor-realdata-v2.js
          grep -Fq "monitor-realdata-v3.1-result-colors" sprint2-monitor-realdata-v2.js
          grep -Fq "<span>Resultado</span><span>Pontos</span><span>Ações</span>" sprint2-monitor-realdata-v2.js
          ! grep -Fq "const legend=" sprint2-monitor-realdata-v2.js
          ! grep -Fq "legend+(rows.length" sprint2-monitor-realdata-v2.js
      - name: Publicar ajuste final do Monitor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sprint2-monitor-realdata-v2.js
          git commit -m 'Sprint 2: remove legenda redundante do Monitor V3.1'
          git push
