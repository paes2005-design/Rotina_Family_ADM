name: Fix ADM Master resilience

on:
  push:
    paths:
      - '.github/workflows/fix-master-resilience.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch ADM Master refresh and session resilience
        shell: python
        run: |
          from pathlib import Path

          p = Path('admin-master.js')
          text = p.read_text()

          text = text.replace(
            "let loading = false;",
            "let loading = false;\nlet checkingMaster = null;\nconst MASTER_UID_KEY = 'rotinaFamilyMasterConfirmedUid';"
          )

          old_api = '''async function masterApi(path, options = {}) {
  if (!getApps().length || !getAuth(getApp()).currentUser) throw new Error('Sessão administrativa encerrada.');
  const token = await getAuth(getApp()).currentUser.getIdToken(true);
  const response = await fetch(`${API_ROOT}${path}`, {
    ...options,
    cache: 'no-store',
    headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json', ...(options.headers || {}) }
  });
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.error || `Falha HTTP ${response.status}`);
  return body;
}'''
          new_api = '''const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

async function masterApi(path, options = {}) {
  if (!getApps().length || !getAuth(getApp()).currentUser) throw new Error('Sessão administrativa encerrada.');
  let lastError = null;
  for (let attempt = 1; attempt <= 3; attempt += 1) {
    try {
      const currentUser = getAuth(getApp()).currentUser;
      if (!currentUser) throw new Error('Sessão administrativa encerrada.');
      const token = await currentUser.getIdToken(true);
      const response = await fetch(`${API_ROOT}${path}`, {
        ...options,
        cache: 'no-store',
        headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json', ...(options.headers || {}) }
      });
      const body = await response.json().catch(() => ({}));
      if (response.ok) return body;
      const error = new Error(body.error || `Falha HTTP ${response.status}`);
      error.status = response.status;
      if (![408, 425, 429, 500, 502, 503, 504].includes(response.status) || attempt === 3) throw error;
      lastError = error;
    } catch (error) {
      lastError = error;
      const status = Number(error?.status || 0);
      const retryable = !status || [408, 425, 429, 500, 502, 503, 504].includes(status);
      if (!retryable || attempt === 3) throw error;
    }
    await wait(350 * attempt);
  }
  throw lastError || new Error('Não foi possível atualizar os dados do Firebase.');
}'''
          if old_api not in text:
            raise SystemExit('masterApi block not found')
          text = text.replace(old_api, new_api, 1)

          old_load = '''async function loadUsers() {
  if (loading || !masterSession) return;
  loading = true;
  try {
    users = (await masterApi('/users')).users || [];
    renderUsers();
  } catch (error) {
    const target = document.getElementById('masterUsers');
    if (target) target.innerHTML = `<div class="master-error">${escapeHtml(friendlyMasterError(error))}</div>`;
  } finally {
    loading = false;
  }
}'''
          new_load = '''async function loadUsers() {
  if (loading || !masterSession) return;
  loading = true;
  const refresh = document.getElementById('masterRefresh');
  if (refresh) { refresh.disabled = true; refresh.textContent = 'Atualizando…'; }
  try {
    users = (await masterApi('/users')).users || [];
    renderUsers();
    window.rotinaLog?.('master.usuarios_atualizados', { total: users.length });
  } catch (error) {
    const target = document.getElementById('masterUsers');
    const online = navigator.onLine !== false;
    const message = online
      ? 'Não foi possível sincronizar agora com o Firebase. Tentaremos novamente; você também pode tocar em Atualizar usuários.'
      : 'Sem conexão com a internet. Os usuários serão atualizados automaticamente quando a conexão voltar.';
    if (target) target.innerHTML = `<div class="master-error"><strong>${escapeHtml(message)}</strong><br><small>${escapeHtml(friendlyMasterError(error))}</small><br><button id="masterRetryUsers" type="button" class="master-refresh" style="margin-top:10px">Tentar novamente</button></div>`;
    document.getElementById('masterRetryUsers')?.addEventListener('click', loadUsers, { once: true });
    window.rotinaLog?.('master.usuarios_atualizacao_falhou', { online, erro: String(error?.message || error).slice(0,120) });
  } finally {
    loading = false;
    if (refresh) { refresh.disabled = false; refresh.textContent = 'Atualizar usuários'; }
  }
}'''
          if old_load not in text:
            raise SystemExit('loadUsers block not found')
          text = text.replace(old_load, new_load, 1)

          old_check = '''async function checkMaster() {
  if (!getApps().length || !getAuth(getApp()).currentUser) {
    removeMasterUi();
    window.dispatchEvent(new CustomEvent('rotina-admin-master-ready', { detail: { master: false } }));
    return;
  }
  try {
    const session = await masterApi('/session');
    if (session?.master !== true) throw new Error('Worker ainda não confirmou o acesso Master.');
    masterSession = session;
    window.rotinaMasterSession = masterSession;
    ensureMasterUi();
    window.dispatchEvent(new CustomEvent('rotina-admin-master-ready', { detail: masterSession }));
  } catch (_) {
    removeMasterUi();
    window.dispatchEvent(new CustomEvent('rotina-admin-master-ready', { detail: { master: false } }));
  }
}'''
          new_check = '''async function checkMaster() {
  if (checkingMaster) return checkingMaster;
  checkingMaster = (async () => {
    if (!getApps().length || !getAuth(getApp()).currentUser) {
      removeMasterUi();
      window.dispatchEvent(new CustomEvent('rotina-admin-master-ready', { detail: { master: false } }));
      return;
    }
    const currentUser = getAuth(getApp()).currentUser;
    const cachedMaster = localStorage.getItem(MASTER_UID_KEY) === currentUser.uid;
    if (cachedMaster && !masterSession) {
      masterSession = { master: true, uid: currentUser.uid, cached: true };
      window.rotinaMasterSession = masterSession;
      ensureMasterUi();
    }
    try {
      const session = await masterApi('/session');
      if (session?.master !== true) {
        const error = new Error('Acesso Master não confirmado.');
        error.status = 403;
        throw error;
      }
      masterSession = session;
      window.rotinaMasterSession = masterSession;
      localStorage.setItem(MASTER_UID_KEY, currentUser.uid);
      ensureMasterUi();
      window.dispatchEvent(new CustomEvent('rotina-admin-master-ready', { detail: masterSession }));
      await loadUsers();
    } catch (error) {
      const status = Number(error?.status || 0);
      if (status === 401 || status === 403) {
        localStorage.removeItem(MASTER_UID_KEY);
        removeMasterUi();
        window.dispatchEvent(new CustomEvent('rotina-admin-master-ready', { detail: { master: false } }));
        return;
      }
      if (cachedMaster || masterSession?.master === true) {
        ensureMasterUi();
        const target = document.getElementById('masterUsers');
        if (target && !users.length) target.innerHTML = `<div class="master-error">Não foi possível confirmar a sincronização neste momento. A tela Master foi preservada e a atualização será tentada novamente.</div>`;
        window.rotinaMasterSession = { ...(masterSession || {}), master: true, sincronizacaoPendente: true };
        window.dispatchEvent(new CustomEvent('rotina-admin-master-ready', { detail: window.rotinaMasterSession }));
        return;
      }
      window.dispatchEvent(new CustomEvent('rotina-admin-master-ready', { detail: { master: false, temporario: true } }));
    }
  })().finally(() => { checkingMaster = null; });
  return checkingMaster;
}'''
          if old_check not in text:
            raise SystemExit('checkMaster block not found')
          text = text.replace(old_check, new_check, 1)

          old_tail = "if (getApps().length) onAuthStateChanged(getAuth(getApp()), user => { if (!user) removeMasterUi(); });"
          new_tail = """if (getApps().length) onAuthStateChanged(getAuth(getApp()), user => {
  if (!user) { localStorage.removeItem(MASTER_UID_KEY); removeMasterUi(); return; }
  checkMaster();
});
window.addEventListener('online', () => {
  if (getApps().length && getAuth(getApp()).currentUser) {
    checkMaster().then(() => { if (masterSession?.master === true) loadUsers(); }).catch(() => {});
  }
});"""
          if old_tail not in text:
            raise SystemExit('auth tail not found')
          text = text.replace(old_tail, new_tail, 1)
          p.write_text(text)

          sw = Path('sw.js')
          sw_text = sw.read_text().replace("rotina-family-adm-v50", "rotina-family-adm-v51")
          sw.write_text(sw_text)

          html = Path('index-ADMIN-v8.html')
          html_text = html.read_text().replace('./admin-master.js?v=1', './admin-master.js?v=2')
          html.write_text(html_text)

      - name: Validate JavaScript syntax
        run: |
          node --check admin-master.js
          node --check commercial-access-admin.js
          node --check master-family-tree.js
          node --check sw.js

      - name: Verify resilience rules
        shell: python
        run: |
          from pathlib import Path
          t=Path('admin-master.js').read_text()
          checks=['MASTER_UID_KEY','for (let attempt = 1; attempt <= 3','masterRetryUsers','localStorage.setItem(MASTER_UID_KEY','window.addEventListener(\'online\'']
          missing=[x for x in checks if x not in t]
          if missing: raise SystemExit('Missing: '+', '.join(missing))

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-master.js sw.js index-ADMIN-v8.html
          git diff --cached --quiet && exit 0
          git commit -m "Make ADM Master refresh resilient"
          git push
