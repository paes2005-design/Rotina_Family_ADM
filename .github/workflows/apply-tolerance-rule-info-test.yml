name: Apply tolerance rule explanation test patch
on:
  push:
    branches: [test/tolerance-rule-25-v1]
    paths: ['patch-tolerance-rule-copy.mjs']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/tolerance-rule-25-v1
      - run: node patch-tolerance-rule-copy.mjs
      - name: Commit rule copy
        run: |
          if git diff --quiet; then
            echo 'No patch needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-ADMIN-v8.html
          git commit -m 'Align ADM rule text with 12.5 percent recovery bands'
          git push origin HEAD:test/tolerance-rule-25-v1
