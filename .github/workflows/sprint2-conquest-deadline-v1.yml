name: Sprint 2 conquest deadline V1

on:
  push:
    paths:
      - 'scripts/sprint2_conquest_deadline_v1.py'
      - '.github/workflows/sprint2-conquest-deadline-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar prazo aprovado
        run: python scripts/sprint2_conquest_deadline_v1.py
      - name: Auditar paridade e arquitetura
        shell: bash
        run: |
          set -euo pipefail
          node --check sprint2-conquistas-realdata-v1.js
          node --check sprint2-data-store-v1.js
          node --check sprint2-tarefas-realdata-v2.js
          grep -q 'id="cqFormDeadline"' sprint2-conquistas-realdata-v1.js
          grep -q 'id="cqFormDeadlineValue"' sprint2-conquistas-realdata-v1.js
          grep -q 'id="cqFormDeadlineUnit"' sprint2-conquistas-realdata-v1.js
          grep -q 'prazo:deadline' sprint2-conquistas-realdata-v1.js
          grep -q 'prazoValor:' sprint2-conquistas-realdata-v1.js
          grep -q 'prazoUnidade:' sprint2-conquistas-realdata-v1.js
          grep -q 'não há expiração automática inventada' sprint2-conquistas-realdata-v1.js
          test "$(grep -o 'onSnapshot(' sprint2-data-store-v1.js | wc -l)" -eq 1
          ! grep -q 'onSnapshot(' sprint2-conquistas-realdata-v1.js
          ! grep -q 'onSnapshot(' sprint2-tarefas-realdata-v2.js
          grep -q 'sprint2-conquistas-realdata-v1.js?v=20260903-deadline-v1' sprint2-integracao-recompensas-v1.html
          git diff --check
          echo 'DEADLINE_AUDIT_OK=1'
      - name: Publicar prazo
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sprint2-conquistas-realdata-v1.js sprint2-integracao-recompensas-v1.html
          git commit -m 'Sprint 2: restaura prazo aprovado em Conquistas por pontos'
          git push
