name: Sprint 2 clean task view ownership

on:
  push:
    paths:
      - '.github/workflows/sprint2-clean-task-view-ownership.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remover markup legado e manter Tarefas V2 como dona única
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('sprint2-integracao-recompensas-v1.html')
          s=p.read_text(encoding='utf-8')
          start='<section class="view" id="view-tarefas">'
          next_section='<section class="view" id="view-participantes">'
          a=s.find(start); b=s.find(next_section,a+1)
          if a<0 or b<0:
              raise SystemExit('Bloco legado de Tarefas não localizado')
          replacement='<section class="view" id="view-tarefas"></section>\n'
          s=s[:a]+replacement+s[b:]
          s=s.replace('src="sprint2-tarefas-realdata-v2.js"','src="sprint2-tarefas-realdata-v2.js?v=20260903-details-v1"')
          for legacy in ['id="taskParticipant"','id="taskSearch"','id="taskFilter"','id="taskBody"','id="taskMobile"']:
              if legacy in s:
                  raise SystemExit('Controle legado ainda presente: '+legacy)
          if '<section class="view" id="view-tarefas"></section>' not in s:
              raise SystemExit('Placeholder único de Tarefas ausente')
          if 'sprint2-tarefas-realdata-v2.js?v=20260903-details-v1' not in s:
              raise SystemExit('Cache-bust da fonte atual ausente')
          p.write_text(s,encoding='utf-8')
          print('TASK_VIEW_OWNERSHIP=CLEAN')
          PY

      - name: Auditar HTML e JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check sprint2-tarefas-realdata-v2.js
          node --check sprint2-integracao-login-realdata-v1.js
          grep -q '<section class="view" id="view-tarefas"></section>' sprint2-integracao-recompensas-v1.html
          grep -q 'data-tv2-more' sprint2-tarefas-realdata-v2.js
          ! grep -q 'id="taskParticipant"' sprint2-integracao-recompensas-v1.html
          ! grep -q 'id="taskSearch"' sprint2-integracao-recompensas-v1.html
          ! grep -q 'id="taskFilter"' sprint2-integracao-recompensas-v1.html
          git diff --check

      - name: Publicar limpeza
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Nenhuma alteração pendente.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sprint2-integracao-recompensas-v1.html
          git commit -m 'Sprint 2: deixa Tarefas V2 como fonte única da tela'
          git push
