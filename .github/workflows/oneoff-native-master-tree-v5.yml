name: One-off native Master tree v5

on:
  push:
    branches: [fix-native-master-tree-v5-2026-08-22]

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-native-master-tree-v5-2026-08-22
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch native tree trigger
        shell: python
        run: |
          from pathlib import Path

          master = Path('admin-master.js')
          text = master.read_text(encoding='utf-8')
          marker = "function renderUsers() {"
          if marker not in text:
              raise SystemExit('renderUsers não encontrado')
          helper = r'''const MASTER_TREE_RUNTIME_VERSION = 5;
          let masterTreeLoaderPromise = null;

          function masterFamilyButton(groupId = '') {
            const id = String(groupId || '').trim().toUpperCase();
            if (!id) return '—';
            return `<button type="button" class="master-group-toggle master-group-native-toggle" data-master-group-toggle="1" data-group-id="${escapeHtml(id)}" aria-expanded="false" style="border:0;background:transparent;padding:0;color:#173a5e;font:inherit;font-weight:800;cursor:pointer;text-align:left">🌳 ${escapeHtml(id)} <span class="master-tree-arrow">▶</span></button>`;
          }

          function masterGroupDetail(groupId = '', desktop = false) {
            const id = String(groupId || '').trim().toUpperCase();
            if (!id) return '';
            return `<div class="${desktop ? 'master-integrated-tree-desktop' : 'master-integrated-tree-mobile'}" data-master-group-detail="${escapeHtml(id)}" style="display:none"></div>`;
          }

          function ensureMasterTreeRuntime() {
            if (Number(window.rotinaMasterTreeVersion || 0) >= MASTER_TREE_RUNTIME_VERSION) {
              window.rotinaMasterStartTree?.();
              window.rotinaMasterDecorateTree?.();
              return Promise.resolve(true);
            }
            if (masterTreeLoaderPromise) return masterTreeLoaderPromise;
            masterTreeLoaderPromise = new Promise(resolve => {
              const existing = [...document.scripts].find(script => String(script.src || '').includes('master-family-tree.js?v=5'));
              if (existing) {
                const finish = () => {
                  window.rotinaMasterStartTree?.();
                  window.rotinaMasterDecorateTree?.();
                  resolve(Number(window.rotinaMasterTreeVersion || 0) >= MASTER_TREE_RUNTIME_VERSION);
                };
                if (Number(window.rotinaMasterTreeVersion || 0) >= MASTER_TREE_RUNTIME_VERSION) finish();
                else {
                  existing.addEventListener('load', finish, { once: true });
                  existing.addEventListener('error', () => resolve(false), { once: true });
                  setTimeout(finish, 1500);
                }
                return;
              }
              const script = document.createElement('script');
              script.id = 'masterFamilyTreeRuntimeScript';
              script.src = './master-family-tree.js?v=5';
              script.onload = () => {
                window.rotinaMasterStartTree?.();
                window.rotinaMasterDecorateTree?.();
                resolve(true);
              };
              script.onerror = () => resolve(false);
              document.head.appendChild(script);
            }).finally(() => { masterTreeLoaderPromise = null; });
            return masterTreeLoaderPromise;
          }

          '''
          text = text.replace(marker, helper + marker, 1)

          old_rows = """  const rows = users.map(user => {\n    const isMaster = user.papel === 'master';\n    return `<tr><td><strong>${escapeHtml(user.email || 'Sem e-mail')}</strong></td><td>${escapeHtml(user.grupoId || '—')}<br><small>${escapeHtml(user.codigoAdmin || '')}</small></td><td>${isMaster ? '<span class=\"master-role\">MASTER</span>' : 'Administrador'}</td><td class=\"${user.desativado ? 'master-status-off' : 'master-status-on'}\">${user.desativado ? 'Desativado' : 'Ativo'}</td><td>${escapeHtml(formatDate(user.ultimoLoginEm))}</td><td>${isMaster ? 'Protegido' : actionButtons(user)}</td></tr>`;\n  }).join('');\n  const cards = users.map(user => {\n    const isMaster = user.papel === 'master';\n    return `<article class=\"master-user-card\"><div class=\"master-user-top\"><strong class=\"master-user-email\">${escapeHtml(user.email || 'Sem e-mail')}</strong>${isMaster ? '<span class=\"master-role\">MASTER</span>' : `<span class=\"${user.desativado ? 'master-status-off' : 'master-status-on'}\">${user.desativado ? 'Desativado' : 'Ativo'}</span>`}</div><div class=\"master-user-meta\"><div class=\"master-user-field\"><small>Família</small><strong>${escapeHtml(user.grupoId || '—')}</strong><br><span>${escapeHtml(user.codigoAdmin || '')}</span></div><div class=\"master-user-field\"><small>Último login</small><span>${escapeHtml(formatDate(user.ultimoLoginEm))}</span></div></div>${actionButtons(user)}</article>`;\n  }).join('');\n  target.innerHTML = `<div class=\"master-table-wrap\"><table class=\"master-table\"><thead><tr><th>E-mail</th><th>Família</th><th>Perfil</th><th>Status</th><th>Último login</th><th>Ações</th></tr></thead><tbody>${rows}</tbody></table></div><div class=\"master-mobile-list\">${cards}</div>`;\n"""
          new_rows = """  const rows = users.map(user => {\n    const isMaster = user.papel === 'master';\n    const family = user.grupoId ? masterFamilyButton(user.grupoId) : '—';\n    const row = `<tr><td><strong>${escapeHtml(user.email || 'Sem e-mail')}</strong></td><td>${family}<br><small>${escapeHtml(user.codigoAdmin || '')}</small></td><td>${isMaster ? '<span class=\"master-role\">MASTER</span>' : 'Administrador'}</td><td class=\"${user.desativado ? 'master-status-off' : 'master-status-on'}\">${user.desativado ? 'Desativado' : 'Ativo'}</td><td>${escapeHtml(formatDate(user.ultimoLoginEm))}</td><td>${isMaster ? 'Protegido' : actionButtons(user)}</td></tr>`;\n    return user.grupoId ? `${row}<tr class=\"master-integrated-tree-row master-native-tree-row\"><td colspan=\"6\">${masterGroupDetail(user.grupoId, true)}</td></tr>` : row;\n  }).join('');\n  const cards = users.map(user => {\n    const isMaster = user.papel === 'master';\n    const family = user.grupoId ? masterFamilyButton(user.grupoId) : '—';\n    return `<article class=\"master-user-card\" data-master-tree-native=\"${user.grupoId ? '1' : '0'}\"><div class=\"master-user-top\"><strong class=\"master-user-email\">${escapeHtml(user.email || 'Sem e-mail')}</strong>${isMaster ? '<span class=\"master-role\">MASTER</span>' : `<span class=\"${user.desativado ? 'master-status-off' : 'master-status-on'}\">${user.desativado ? 'Desativado' : 'Ativo'}</span>`}</div><div class=\"master-user-meta\"><div class=\"master-user-field\"><small>Família</small><strong>${family}</strong><br><span>${escapeHtml(user.codigoAdmin || '')}</span></div><div class=\"master-user-field\"><small>Último login</small><span>${escapeHtml(formatDate(user.ultimoLoginEm))}</span></div></div>${masterGroupDetail(user.grupoId)}${actionButtons(user)}</article>`;\n  }).join('');\n  target.innerHTML = `<div class=\"master-table-wrap\"><table class=\"master-table\"><thead><tr><th>E-mail</th><th>Família</th><th>Perfil</th><th>Status</th><th>Último login</th><th>Ações</th></tr></thead><tbody>${rows}</tbody></table></div><div class=\"master-mobile-list\">${cards}</div>`;\n  ensureMasterTreeRuntime().catch(() => {});\n"""
          if old_rows not in text:
              raise SystemExit('Bloco renderUsers esperado não encontrado')
          text = text.replace(old_rows, new_rows, 1)
          master.write_text(text, encoding='utf-8')

          tree = Path('master-family-tree.js')
          tree_text = tree.read_text(encoding='utf-8')
          tree_text = tree_text.replace("window.rotinaMasterIntegratedTree = true;", "window.rotinaMasterIntegratedTree = true;\nwindow.rotinaMasterTreeVersion = 5;", 1)

          old_mobile = """    card.dataset.masterTreeDecorated = '1';\n    if (emailEl && ownerGroup) emailEl.innerHTML = `${principalButton(email || ownerGroup.proprietarioEmail, id, 'owner')}<span class=\"master-principal-badge\">PRINCIPAL</span>`;\n    if (groupStrong) groupStrong.innerHTML = principalButton(ownerGroup?.proprietarioEmail || email, id, 'group');\n    const actions = card.querySelector('.master-actions');\n    const detail = document.createElement('div');\n    detail.className = 'master-integrated-tree-mobile';\n    detail.dataset.masterGroupDetail = id;\n    detail.style.display = 'none';\n    if (actions) actions.before(detail); else card.appendChild(detail);\n"""
          new_mobile = """    card.dataset.masterTreeDecorated = '1';\n    if (emailEl && ownerGroup && !emailEl.querySelector('[data-master-group-toggle]')) emailEl.innerHTML = `${principalButton(email || ownerGroup.proprietarioEmail, id, 'owner')}<span class=\"master-principal-badge\">PRINCIPAL</span>`;\n    if (groupStrong && !groupStrong.querySelector('[data-master-group-toggle]')) groupStrong.innerHTML = principalButton(ownerGroup?.proprietarioEmail || email, id, 'group');\n    const actions = card.querySelector('.master-actions');\n    let detail = card.querySelector(`[data-master-group-detail=\"${id}\"]`);\n    if (!detail) {\n      detail = document.createElement('div');\n      detail.className = 'master-integrated-tree-mobile';\n      detail.dataset.masterGroupDetail = id;\n      detail.style.display = 'none';\n      if (actions) actions.before(detail); else card.appendChild(detail);\n    }\n"""
          if old_mobile not in tree_text:
              raise SystemExit('Bloco mobile esperado não encontrado')
          tree_text = tree_text.replace(old_mobile, new_mobile, 1)

          old_desktop_detail = """    const detailRow = document.createElement('tr');\n    detailRow.className = 'master-integrated-tree-row';\n    detailRow.innerHTML = `<td colspan=\"6\"><div data-master-group-detail=\"${esc(id)}\" style=\"display:none\"></div></td>`;\n    row.after(detailRow);\n"""
          new_desktop_detail = """    const next = row.nextElementSibling;\n    if (!next?.querySelector?.(`[data-master-group-detail=\"${id}\"]`)) {\n      const detailRow = document.createElement('tr');\n      detailRow.className = 'master-integrated-tree-row';\n      detailRow.innerHTML = `<td colspan=\"6\"><div data-master-group-detail=\"${esc(id)}\" style=\"display:none\"></div></td>`;\n      row.after(detailRow);\n    }\n"""
          if old_desktop_detail not in tree_text:
              raise SystemExit('Bloco desktop esperado não encontrado')
          tree_text = tree_text.replace(old_desktop_detail, new_desktop_detail, 1)

          tail_marker = "if (window.rotinaMasterSession?.master === true) startIntegratedTree();"
          expose = "window.rotinaMasterStartTree = startIntegratedTree;\nwindow.rotinaMasterDecorateTree = decorateRecords;\nwindow.rotinaMasterToggleGroup = toggleGroup;\n\n"
          if tail_marker not in tree_text:
              raise SystemExit('Inicialização final da árvore não encontrada')
          tree_text = tree_text.replace(tail_marker, expose + tail_marker, 1)
          tree.write_text(tree_text, encoding='utf-8')

          entry = Path('index.html')
          html = entry.read_text(encoding='utf-8')
          html = html.replace("html=html.replace('./admin-master.js?v=1','./admin-master.js?v=2');", "html=html.replace('./admin-master.js?v=1','./admin-master.js?v=3');")
          html = html.replace("./master-family-tree.js?v=4", "./master-family-tree.js?v=5")
          marker_sw = "html=html.replace('./sw.js?v=55','./sw.js?v=56');"
          if marker_sw not in html:
              raise SystemExit('Marcador SW v56 não encontrado')
          html = html.replace(marker_sw, marker_sw + "\n        html=html.replace('./sw.js?v=56','./sw.js?v=57');", 1)
          entry.write_text(html, encoding='utf-8')

          sw = Path('sw.js')
          sw_text = sw.read_text(encoding='utf-8')
          if "rotina-family-adm-v56" not in sw_text:
              raise SystemExit('Cache v56 não encontrado')
          sw_text = sw_text.replace("rotina-family-adm-v56", "rotina-family-adm-v57", 1)
          sw_text = sw_text.replace("./master-family-tree.js?v=4", "./master-family-tree.js?v=5")
          sw.write_text(sw_text, encoding='utf-8')

      - name: Validate contracts
        shell: python
        run: |
          from pathlib import Path
          master=Path('admin-master.js').read_text(encoding='utf-8')
          tree=Path('master-family-tree.js').read_text(encoding='utf-8')
          entry=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          for marker in ['update-email','send-password-reset','set-disabled','delete-user']:
              assert marker in master, marker
          assert 'function masterFamilyButton' in master
          assert 'data-master-group-toggle="1"' in master
          assert 'ensureMasterTreeRuntime' in master
          assert 'masterGroupDetail' in master
          assert 'window.rotinaMasterTreeVersion = 5' in tree
          assert 'window.rotinaMasterStartTree = startIntegratedTree' in tree
          assert 'window.rotinaMasterDecorateTree = decorateRecords' in tree
          assert "COMMERCIAL_EXEMPT_GROUPS = new Set(['CLI-4071'])" in tree
          assert './admin-master.js?v=3' in entry
          assert './master-family-tree.js?v=5' in entry
          assert "CACHE_NAME='rotina-family-adm-v57'" in sw
          assert './master-family-tree.js?v=5' in sw
          print('FRONT-END MASTER V5: cartão gera CLI clicável e runtime abre ramificações')
      - name: JavaScript syntax
        run: |
          node --check admin-master.js
          node --check master-family-tree.js
          node --check sw.js
      - name: Commit functional files only
        run: |
          git rm .github/workflows/oneoff-native-master-tree-v5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-master.js master-family-tree.js index.html sw.js
          git commit -m "Fix: gerar árvore nativamente no cartão Master v5"
          git push origin HEAD:fix-native-master-tree-v5-2026-08-22
