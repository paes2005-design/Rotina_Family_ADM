name: Finalizar runtime determinístico de justificativas
on:
  push:
    paths:
      - '.github/triggers/finalize-justification-runtime.txt'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tornar carregamento determinístico e alinhar versão
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          build='20260830.8'
          swver='78'

          admin=Path('index-ADMIN-v8.html')
          s=admin.read_text()
          anchor='<script type="module" src="./dashboard-ranking-pro.js"></script>'
          direct='''<link rel="stylesheet" href="./mobile-app-ui.css" data-mobile-app-ui="1">
<script type="module" src="./runtime-build-info.js?v=20260830.8"></script>
<script type="module" src="./adm-justification-review.js?v=9"></script>
<script type="module" src="./adm-monitor-history-fix.js?v=4"></script>
<script type="module" src="./mobile-app-ui.js"></script>
<script type="module" src="./dashboard-ranking-pro.js"></script>'''
          if anchor not in s:
              raise SystemExit('index-ADMIN-v8.html: âncora dashboard não encontrada')
          if 'src="./mobile-app-ui.js"' not in s:
              s=s.replace(anchor,direct,1)
          if "serviceWorker.register('./sw.js?v=77',{updateViaCache:'none'})" not in s:
              raise SystemExit('index-ADMIN-v8.html: registro SW77 não encontrado')
          s=s.replace("serviceWorker.register('./sw.js?v=77',{updateViaCache:'none'})", "serviceWorker.register('./sw.js?v=78',{updateViaCache:'none'})",1)
          admin.write_text(s)

          p=Path('index.html'); s=p.read_text()
          if s.count('20260830.7')!=2:
              raise SystemExit(f'index.html: esperado 2x .7, encontrado {s.count("20260830.7")}')
          p.write_text(s.replace('20260830.7',build))

          p=Path('runtime-build-info.js'); s=p.read_text()
          if "build:'20260830.7'" not in s or "expectedServiceWorkerVersion:'77'" not in s:
              raise SystemExit('runtime-build-info.js fora do estado .7/77 esperado')
          s=s.replace("build:'20260830.7'",f"build:'{build}'")
          s=s.replace("expectedServiceWorkerVersion:'77'",f"expectedServiceWorkerVersion:'{swver}'")
          p.write_text(s)

          p=Path('sw.js'); s=p.read_text()
          replacements={
            "const CACHE_NAME='rotina-family-adm-v77'":"const CACHE_NAME='rotina-family-adm-v78'",
            "const ROTINA_SW_VERSION='77'":"const ROTINA_SW_VERSION='78'",
            "const ROTINA_BUILD_ID='20260830.7'":"const ROTINA_BUILD_ID='20260830.8'",
            'runtime-build-info.js?v=20260830.7':'runtime-build-info.js?v=20260830.8'
          }
          for old,new in replacements.items():
              if old not in s: raise SystemExit(f'sw.js: não encontrei {old}')
              s=s.replace(old,new,1)
          p.write_text(s)

          # Critérios de aceite da publicação final.
          admin_text=admin.read_text()
          required_admin=[
            'src="./runtime-build-info.js?v=20260830.8"',
            'src="./adm-justification-review.js?v=9"',
            'src="./adm-monitor-history-fix.js?v=4"',
            'src="./mobile-app-ui.js"',
            'href="./mobile-app-ui.css" data-mobile-app-ui="1"',
            "serviceWorker.register('./sw.js?v=78',{updateViaCache:'none'})"
          ]
          for needle in required_admin:
              if needle not in admin_text: raise SystemExit(f'FALHA HTML: {needle}')
          if Path('index.html').read_text().count('20260830.8')!=2: raise SystemExit('FALHA entry .8')
          rt=Path('runtime-build-info.js').read_text()
          if "build:'20260830.8'" not in rt or "expectedServiceWorkerVersion:'78'" not in rt: raise SystemExit('FALHA runtime .8/78')
          sw=Path('sw.js').read_text()
          for needle in ["rotina-family-adm-v78","ROTINA_SW_VERSION='78'","ROTINA_BUILD_ID='20260830.8'",'runtime-build-info.js?v=20260830.8']:
              if needle not in sw: raise SystemExit(f'FALHA SW: {needle}')
          print('FINAL_RUNTIME=PASS build=20260830.8 sw=78 direct_modules=review,history,mobile,runtime')
          PY
      - name: Validar sintaxe dos módulos essenciais
        run: |
          node --check adm-justification-review.js
          node --check adm-monitor-history-fix.js
          node --check mobile-app-ui.js
          node --check runtime-build-info.js
          node --check sw.js
      - name: Gravar versão final
        shell: bash
        run: |
          git config user.name 'rotina-family-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index-ADMIN-v8.html index.html runtime-build-info.js sw.js
          git commit -m 'Estabilizar runtime de justificativas no build 20260830.8'
          git push
