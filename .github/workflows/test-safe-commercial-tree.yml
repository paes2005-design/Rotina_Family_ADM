name: Teste ADM comercial seguro

on:
  push:
    branches:
      - teste-arvore-comercial-segura-2026-08-20
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          node --check master-family-tree.js
          node --check commercial-access-admin.js
          node --check app-monitoring-dashboard.js
          node --check admin-master.js
          node --check sw.js
      - name: Architecture invariants
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html').read_text(encoding='utf-8')
          tree = Path('master-family-tree.js').read_text(encoding='utf-8')
          commercial = Path('commercial-access-admin.js').read_text(encoding='utf-8')
          monitor = Path('app-monitoring-dashboard.js').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')

          # Shell pronto para oficial, sem rótulo de teste, com módulos Master/comercial/logs.
          assert '<title>Rotina Family ADM</title>' in index
          assert 'TESTE COMERCIAL SEGURO' not in index
          assert 'commercial-access-admin.js?v=2' in index
          assert 'master-family-tree.js?v=2' in index
          assert 'app-monitoring-dashboard.js?v=2' in index
          assert 'admin-master.js?v=2' in index

          # Grupos: lista visível, pesquisa, detalhe de um grupo e ações de grupo.
          assert 'masterCommercialGroupSelect' in tree
          assert "window.rotinaMasterApi('/groups'" in tree
          assert '/group?grupoId=' in tree
          assert 'proprietarioEmail' in tree
          assert 'Administrador principal' in tree
          assert "action: 'set-group-blocked'" in tree
          assert "'confirm-group'" in tree
          assert 'Confirmar / liberar definitivo' in tree
          assert '15 dias' in tree
          assert 'teste-expirado' in tree
          assert "window.rotinaMasterApi('/tree')" not in tree
          assert 'setInterval(' not in tree
          assert "window.dispatchEvent(new CustomEvent('rotina-master-tree-loaded'" in tree

          # ADM normal: mesmo estado comercial do grupo; Master nunca é bloqueado.
          assert 'signOut(' not in commercial
          assert 'waitForMasterResolution' in commercial
          assert "doc(db(), 'configGrupos', group)" in commercial
          assert "Number(config.trialVersao || 0) === 2" in commercial
          assert "state === 'teste-expirado'" in commercial
          assert "'/commercial/trial'" in commercial
          assert 'window.rotinaMasterSession?.master === true' in commercial
          assert "'administradores'" not in commercial

          # Logs continuam globais; grupo é filtro opcional.
          assert 'Todos os grupos' in monitor
          assert "selectedGroup = 'SISTEMA'" in monitor
          assert "'/logs?grupoId='" not in monitor or '/logs?grupoId=' in monitor
          assert "window.rotinaMasterApi(`/logs?grupoId=${encodeURIComponent(groupId || 'SISTEMA')}`)" in monitor
          assert 'Todos os aplicativos' in monitor
          assert 'Todos os níveis' in monitor

          # Service Worker inclui os módulos novos para atualização/offline.
          assert "CACHE_NAME='rotina-family-adm-v53'" in sw
          for asset in ['commercial-access-admin.js','master-family-tree.js','app-monitoring-dashboard.js']:
              assert asset in sw

          print('ADM final: Master + grupos + bloqueio + trial 15d + logs globais OK')
      - name: Confirm branch only
        run: echo "Versão final validada na branch antes da publicação oficial."
