name: Teste ADM comercial seguro

on:
  push:
    branches:
      - teste-arvore-comercial-segura-2026-08-20
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          node --check master-family-tree.js
          node --check commercial-access-admin.js
          node --check app-monitoring-dashboard.js
          node --check admin-master.js
      - name: Architecture invariants
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html').read_text(encoding='utf-8')
          tree = Path('master-family-tree.js').read_text(encoding='utf-8')
          commercial = Path('commercial-access-admin.js').read_text(encoding='utf-8')

          assert 'commercial-access-admin.js?v=safe1' in index
          assert 'master-family-tree.js?v=safe1' in index
          assert 'TESTE COMERCIAL SEGURO' in index

          assert 'setInterval(' not in tree, 'Consulta de grupo voltou a usar polling'
          assert "action: 'set-group-blocked'" in tree, 'Bloqueio do grupo ausente'
          assert 'Grupo comercial' in tree
          assert 'Administrador principal' in tree
          assert 'proprietário' in tree
          assert 'administradorPrincipal' in tree
          assert '`/group?grupoId=${encodeURIComponent(groupId)}`' in tree, 'Tela voltou a carregar árvore global'
          assert "window.rotinaMasterApi('/tree')" not in tree, 'Tela não deve varrer todas as famílias'
          assert 'admin-commercial-toggle' not in tree
          assert 'client-toggle' not in tree
          assert 'confirm-group' not in tree
          assert "path = '/users'" not in tree
          assert "path = '/profiles'" not in tree

          assert 'signOut(' not in commercial, 'Comercial não pode encerrar Firebase Auth'
          assert 'waitForMasterResolution' in commercial
          assert "doc(db(), 'configGrupos', group)" in commercial
          assert "'administradores'" not in commercial, 'Comercial ADM não deve consultar administradores nesta fase'
          assert 'bloqueadoComercialIndividual' not in commercial
          assert 'trial' not in commercial.lower()

          print('ADM comercial seguro — consulta por grupo + proprietário: OK')
      - name: Confirm production untouched
        run: echo "PR de teste validado; main não é alterado."
