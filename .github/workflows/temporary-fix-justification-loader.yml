name: Corrigir sessão pronta antes da sincronização ADM
on:
  push:
    paths:
      - '.github/triggers/fix-justification-loader.txt'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Destravar sessão administrativa
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index-ADMIN-v8.html')
          s=p.read_text()
          pattern=re.compile(r"(?P<i>[ \t]*)await iniciarEscutasFirebase\(\);\n(?P=i)window\.dispatchEvent\(new CustomEvent\('rotina-admin-session-ready',\{detail:\{grupoId:adminLogadoAtual\.codigoCliente \|\| adminLogadoAtual\.grupoId\}\}\)\);")
          def repl(m):
              i=m.group('i')
              return (
                  f"{i}const syncInicialAdm=iniciarEscutasFirebase();\n"
                  f"{i}window.rotinaAdmInitialSyncPromise=syncInicialAdm;\n"
                  f"{i}window.dispatchEvent(new CustomEvent('rotina-admin-session-ready',{{detail:{{grupoId:adminLogadoAtual.codigoCliente || adminLogadoAtual.grupoId}}}}));\n"
                  f"{i}syncInicialAdm.catch(e=>console.error('Falha na sincronização inicial do ADM',e));"
              )
          s,n=pattern.subn(repl,s)
          if n != 2:
              raise SystemExit(f'Esperadas 2 substituições de sessão, encontradas {n}')
          s=s.replace("navigator.serviceWorker.register('./sw.js?v=70',{updateViaCache:'none'})", "navigator.serviceWorker.register('./sw.js?v=71',{updateViaCache:'none'})")
          p.write_text(s)

          sw=Path('sw.js')
          x=sw.read_text()
          x=x.replace("const CACHE_NAME='rotina-family-adm-v70';", "const CACHE_NAME='rotina-family-adm-v71';")
          x=x.replace("const ROTINA_SW_VERSION='70';", "const ROTINA_SW_VERSION='71';")
          x=x.replace("const ROTINA_BUILD_ID='20260829.6';", "const ROTINA_BUILD_ID='20260830.1';")
          x=x.replace('runtime-build-info.js?v=20260829.6', 'runtime-build-info.js?v=20260830.1')
          sw.write_text(x)

          r=Path('runtime-build-info.js')
          x=r.read_text().replace("build:'20260829.6'", "build:'20260830.1'").replace("expectedServiceWorkerVersion:'70'", "expectedServiceWorkerVersion:'71'")
          r.write_text(x)

          i=Path('index.html')
          x=i.read_text().replace('entry=20260829.6', 'entry=20260830.1')
          i.write_text(x)
          PY
      - name: Validar correção
        shell: bash
        run: |
          test "$(grep -c 'const syncInicialAdm=iniciarEscutasFirebase();' index-ADMIN-v8.html)" -eq 2
          test "$(grep -c 'await iniciarEscutasFirebase();' index-ADMIN-v8.html || true)" -eq 0
          grep -q "rotina-family-adm-v71" sw.js
          grep -q "ROTINA_BUILD_ID='20260830.1'" sw.js
          grep -q "expectedServiceWorkerVersion:'71'" runtime-build-info.js
      - name: Gravar correção
        shell: bash
        run: |
          git config user.name 'rotina-family-fix-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index-ADMIN-v8.html sw.js runtime-build-info.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Destravar sessão ADM antes da sincronização inicial'
          git push
