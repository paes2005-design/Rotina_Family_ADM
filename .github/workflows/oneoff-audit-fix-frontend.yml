name: One-off audit fix integrated frontend

on:
  push:
    branches:
      - audit-frontend-master-2026-08-22

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-frontend-master-2026-08-22
          fetch-depth: 0

      - name: Apply audited frontend fixes
        shell: python
        run: |
          from pathlib import Path

          tree = Path('master-family-tree.js')
          text = tree.read_text(encoding='utf-8')
          old = """function ownerGroupFor(email = '', groupId = '', uid = '') {
            const wantedEmail = normalizeEmail(email);
            const wantedGroup = normalizeGroupId(groupId);
            const wantedUid = String(uid || '').trim();
            return allGroups.find(group => {
              const sameGroup = !wantedGroup || normalizeGroupId(group.grupoId) === wantedGroup;
              const sameOwner = wantedUid
                ? String(group.proprietarioUid || '').trim() === wantedUid
                : normalizeEmail(group.proprietarioEmail) === wantedEmail;
              return sameGroup && sameOwner;
            }) || null;
          }
          """
          new = """function ownerGroupFor(email = '', groupId = '', uid = '') {
            const wantedEmail = normalizeEmail(email);
            const wantedGroup = normalizeGroupId(groupId);
            const wantedUid = String(uid || '').trim();
            return allGroups.find(group => {
              const sameGroup = !wantedGroup || normalizeGroupId(group.grupoId) === wantedGroup;
              if (!sameGroup) return false;
              const groupUid = String(group.proprietarioUid || '').trim();
              const groupEmail = normalizeEmail(group.proprietarioEmail);
              const sameUid = Boolean(wantedUid && groupUid && groupUid === wantedUid);
              const sameEmail = Boolean(wantedEmail && groupEmail && groupEmail === wantedEmail);
              return sameUid || sameEmail;
            }) || null;
          }
          """
          if old not in text:
            raise SystemExit('Bloco ownerGroupFor esperado não encontrado')
          tree.write_text(text.replace(old, new, 1), encoding='utf-8')

          entry = Path('index.html')
          html = entry.read_text(encoding='utf-8')
          html = html.replace("./master-family-tree.js?v=2", "./master-family-tree.js?v=3")
          marker = "html=html.replace('./sw.js?v=53','./sw.js?v=54');"
          if marker not in html:
            raise SystemExit('Marcador de versão do SW não encontrado em index.html')
          html = html.replace(marker, marker + "\n        html=html.replace('./sw.js?v=54','./sw.js?v=55');", 1)
          entry.write_text(html, encoding='utf-8')

          sw = Path('sw.js')
          sw_text = sw.read_text(encoding='utf-8')
          if "rotina-family-adm-v54" not in sw_text:
            raise SystemExit('Cache v54 não encontrado')
          sw_text = sw_text.replace("rotina-family-adm-v54", "rotina-family-adm-v55", 1)
          sw_text = sw_text.replace("./master-family-tree.js?v=2", "./master-family-tree.js?v=3")
          sw.write_text(sw_text, encoding='utf-8')

      - name: Audit frontend contracts
        shell: python
        run: |
          from pathlib import Path
          tree=Path('master-family-tree.js').read_text(encoding='utf-8')
          master=Path('admin-master.js').read_text(encoding='utf-8')
          entry=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          manifest=Path('manifest.json').read_text(encoding='utf-8')

          for marker in ['update-email','send-password-reset','set-disabled','delete-user']:
              assert marker in master, marker
          assert "return sameUid || sameEmail" in tree
          assert 'data-master-group-toggle' in tree
          assert 'master-integrated-tree-mobile' in tree
          assert 'Administrador principal' in tree
          assert 'Administradores convidados' in tree
          assert 'Integrantes do grupo' in tree
          assert "COMMERCIAL_EXEMPT_GROUPS = new Set(['CLI-4071'])" in tree
          assert './master-family-tree.js?v=3' in entry
          assert "./sw.js?v=54','./sw.js?v=55" in entry
          assert "CACHE_NAME='rotina-family-adm-v55'" in sw
          assert './master-family-tree.js?v=3' in sw
          assert '"start_url": "./index.html?entry=index-ADMIN-v8.html"' in manifest
          print('AUDITORIA FRONT-END: OK')

      - name: JavaScript syntax
        run: |
          node --check master-family-tree.js
          node --check admin-master.js
          node --check sw.js

      - name: Remove one-off workflow and commit audited frontend
        run: |
          git rm .github/workflows/oneoff-audit-fix-frontend.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master-family-tree.js index.html sw.js
          git commit -m "Fix: publicar árvore integrada com fallback de proprietário e cache v55"
          git push origin HEAD:audit-frontend-master-2026-08-22
