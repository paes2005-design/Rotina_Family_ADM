name: Sprint 2 Monitor V3 architecture audit

on:
  push:
    paths:
      - 'sprint2-data-store-v1.js'
      - 'sprint2-monitor-realdata-v2.js'
      - 'sprint2-integracao-monitor-v2.html'
      - '.github/workflows/sprint2-monitor-v3-architecture-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validar sintaxe JavaScript
        run: |
          node --check sprint2-data-store-v1.js
          node --check sprint2-monitor-realdata-v2.js

      - name: Auditar fonte unica, menu e sincronizacao
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          store = Path('sprint2-data-store-v1.js').read_text(encoding='utf-8')
          monitor = Path('sprint2-monitor-realdata-v2.js').read_text(encoding='utf-8')
          html = Path('sprint2-integracao-monitor-v2.html').read_text(encoding='utf-8')

          checks = []
          def ok(label, condition):
              checks.append((label, bool(condition)))
              print(('OK - ' if condition else 'FALHA - ') + label)

          ok('Store possui exatamente uma escuta continua Firestore', store.count('fs.onSnapshot(') == 1)
          ok('escuta continua observa somente execucoes', "fs.collection(db,'execucoes')" in store)
          ok('historico nao possui escuta continua', not re.search(r"onSnapshot[^\n]+historico|historico[^\n]+onSnapshot", store))
          ok('listener unico e protegido contra duplicacao', 'liveUnsubs.length===1' in store)
          ok('reconciliacao periodica cobre tarefas historico e despertadores', "['tarefas','historico','despertadores']" in store)
          ok('sincronizacao total cobre as quatro colecoes', "['tarefas','historico','execucoes','despertadores']" in store)
          ok('janela de reconciliacao permanece em cinco minutos', 'const SYNC_MS=5*60*1000' in store)
          ok('menu limpa todas as selecoes antes de marcar a rota', "nav.querySelectorAll('button').forEach(b=>b.classList.remove('active'))" in store)
          ok('menu controla Inicio Tarefas e Monitor', "['inicio','tarefas','monitor'].includes(route)" in store)
          ok('Monitor reage ao evento do Store central', "window.addEventListener('rotina-sprint2-cache-updated'" in monitor)
          ok('botao Atualizar forca sincronizacao remota', "rotinaSprint2SyncNow('monitor-manual')" in monitor)
          ok('Monitor continua sendo read model V3', "VERSION='monitor-realdata-v3-readmodel'" in monitor)
          ok('resultado exige ocorrencia por tarefa participante e data', 'findByOccurrence(historyDocs,source,pid,date)' in monitor and 'findByOccurrence(executionDocs,source,pid,date)' in monitor)
          ok('sem ocorrencia permanece pendente e sem faixa', "Pendente · horário previsto passou" in monitor and "if(x.__state!=='final')return null" in monitor)
          ok('Monitor nao recalcula percentual por pontos', 'won*100/max' not in monitor and 'won * 100 / max' not in monitor)

          login_pos = html.find('sprint2-integracao-login-realdata-v1.js')
          store_pos = html.find('sprint2-data-store-v1.js')
          monitor_pos = html.find('sprint2-monitor-realdata-v2.js')
          ok('ordem de scripts e Login Store Monitor', -1 not in (login_pos, store_pos, monitor_pos) and login_pos < store_pos < monitor_pos)

          passed = sum(v for _, v in checks)
          total = len(checks)
          print(f'MONITOR_V3_ARCHITECTURE_RESULT={passed}/{total}')
          if passed != total:
              raise SystemExit(1)
          PY

      - name: Confirmar escopo Sprint 2
        run: |
          echo 'Auditoria somente leitura: nenhum arquivo de producao e alterado pelo teste.'
          echo 'Monitor V3 validado com uma unica escuta continua em execucoes.'
