name: Sprint 2 Inicio unificado audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'sprint2-inicio-unificado-preview-v1.html'
      - 'sprint2-teste-bootstrap.js'
      - '.github/workflows/sprint2-inicio-unificado-audit.yml'

permissions:
  contents: read

env:
  LOG_URL: https://rotina-family-onesignal-scheduler.rotina-family-onesignal-scheduler.workers.dev/app-log
  DIAG_URL: https://rotina-family-onesignal-scheduler.rotina-family-onesignal-scheduler.workers.dev/diagnostico-tecnico
  PAGE_URL: https://paes2005-design.github.io/Rotina_Family_ADM/sprint2-inicio-unificado-preview-v1.html

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar arquitetura unificada
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          page=Path('sprint2-inicio-unificado-preview-v1.html').read_text(encoding='utf-8')
          boot=Path('sprint2-teste-bootstrap.js').read_text(encoding='utf-8')
          checks={
            'dois modos internos': len(re.findall(r'class="home-tab(?:\s|\")', page)) == 2,
            'Hoje presente': 'data-pane="today"' in page,
            'Analise presente': 'data-pane="analysis"' in page,
            'Relatorios fora do menu da preview': '📊</span>Relatórios' not in page,
            'sem iframe': not re.search(r'<iframe\b', page, re.I),
            'retorno unificado configurado': 'function goUnifiedHome' in boot,
            'botao Inicio redireciona': "b.dataset.route==='inicio'" in boot and 'goUnifiedHome(route)' in boot,
            'Relatorios removido do menu consolidado': 'reportsBtn.remove()' in boot,
            'startup Inicio abre unificado': "initialRoute==='inicio'" in boot and 'sprint2-inicio-unificado-preview-v1.html?from=startup' in boot,
            'selftest nao trata Relatorios como rota ativa': "const routes=['tarefas','participantes','monitor','recompensas','master']" in boot,
            'log de retorno configurado': "techLog('inicio_unificado_retorno'" in boot,
            'log de redirect startup configurado': "techLog('inicio_unificado_redirect'" in boot,
          }
          failed=[k for k,v in checks.items() if not v]
          for k,v in checks.items(): print(('OK ' if v else 'FALHA ')+k)
          if failed: raise SystemExit('Falhas: '+', '.join(failed))
          print(f'ARQUITETURA {len(checks)}/{len(checks)}')
          PY

      - name: Validar sintaxe JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check sprint2-teste-bootstrap.js
          python - <<'PY'
          from pathlib import Path
          import re
          page=Path('sprint2-inicio-unificado-preview-v1.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>([\s\S]*?)</script>', page)
          if len(scripts)!=1: raise SystemExit(f'Esperado 1 script inline; encontrados {len(scripts)}')
          Path('/tmp/unified.js').write_text(scripts[0],encoding='utf-8')
          PY
          node --check /tmp/unified.js
          echo 'JAVASCRIPT OK'

      - name: Verificar pagina publicada
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-delay 2 --max-time 25 "$PAGE_URL" -o /tmp/public-page.html
          grep -q 'data-pane="today"' /tmp/public-page.html
          grep -q 'data-pane="analysis"' /tmp/public-page.html
          if grep -q '📊</span>Relatórios' /tmp/public-page.html; then
            echo 'Relatorios ainda aparece no menu publicado'; exit 1
          fi
          echo 'PAGINA PUBLICADA OK'

      - name: Ler saude e logs reais
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 25 "$DIAG_URL?limit=160" -o /tmp/diag-before.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/diag-before.json',encoding='utf-8'))
          print('STATUS_WORKER=',d.get('status'))
          print('SUMMARY=',json.dumps(d.get('summary',{}),ensure_ascii=False))
          logs=d.get('logs',[]) or []
          real=[x for x in logs if 'inicio_unificado' in str(x.get('evento','')) or 'sprint2-inicio-unificado-preview-v1' in str(x.get('pagina',''))]
          print('LOGS_INICIO_UNIFICADO_EXISTENTES=',len(real))
          for x in real[:25]:
              print(json.dumps({'clienteEm':x.get('clienteEm'),'evento':x.get('evento'),'nivel':x.get('nivel'),'pagina':x.get('pagina'),'detalhes':x.get('detalhes',{})},ensure_ascii=False))
          if str(d.get('status','')).upper().replace('Á','A') in ('ERRO_DIAGNOSTICO','DEGRADADO'):
              raise SystemExit('Worker nao esta saudavel')
          PY

      - name: Validar endpoints de telemetria
        shell: bash
        run: |
          set -euo pipefail
          MARKER="sprint2-unified-ci-${GITHUB_RUN_ID}"
          cat >/tmp/payload.json <<JSON
          {"evento":"operacao.sprint2_unified.audit_smoke","pagina":"sprint2-inicio-unificado-preview-v1.html","versaoMonitor":6,"ts":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","dados":{"marker":"$MARKER","source":"github_actions"}}
          JSON
          POST_CODE=$(curl -sS -o /tmp/post.out -w '%{http_code}' -X POST -H 'content-type: application/json' --data-binary @/tmp/payload.json "$LOG_URL")
          case "$POST_CODE" in 2*) ;; *) echo "Telemetry POST failed: $POST_CODE"; cat /tmp/post.out; exit 1;; esac
          sleep 2
          DIAG_CODE=$(curl -sS -o /tmp/diag.out -w '%{http_code}' "$DIAG_URL?limit=200")
          case "$DIAG_CODE" in 2*) ;; *) echo "Diagnostic GET failed: $DIAG_CODE"; exit 1;; esac
          export MARKER POST_CODE DIAG_CODE
          python - <<'PY'
          import json, os, pathlib
          text=pathlib.Path('/tmp/diag.out').read_text(errors='replace')
          print('TELEMETRY_POST_HTTP=',os.environ['POST_CODE'])
          print('DIAGNOSTIC_GET_HTTP=',os.environ['DIAG_CODE'])
          print('SYNTHETIC_EVENT_VISIBLE=',os.environ['MARKER'] in text)
          d=json.loads(text)
          print('STATUS_WORKER_APOS_POST=',d.get('status'))
          if str(d.get('status','')).upper().replace('Á','A') in ('ERRO_DIAGNOSTICO','DEGRADADO'):
              raise SystemExit('Worker degradado apos telemetria')
          PY
          echo 'ENDPOINTS DE TELEMETRIA OK'
