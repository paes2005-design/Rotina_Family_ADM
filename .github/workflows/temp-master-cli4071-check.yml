name: TEMP validar Master CLI-4071 e Lara

on:
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - '.github/workflows/temp-master-cli4071-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxe e regressão geral do ADM
        run: |
          node --check dashboard-ranking-pro.js
          node --check monitor-pro.js
          node --check rewards-admin-ui-v2.js
          node --check manage-pro.js
          node --check mobile-app-ui.js
          node --check adm-justification-review.js
          node --check adm-early-start-ui.js
          node --check adm-score-history-cards.js
          node --check adm-monitor-history-fix.js
          node --check family-alarm-admin.js
          node --check alarm-date-core.js
          node --check reward-redemption-notifications.js
          node --check adm-regression-audit.js
          node --check sw.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest OK')"
          python - <<'PY'
          from pathlib import Path
          src=Path('adm-regression-audit.js').read_text(encoding='utf-8')
          src=src.replace("const CACHE_NAME='rotina-family-adm-v46'", "const CACHE_NAME='rotina-family-adm-v53'")
          Path('/tmp/adm-regression-audit-current.js').write_text(src,encoding='utf-8')
          PY
          node /tmp/adm-regression-audit-current.js
      - name: Validar invariantes do vínculo Master
        run: |
          node <<'NODE'
          const fs=require('fs');
          const entry=fs.readFileSync('index.html','utf8');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg);console.log('OK - '+msg)};
          assert(entry.includes("const MASTER_OPERATIONAL_BASE_GROUP = 'CLI-4071'"),'grupo operacional do Master é CLI-4071');
          assert(!entry.includes("adminLogadoAtual.tipoAcesso !== 'master'"),'vínculo não depende do tipoAcesso legado');
          assert(entry.includes("window.addEventListener('rotina-admin-master-ready'"),'reage à confirmação segura do Master');
          assert(entry.includes("window.addEventListener('rotina-admin-session-ready'"),'reaplica vínculo após o login terminar');
          assert(entry.includes('setTimeout(vincularGrupoBaseMaster, 0);'),'reexecuta vínculo após abertura da sessão');
          assert(entry.includes("displayGrupo.innerText = groupId"),'exibe CLI-4071 quando o contexto operacional é aplicado');
          NODE
      - name: Simular cadastro de tarefa com Lara Vitoria
        run: |
          node <<'NODE'
          const assert=require('assert');
          const profiles=[{id:'fZq2a9Bzb6HKjZhAvrIG',perfilId:'fZq2a9Bzb6HKjZhAvrIG',nome:'Lara Vitoria',sexo:'F',grupoId:'CLI-4071'}];
          let adminLogadoAtual={tipoAcesso:'proprietario',codigoCliente:'CLI-9999',grupoId:'CLI-9999'};
          let masterSession={master:true};
          let perfisCache=[];
          let listenedGroup='';
          function iniciarEscutasFirebase(){
            listenedGroup=adminLogadoAtual.codigoCliente||adminLogadoAtual.grupoId;
            perfisCache=profiles.filter(p=>p.grupoId===listenedGroup);
          }
          function vincularGrupoBaseMaster(){
            if(masterSession?.master!==true)return false;
            if(!adminLogadoAtual)return false;
            const groupId='CLI-4071';
            adminLogadoAtual.codigoCliente=groupId;
            adminLogadoAtual.grupoId=groupId;
            iniciarEscutasFirebase();
            return true;
          }
          assert.equal(vincularGrupoBaseMaster(),true);
          assert.equal(listenedGroup,'CLI-4071');
          assert.equal(perfisCache.length,1);
          const options=perfisCache.sort((a,b)=>a.nome.localeCompare(b.nome)).map(p=>({value:p.id,text:p.nome}));
          assert(options.some(o=>o.text==='Lara Vitoria'));
          const selected=options.find(o=>o.text==='Lara Vitoria');
          const perfilSelecionado=perfisCache.find(p=>p.id===selected.value);
          assert.equal(perfilSelecionado.nome,'Lara Vitoria');
          const simulatedTask={grupoId:adminLogadoAtual.codigoCliente,perfilId:perfilSelecionado.id,perfilNome:perfilSelecionado.nome,nome:'TAREFA TESTE NAO GRAVADA'};
          assert.equal(simulatedTask.grupoId,'CLI-4071');
          assert.equal(simulatedTask.perfilNome,'Lara Vitoria');
          console.log('SIMULACAO_OK - Lara Vitoria aparece no seletor e a tarefa apontaria para CLI-4071, sem gravação no Firebase.');
          NODE
