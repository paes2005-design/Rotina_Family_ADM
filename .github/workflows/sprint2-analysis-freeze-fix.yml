name: Sprint 2 clean Tasks ownership refactor

on:
  push:
    paths:
      - '.github/workflows/sprint2-analysis-freeze-fix.yml'
      - 'scripts/sprint2_analysis_freeze_fix.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar refatoração limpa
        run: python scripts/sprint2_analysis_freeze_fix.py

      - name: Validar sintaxe JavaScript
        run: |
          node --check sprint2-integracao-login-realdata-v1.js
          node --check sprint2-tarefas-realdata-v2.js

      - name: Auditar ownership e remoção da colisão
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q "taskParticipant').addEventListener" sprint2-integracao-login-realdata-v1.js
          ! grep -q "taskSearch').addEventListener" sprint2-integracao-login-realdata-v1.js
          ! grep -q "taskFilter').addEventListener" sprint2-integracao-login-realdata-v1.js
          ! grep -q "window.RF_APP.renderTasks=render" sprint2-tarefas-realdata-v2.js
          grep -q "window.rotinaSprint2TasksRender" sprint2-tarefas-realdata-v2.js
          grep -q "document.querySelectorAll('.home-tab').forEach" sprint2-integracao-login-realdata-v1.js
          grep -q "function renderAnalysis" sprint2-integracao-login-realdata-v1.js
          if git diff --name-only | grep -Ev '^(sprint2-|scripts/sprint2_analysis_freeze_fix.py)' >/dev/null; then
            echo 'ERRO: arquivo fora do Sprint 2 alterado'
            git diff --name-only
            exit 1
          fi
          echo 'OWNERSHIP_AUDIT=7/7'

      - name: Mostrar alterações
        run: git diff --stat && git diff --check

      - name: Publicar refatoração auditada
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Nenhuma alteração pendente.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sprint2-integracao-login-realdata-v1.js sprint2-tarefas-realdata-v2.js sprint2-integracao-login-realdata-v1.html sprint2-integracao-monitor-v2.html sprint2-integracao-participantes-v1.html sprint2-integracao-recompensas-v1.html
          git commit -m 'Sprint 2: elimina colisão entre Início e Tarefas V2'
          git push
