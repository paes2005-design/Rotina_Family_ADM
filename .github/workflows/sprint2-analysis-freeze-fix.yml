name: Sprint 2 analysis freeze fix

on:
  push:
    paths:
      - '.github/workflows/sprint2-analysis-freeze-fix.yml'
      - 'scripts/sprint2_analysis_freeze_fix.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correção isolada da Análise
        run: python scripts/sprint2_analysis_freeze_fix.py

      - name: Validar sintaxe JavaScript
        run: node --check sprint2-integracao-login-realdata-v1.js

      - name: Auditar escopo e proteções
        shell: bash
        run: |
          set -euo pipefail
          grep -q "participantIndexes" sprint2-integracao-login-realdata-v1.js
          grep -q "sprint2.realdata_analise_lenta" sprint2-integracao-login-realdata-v1.js
          grep -q "sprint2.realdata_analise_erro" sprint2-integracao-login-realdata-v1.js
          if git diff --name-only | grep -Ev '^(sprint2-|scripts/sprint2_analysis_freeze_fix.py)' >/dev/null; then
            echo 'ERRO: arquivo fora do Sprint 2 alterado'
            git diff --name-only
            exit 1
          fi
          echo 'Escopo Sprint 2: OK'

      - name: Mostrar alterações
        run: git diff --stat && git diff --check

      - name: Publicar correção auditada
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Nenhuma alteração pendente.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sprint2-integracao-login-realdata-v1.js sprint2-integracao-login-realdata-v1.html sprint2-integracao-monitor-v2.html sprint2-integracao-participantes-v1.html sprint2-integracao-recompensas-v1.html
          git commit -m 'Sprint 2: corrige travamento da Análise'
          git push
