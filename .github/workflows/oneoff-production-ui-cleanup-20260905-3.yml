name: One-off production UI cleanup 20260905.3

on:
  push:
    paths:
      - '.github/triggers/production-ui-cleanup-20260905-3.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply production cleanup and bump build
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]}')
              text = text.replace(old, new, -1 if count is None else count)
              p.write_text(text, encoding='utf-8')

          # 1) Faixa superior: manter apenas a confirmação útil de sincronização.
          replace(
              'sprint2-integracao-login-realdata-v1.js',
              "const VERSION='integracao-login-realdata-v1.1-series-normalization';",
              "const VERSION='integracao-login-realdata-v1.2-production-clean';"
          )
          replace(
              'sprint2-integracao-login-realdata-v1.js',
              "$('syncStatus').textContent=`${runtime.profiles.length} participantes • ${runtime.taskDocs.length} registros de agenda • sincronizado agora`;",
              "$('syncStatus').textContent='Sincronizado agora';"
          )

          # 2) Monitor: remover explicações internas e o selo técnico.
          replace(
              'sprint2-monitor-realdata-v2.js',
              "const VERSION='monitor-realdata-v3.1-result-colors';",
              "const VERSION='monitor-realdata-v3.2-production-clean';"
          )
          replace(
              'sprint2-monitor-realdata-v2.js',
              "injectStyle();ensureControls();const note=$('view-monitor')?.querySelector('.integration-note');if(note)note.innerHTML='<b>Monitor V3:</b> o ADM não recalcula a execução. Ele lê a ocorrência oficial registrada pelo Participante; sem ocorrência, a tarefa permanece Pendente.';\n  const pill=$('view-monitor')?.querySelector('.activepill');if(pill)pill.textContent='V3 • FONTE ÚNICA';\n  const n=$('view-monitor')?.querySelector('.monitor-note');if(n){n.className='monitor-v2-warning monitor-note';n.textContent='Arquitetura desta etapa: ADM configura a regra; Participante registra a execução; Monitor apenas acompanha o resultado. Store central: execuções e conclusões chegam automaticamente; a reconciliação remota periódica permanece como segurança e o botão Atualizar força uma conferência imediata.'}\n  const title=$('view-monitor')?.querySelector('h2');if(title)title.textContent='Acompanhamento operacional';const desc=$('view-monitor')?.querySelector('.head p');if(desc)desc.textContent='Previsto x realizado, resultado operacional em uma única leitura, pontos e revisão de justificativas.';const lastKpi=$('mPending')?.parentElement?.querySelector('small');if(lastKpi)lastKpi.textContent='Pendentes';",
              "injectStyle();ensureControls();const note=$('view-monitor')?.querySelector('.integration-note');if(note)note.remove();\n  const pill=$('view-monitor')?.querySelector('.activepill');if(pill)pill.remove();\n  const n=$('view-monitor')?.querySelector('.monitor-note');if(n)n.remove();\n  const title=$('view-monitor')?.querySelector('h2');if(title)title.textContent='Acompanhamento operacional';const desc=$('view-monitor')?.querySelector('.head p');if(desc)desc.remove();const lastKpi=$('mPending')?.parentElement?.querySelector('small');if(lastKpi)lastKpi.textContent='Pendentes';"
          )

          # 3) Limpeza global da interface e identificação da build.
          replace(
              'sprint2-recompensas-realdata-v1.js',
              "const VERSION='recompensas-realdata-v1.2-production-ui';",
              "const VERSION='recompensas-realdata-v1.3-production-ui';"
          )
          replace(
              'sprint2-recompensas-realdata-v1.js',
              "const APP_BUILD='20260905.2';",
              "const APP_BUILD='20260905.3';"
          )
          replace(
              'sprint2-recompensas-realdata-v1.js',
              "document.querySelectorAll('#view-monitor .integration-note,#view-monitor .monitor-note').forEach(el=>el.remove());",
              "document.querySelectorAll('#view-monitor .integration-note,#view-monitor .monitor-note,#view-monitor .head p,#view-monitor .activepill').forEach(el=>el.remove());"
          )
          replace(
              'sprint2-recompensas-realdata-v1.js',
              "const pill=$('view-monitor')?.querySelector('.activepill');if(pill&&/V3|FONTE ÚNICA/i.test(clean(pill.textContent)))pill.textContent='SOMENTE LEITURA';",
              "const pill=$('view-monitor')?.querySelector('.activepill');if(pill)pill.remove();"
          )

          # 4) Cache-busters e release oficial da V9.
          replace('index-ADMIN-v9.html', './manifest.json?v=20260905.1', './manifest.json?v=20260905.3')
          replace('index-ADMIN-v9.html', 'sprint2-integracao-login-realdata-v1.js?v=20260903-tasks-ownership-v1', 'sprint2-integracao-login-realdata-v1.js?v=20260905-production-clean-v12')
          replace('index-ADMIN-v9.html', 'sprint2-data-store-v1.js?v=20260903-conquistas-v1', 'sprint2-data-store-v1.js?v=20260905-realtime-rewards-v11')
          replace('index-ADMIN-v9.html', 'sprint2-recompensas-realdata-v1.js?v=20260903-conquistas-v1', 'sprint2-recompensas-realdata-v1.js?v=20260905-production-ui-v13')
          replace('index-ADMIN-v9.html', 'sprint2-monitor-realdata-v2.js?v=20260905-monitor-result-v31', 'sprint2-monitor-realdata-v2.js?v=20260905-monitor-clean-v32')

          replace('sw.js', "const CACHE_NAME='rotina-family-adm-v91-production-20260905.2';", "const CACHE_NAME='rotina-family-adm-v92-production-20260905.3';")
          replace('sw.js', "const ROTINA_SW_VERSION='91';", "const ROTINA_SW_VERSION='92';")
          replace('sw.js', "const ROTINA_BUILD_ID='20260905.2';", "const ROTINA_BUILD_ID='20260905.3';")
          replace('sw.js', './manifest.json?v=20260905.1', './manifest.json?v=20260905.3')
          replace('sw.js', 'sprint2-integracao-login-realdata-v1.js?v=20260903-tasks-ownership-v1', 'sprint2-integracao-login-realdata-v1.js?v=20260905-production-clean-v12')
          replace('sw.js', 'sprint2-data-store-v1.js?v=20260903-conquistas-v1', 'sprint2-data-store-v1.js?v=20260905-realtime-rewards-v11')
          replace('sw.js', 'sprint2-recompensas-realdata-v1.js?v=20260903-conquistas-v1', 'sprint2-recompensas-realdata-v1.js?v=20260905-production-ui-v13')
          replace('sw.js', 'sprint2-monitor-realdata-v2.js?v=20260905-monitor-result-v31', 'sprint2-monitor-realdata-v2.js?v=20260905-monitor-clean-v32')
          replace('sw.js', 'release=20260905.2', 'release=20260905.3')

          replace('index.html', '20260905.2', '20260905.3')
          replace('manifest.json', './index.html?release=20260905.1', './index.html?release=20260905.3')
          PY

          node --check sprint2-integracao-login-realdata-v1.js
          node --check sprint2-monitor-realdata-v2.js
          node --check sprint2-recompensas-realdata-v1.js
          node --check sprint2-data-store-v1.js
          node --check sw.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sprint2-integracao-login-realdata-v1.js sprint2-monitor-realdata-v2.js sprint2-recompensas-realdata-v1.js index-ADMIN-v9.html sw.js index.html manifest.json
          git diff --cached --check
          git commit -m 'Clean production monitor UI and bump build 20260905.3'
          git push origin HEAD:main
