name: One-off production fix 20260905.4

on:
  push:
    paths:
      - '.github/triggers/production-ui-cleanup-20260905-3.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable group-admin challenge visibility and bump build
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:140]}')
              p.write_text(text.replace(old,new),encoding='utf-8')

          replace('sprint2-data-store-v1.js',
                  "const VERSION='sprint2-data-store-v1.1-live-rewards';",
                  "const VERSION='sprint2-data-store-v1.2-live-group-content';")
          replace('sprint2-data-store-v1.js',
                  "function conquestAccess(){return clean(window.rotinaSprint2SessionSnapshot?.().role)==='master'}",
                  "function conquestAccess(){return ['adm_familia','adm_convidado','master'].includes(clean(window.rotinaSprint2SessionSnapshot?.().role))}")
          replace('sprint2-data-store-v1.js',
                  "if(liveGroup===g&&liveUnsubs.length===3)return true;",
                  "if(liveGroup===g&&liveUnsubs.length===5)return true;")
          replace('sprint2-data-store-v1.js',
                  "['resgates','redemptions','live-resgates']\n  ];",
                  "['resgates','redemptions','live-resgates'],\n    ['conquistas','conquests','live-conquistas'],\n    ['conquistaHistorico','conquestEvents','live-conquista-historico']\n  ];")
          replace('sprint2-data-store-v1.js',
                  "const liveAlready=liveGroup===g&&liveUnsubs.length===3;",
                  "const liveAlready=liveGroup===g&&liveUnsubs.length===5;")

          replace('sprint2-recompensas-realdata-v1.js',"const APP_BUILD='20260905.3';","const APP_BUILD='20260905.4';")
          replace('index-ADMIN-v9.html','sprint2-data-store-v1.js?v=20260905-realtime-rewards-v11','sprint2-data-store-v1.js?v=20260905-group-content-v12')
          replace('sw.js','sprint2-data-store-v1.js?v=20260905-realtime-rewards-v11','sprint2-data-store-v1.js?v=20260905-group-content-v12')

          for path in ['index-ADMIN-v9.html','index.html','manifest.json','sw.js']:
              p=Path(path); t=p.read_text(encoding='utf-8'); p.write_text(t.replace('20260905.3','20260905.4'),encoding='utf-8')
          replace('sw.js',"const CACHE_NAME='rotina-family-adm-v92-production-20260905.4';","const CACHE_NAME='rotina-family-adm-v93-production-20260905.4';")
          replace('sw.js',"const ROTINA_SW_VERSION='92';","const ROTINA_SW_VERSION='93';")
          PY

          node --check sprint2-data-store-v1.js
          node --check sprint2-conquistas-realdata-v1.js
          node --check sprint2-recompensas-realdata-v1.js
          node --check sw.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sprint2-data-store-v1.js sprint2-recompensas-realdata-v1.js index-ADMIN-v9.html index.html manifest.json sw.js
          git diff --cached --check
          git commit -m 'Show group challenges to group administrators build 20260905.4'
          git push origin HEAD:main
