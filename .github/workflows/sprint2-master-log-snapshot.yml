name: Sprint 2 Master live log snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sprint2-master-log-snapshot.yml'

permissions:
  contents: read

env:
  DIAG_URL: https://rotina-family-onesignal-scheduler.rotina-family-onesignal-scheduler.workers.dev/diagnostico-tecnico
  MON_URL: https://rotina-family-onesignal-scheduler.rotina-family-onesignal-scheduler.workers.dev/monitoramento

jobs:
  master-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Ler monitoramento vivo
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 25 "$MON_URL" -o /tmp/monitor.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/monitor.json',encoding='utf-8'))
          print('MONITOR_STATUS=',d.get('status'))
          print('LAST_RUN_AT=',d.get('lastRunAt'))
          print('VERSIONS=',json.dumps((d.get('lastRun') or {}).get('versions',{}),ensure_ascii=False))
          print('HEALTH_REASONS=',json.dumps(d.get('healthReasons',{}),ensure_ascii=False))
          PY

      - name: Ler eventos vivos da Master
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 25 "$DIAG_URL?limit=400" -o /tmp/diag.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/diag.json',encoding='utf-8'))
          print('DIAG_STATUS=',d.get('status'))
          print('GENERATED_AT=',d.get('generatedAt'))
          print('SUMMARY=',json.dumps(d.get('summary',{}),ensure_ascii=False))
          logs=d.get('logs',[]) or []
          master=[]
          for x in logs:
              event=str(x.get('evento',''))
              page=str(x.get('pagina',''))
              details=json.dumps(x.get('detalhes',{}),ensure_ascii=False)
              hay=(event+' '+page+' '+details).lower()
              if event.startswith('master.') or 'adminmaster' in hay or 'master.api_' in hay or 'master.botao_' in hay:
                  master.append(x)
          print('MASTER_EVENT_COUNT=',len(master))
          counts={}
          for x in master:
              e=str(x.get('evento',''))
              counts[e]=counts.get(e,0)+1
          print('MASTER_EVENT_COUNTS=',json.dumps(counts,ensure_ascii=False,sort_keys=True))
          for x in master[:80]:
              safe={
                'clienteEm':x.get('clienteEm'),
                'evento':x.get('evento'),
                'nivel':x.get('nivel'),
                'pagina':x.get('pagina'),
                'detalhes':x.get('detalhes',{})
              }
              print('MASTER_EVENT=',json.dumps(safe,ensure_ascii=False))
          errs=[x for x in master if str(x.get('nivel','')).lower()=='error' or str(x.get('evento','')).endswith('_erro')]
          print('MASTER_ERROR_COUNT=',len(errs))
          if str(d.get('status','')).upper().replace('Á','A') in ('ERRO_DIAGNOSTICO','DEGRADADO'):
              raise SystemExit('Diagnostico vivo nao esta saudavel')
          PY
