name: One-off corrigir Master CLI-4071 no PWA

on:
  push:
    branches: [main]
    paths: ['.github/workflows/oneoff-patch-pwa-master-cli4071.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correção já validada na página real do PWA
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          entry=Path('index.html').read_text(encoding='utf-8')
          p=Path('index-ADMIN-v8.html')
          s=p.read_text(encoding='utf-8')
          m=re.search(r"const masterBridge = `(.*?)`;\n\s*const loginAnchor",entry,re.S)
          if not m: raise SystemExit('masterBridge validado não encontrado no index.html')
          bridge=m.group(1)
          anchor='    window.realizarLogin = async () => {'
          if 'const MASTER_OPERATIONAL_BASE_GROUP' not in s:
              if anchor not in s: raise SystemExit('âncora de login não encontrada')
              s=s.replace(anchor,bridge+anchor,1)
          old="            if(snap.empty) throw new Error('Cadastro administrativo não encontrado.');"
          new="""            if(snap.empty) {
                if (await aguardarConfirmacaoMaster(cred.user)) {
                    abrirShellMaster(cred.user);
                    return;
                }
                throw new Error('Cadastro administrativo não encontrado.');
            }"""
          if old in s: s=s.replace(old,new,1)
          old2="""            if(snap.empty) {
                await signOut(auth);
                alert('Sessão autenticada sem cadastro administrativo correspondente.');
                return;
            }"""
          new2="""            if(snap.empty) {
                if (await aguardarConfirmacaoMaster(user)) {
                    abrirShellMaster(user);
                    return;
                }
                await signOut(auth);
                alert('Sessão autenticada sem cadastro administrativo correspondente.');
                return;
            }"""
          if old2 in s: s=s.replace(old2,new2,1)
          s=s.replace('./admin-master.js?v=1','./admin-master.js?v=2')
          s=s.replace("navigator.serviceWorker.register('./sw.js?v=39')","navigator.serviceWorker.register('./sw.js?v=53')")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Testar vínculo Master, CLI-4071 e Lara Vitoria
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index-ADMIN-v8.html').read_text(encoding='utf-8')
          for x in ["const MASTER_OPERATIONAL_BASE_GROUP = 'CLI-4071'","window.addEventListener('rotina-admin-master-ready'","window.addEventListener('rotina-admin-session-ready'",'await aguardarConfirmacaoMaster(cred.user)','await aguardarConfirmacaoMaster(user)','./admin-master.js?v=2',"navigator.serviceWorker.register('./sw.js?v=53')",'where("grupoId", "==", gId)',"document.getElementById('tarefaResponsavel')"]:
              assert x in s,x
          assert "adminLogadoAtual.tipoAcesso !== 'master'" not in s
          print('PWA_MASTER_4071_SOURCE_OK')
          PY
          node - <<'NODE'
          const assert=require('assert');
          const perfis=[{id:'fZq2a9Bzb6HKjZhAvrIG',nome:'Lara Vitoria',grupoId:'CLI-4071'}];
          let admin={tipoAcesso:'proprietario',grupoId:'CLI-9999',codigoCliente:'CLI-9999'};
          if(true){admin.grupoId='CLI-4071';admin.codigoCliente='CLI-4071'}
          const cache=perfis.filter(p=>p.grupoId===admin.grupoId);
          const opcao=cache.map(p=>({value:p.id,text:p.nome})).find(x=>x.text==='Lara Vitoria');
          assert(opcao);
          const tarefa={grupoId:admin.grupoId,perfilId:opcao.value,perfilNome:opcao.text};
          assert.deepEqual(tarefa,{grupoId:'CLI-4071',perfilId:'fZq2a9Bzb6HKjZhAvrIG',perfilNome:'Lara Vitoria'});
          console.log('SIMULACAO_TAREFA_LARA_OK');
          NODE
      - name: Publicar correção e limpar rotina temporária
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-ADMIN-v8.html
          git rm .github/workflows/oneoff-patch-pwa-master-cli4071.yml
          git commit -m "Hotfix: Master carregar Lara Vitoria também no PWA"
          git push
