name: Sprint 2 ADM SPA v3 audit

on:
  push:
    paths:
      - 'sprint2-adm-preview-v3.html'
      - 'sprint2-adm-v3.css'
      - 'sprint2-adm-base-v3.js'
      - 'sprint2-adm-rewards-v3.js'
      - 'sprint2-recompensas-core-v1.js'
      - '.github/workflows/sprint2-adm-v3-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          node --check sprint2-adm-base-v3.js
          node --check sprint2-adm-rewards-v3.js
          node --check sprint2-recompensas-core-v1.js
          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('sprint2-adm-preview-v3.html').read_text()
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          pathlib.Path('/tmp/v3-inline.js').write_text('\n'.join(x for x in blocks if x.strip()))
          PY
          node --check /tmp/v3-inline.js

      - name: Single SPA structure contract
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          h=Path('sprint2-adm-preview-v3.html').read_text()
          css=Path('sprint2-adm-v3.css').read_text()
          base=Path('sprint2-adm-base-v3.js').read_text()
          rewards=Path('sprint2-adm-rewards-v3.js').read_text()
          low=h.lower()
          assert '<iframe' not in low
          assert '<object' not in low
          assert '<embed' not in low
          assert 'data-route="recompensas"' in h
          assert 'data-route="conquistas"' not in h
          assert h.count('class="app"')==1
          assert h.count('id="mainNav"')==1
          assert h.count('id="mainScroll"')==1
          for view in ['tarefas','participantes','monitor','recompensas']:
              assert f'id="view-{view}"' in h
          assert h.index('id="rewardsSection"') < h.index('id="conquestsSection"')
          start=h.index('id="view-recompensas"'); end=h.index('</main>')
          assert start < h.index('id="conquestsSection"') < end
          assert 'Subproduto de Recompensas' in h
          assert "ROUTES=new Set(['tarefas','participantes','monitor','recompensas'])" in base
          assert "STORE_KEY='rotinaFamily.sprint2.clean.v3'" in base
          assert 'app.registerModule' in rewards
          assert 'const app=root.RF_APP' in rewards
          assert 'localStorage' not in rewards, 'Rewards must use the SPA shared state/persist layer'
          assert 'fetch(' not in rewards, 'Rewards must use the SPA shared telemetry layer'
          for bad in ['firebase.firestore','addDoc(','setDoc(','updateDoc(','deleteDoc(','getFirestore(']:
              assert bad not in h+base+rewards, f'preview must not write Firebase: {bad}'
          assert 'overflow-x:hidden' in css and 'max-width:100vw' in css
          class IDs(HTMLParser):
              def __init__(self): super().__init__(); self.ids=[]
              def handle_starttag(self,tag,attrs):
                  for k,v in attrs:
                      if k=='id': self.ids.append(v)
          p=IDs(); p.feed(h)
          dup={x for x in p.ids if p.ids.count(x)>1}
          assert not dup, f'duplicate ids: {sorted(dup)}'
          print('SINGLE SPA CONTRACT OK')
          PY

      - name: Preserve Tarefas Participantes Monitor contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('sprint2-adm-preview-v3.html').read_text(); b=Path('sprint2-adm-base-v3.js').read_text()
          html_need=['newTaskBtn','taskParticipant','taskSearch','taskFilter','taskConflict','newParticipantBtn','participantBody','monitorParticipant','monitorTimeline']
          js_need=['validTimeRange','intervalsOverlap','findScheduleConflicts','task_schedule_blocked','participant_save','monitorRows','normalizeTargets','__SPRINT2_TEST__']
          for x in html_need: assert f'id="{x}"' in h, x
          for x in js_need: assert x in b, x
          assert "state.taskParticipant==='__ALL__'" in b
          assert "toMinutes(startA)<toMinutes(endB)&&toMinutes(endA)>toMinutes(startB)" in b
          assert "if(pin&&!/^\\d{4,6}$/.test(pin))" in b
          print('BASELINE CONTRACTS PRESERVED')
          PY

      - name: Recompensas and Conquistas contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('sprint2-adm-preview-v3.html').read_text(); r=Path('sprint2-adm-rewards-v3.js').read_text(); c=Path('sprint2-recompensas-core-v1.js').read_text()
          for x in ['newRewardBtn','rewardFilter','requestParticipant','requestStatus','requestRefDate','requestPeriod','newConquestBtn','conquestParticipant','conquestType','conquestStatus','participantPreview']:
              assert f'id="{x}"' in h, x
          for x in ['Aprovado','Recusado',"r.status!=='Pendente'",'historyPreserved:true','Recompensa aguardando validação','no_justification_days','percent_points','on_time_days','tasks_100','points']:
              assert x in r+h, x
          for x in ['unique','periodic','continuous','Ciclo atual','participantVisible','pending_closed']:
              assert x in c, x
          print('REWARDS + CONQUISTAS CONTRACTS OK')
          PY

      - name: Conquistas lifecycle unit tests
        run: |
          node - <<'NODE'
          const assert=require('assert'); const core=require('./sprint2-recompensas-core-v1.js');
          const base=(mode,repeat=3)=>({active:true,cycleMode:mode,repeatCount:repeat,target:2,runtime:{progress:0,attemptsUsed:0,rewardsValidated:0,pendingValidation:false,closed:false,lastResult:''}});
          let c=core.finishAttempt(base('unique'),false); assert.equal(c.active,false); assert.equal(c.runtime.closed,true); assert.equal(core.participantVisible(c),false);
          c=core.addProgress(base('unique'),2); assert.equal(c.runtime.pendingValidation,true); assert.equal(c.active,false); assert.equal(core.status(c).key,'pending_closed'); assert.equal(core.participantVisible(c),false); c=core.validateReward(c); assert.equal(c.active,false);
          c=core.finishAttempt(base('periodic',3),false); assert.equal(c.runtime.attemptsUsed,1); assert.equal(c.active,true); c=core.addProgress(c,2); assert.equal(c.runtime.attemptsUsed,2); assert.equal(c.runtime.pendingValidation,true); c=core.validateReward(c); assert.equal(c.active,true); c=core.finishAttempt(c,false); assert.equal(c.runtime.attemptsUsed,3); assert.equal(c.active,false); assert.equal(core.participantVisible(c),false);
          c=core.finishAttempt(base('continuous'),false); assert.equal(c.active,true); assert.equal(core.attemptLabel(c),'Ciclo atual 2 · 1 concluído(s)'); c=core.addProgress(c,2); assert.equal(c.runtime.pendingValidation,true); c=core.validateReward(c); assert.equal(c.active,true); assert.equal(core.participantVisible(c),true); assert.equal(core.attemptLabel(c),'Ciclo atual 3 · 2 concluído(s)');
          c=base('periodic',3); c.runtime.closed=true; c.active=true; assert.equal(core.participantVisible(c),false);
          console.log('CONQUISTAS LIFECYCLE OK');
          NODE

      - name: Lightweight budget
        run: |
          python - <<'PY'
          from pathlib import Path
          files=['sprint2-adm-preview-v3.html','sprint2-adm-v3.css','sprint2-adm-base-v3.js','sprint2-adm-rewards-v3.js','sprint2-recompensas-core-v1.js']
          sizes={f:Path(f).stat().st_size for f in files}; total=sum(sizes.values())
          print(sizes); print('TOTAL',total)
          assert sizes['sprint2-adm-preview-v3.html'] < 30000
          assert sizes['sprint2-adm-base-v3.js'] < 40000
          assert sizes['sprint2-adm-rewards-v3.js'] < 30000
          assert sizes['sprint2-recompensas-core-v1.js'] < 10000
          assert total < 110000
          print('LIGHTWEIGHT BUDGET OK')
          PY
