name: Sprint 2 fix task detail calendar call

on:
  push:
    paths:
      - '.github/workflows/sprint2-fix-task-detail-calendar-call.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corrigir chamada do calendário
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('sprint2-tarefas-realdata-v2.js')
          s=p.read_text(encoding='utf-8')
          old='function agendaFields(day,start,end){const date=dataForDay(day)'
          new='function agendaFields(day,start,end){const date=dateForDay(day)'
          if s.count(old)!=1:
              raise SystemExit(f'Esperado 1 trecho com typo; encontrado {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Auditar caminho de gravação dos detalhes
        shell: bash
        run: |
          set -euo pipefail
          node --check sprint2-tarefas-realdata-v2.js
          grep -q 'function dateForDay(day)' sprint2-tarefas-realdata-v2.js
          grep -q 'const date=dateForDay(day)' sprint2-tarefas-realdata-v2.js
          ! grep -q 'dataForDay(day)' sprint2-tarefas-realdata-v2.js
          grep -q 'saveDetails' sprint2-tarefas-realdata-v2.js
          grep -q "fs.doc(db,'despertadores'" sprint2-tarefas-realdata-v2.js
          test "$(grep -o 'onSnapshot(' sprint2-data-store-v1.js | wc -l)" -eq 1
          git diff --check
          echo 'DETAIL_RUNTIME_AUDIT=PASS'
      - name: Publicar correção
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sprint2-tarefas-realdata-v2.js
          git commit -m 'Sprint 2: corrige calendário ao salvar detalhes de Tarefas'
          git push
