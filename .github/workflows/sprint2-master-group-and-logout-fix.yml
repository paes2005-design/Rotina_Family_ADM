name: Sprint 2 master group and logout fix

on:
  push:
    paths:
      - '.github/workflows/sprint2-master-group-and-logout-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar seletor Master e Sair visivel
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          hp=Path('sprint2-integracao-login-realdata-v1.html')
          h=hp.read_text(encoding='utf-8')
          css='''.master-group-panel{margin-top:14px;padding-top:14px;border-top:1px solid #e6e8f0}.master-group-panel[hidden]{display:none}.master-group-panel h2{font-size:18px;margin:0 0 6px}.master-group-panel p{margin:0 0 10px}.master-group-panel input{width:100%;padding:13px;border:1px solid #d7dbe6;border-radius:11px;font-size:15px;text-transform:uppercase}.master-group-actions{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.master-group-actions button{border:0;border-radius:11px;padding:12px 14px;font-weight:850;cursor:pointer}.master-group-open{background:var(--u-purple);color:#fff}.master-group-exit{background:#f0f1f5;color:#555d70}.master-group-message{min-height:18px;font-size:11px;margin-top:8px;color:#687083}.master-group-message.bad{color:var(--bad)}.top-logout{border:1px solid #ded9eb;background:#fff;color:#5d5279;border-radius:10px;padding:9px 12px;font-weight:850;cursor:pointer;white-space:nowrap}@media(max-width:900px){.top-logout{padding:9px 10px;font-size:11px}.master-group-actions{grid-template-columns:1fr}}
'''
          if '.master-group-panel{' not in h:
              h=h.replace('</style>',css+'</style>',1)

          old='</form></div></section>'
          panel='''</form><div class="master-group-panel" id="masterGroupPanel" hidden><div class="eyebrow">Acesso Master</div><h2>Escolha o grupo</h2><p>O Master não pertence a um grupo. Selecione qual grupo deseja abrir em modo leitura.</p><div class="auth-field"><label for="masterGroupInput">Grupo</label><input id="masterGroupInput" value="CLI-4071" inputmode="text" autocomplete="off"></div><div class="master-group-actions"><button class="master-group-open" id="masterGroupLoad" type="button">Abrir grupo</button><button class="master-group-exit" id="masterLogoutButton" type="button">Sair</button></div><div id="masterGroupMessage" class="master-group-message" role="status"></div></div></div></section>'''
          if 'id="masterGroupPanel"' not in h:
              if old not in h: raise SystemExit('Fechamento do formulario de login nao encontrado')
              h=h.replace(old,panel,1)

          marker='</span></div></div><div class="realdata-strip">'
          repl='</span></div><button class="top-logout" id="logoutTopButton" type="button">🚪 Sair</button></div><div class="realdata-strip">'
          if 'id="logoutTopButton"' not in h:
              if marker not in h: raise SystemExit('Topo da aplicacao nao encontrado')
              h=h.replace(marker,repl,1)
          hp.write_text(h,encoding='utf-8')

          jp=Path('sprint2-integracao-login-realdata-v1.js')
          j=jp.read_text(encoding='utf-8')

          role_line="function roleLabel(role){return ROLE_LABEL[role]||role||'Administrador'}"
          helpers=r'''function roleLabel(role){return ROLE_LABEL[role]||role||'Administrador'}
function normalizeGroupId(value){const v=clean(value).toUpperCase();if(!v)return'';if(/^CLI-\d+$/.test(v))return v;if(/^\d+$/.test(v))return`CLI-${v}`;return v}
function setMasterGroupMessage(text='',bad=false){const el=$('masterGroupMessage');if(!el)return;el.textContent=text;el.className=`master-group-message${bad?' bad':''}`}
function showMasterGroupPicker(){runtime.role='master';runtime.groupId='';$('loginForm').hidden=true;$('masterGroupPanel').hidden=false;$('masterGroupInput').value=normalizeGroupId(sessionStorage.getItem('rf-sprint2-master-selected-group'))||'CLI-4071';setMasterGroupMessage('Conta Master autenticada. Escolha o grupo que deseja visualizar.');setLoginMessage('')}
function resetAuthGate(){$('loginForm').hidden=false;$('masterGroupPanel').hidden=true;setMasterGroupMessage('')}
async function openMasterGroup(){const groupId=normalizeGroupId($('masterGroupInput').value);if(!/^CLI-\d+$/.test(groupId))return setMasterGroupMessage('Informe um grupo no formato CLI-4071 ou apenas 4071.',true);$('masterGroupInput').value=groupId;$('masterGroupLoad').disabled=true;setMasterGroupMessage(`Abrindo ${groupId}…`);try{sessionStorage.setItem('rf-sprint2-master-selected-group',groupId);await loadRealGroup('master',groupId);setMasterGroupMessage('');await emitLog('sprint2.realdata_master_grupo_aberto',{grupoIdSelecionado:groupId})}catch(e){setMasterGroupMessage(friendlyError(e),true)}finally{$('masterGroupLoad').disabled=false}}
async function logoutCurrent(){await emitLog('sprint2.realdata_logout',{papel:runtime.role});await signOut(auth).catch(()=>{});runtime.groupId='';runtime.role='';sessionStorage.removeItem('rf-sprint2-master-selected-group');document.body.classList.remove('rf-auth-ready');resetAuthGate();setLoginMessage('Sessão encerrada.')}'''
          if 'function normalizeGroupId(value)' not in j:
              if role_line not in j: raise SystemExit('roleLabel nao encontrado')
              j=j.replace(role_line,helpers,1)

          old_login="try{const session=await performLogin(email,password);$('loginSenha').value='';await loadRealGroup(session.role,session.groupId);setLoginMessage('');await emitLog('sprint2.realdata_login_sucesso',{papel:session.role})}catch(e)"
          new_login="try{const session=await performLogin(email,password);$('loginSenha').value='';if(session.role==='master'&&!session.groupId){showMasterGroupPicker();await emitLog('sprint2.realdata_master_autenticado',{papel:session.role})}else{await loadRealGroup(session.role,session.groupId);setLoginMessage('');await emitLog('sprint2.realdata_login_sucesso',{papel:session.role})}}catch(e)"
          if old_login in j:
              j=j.replace(old_login,new_login,1)
          elif new_login not in j:
              raise SystemExit('Fluxo de login esperado nao encontrado')

          old_logout="$('logoutButton').onclick=async()=>{await emitLog('sprint2.realdata_logout',{papel:runtime.role});await signOut(auth);runtime.groupId='';document.body.classList.remove('rf-auth-ready');setLoginMessage('Sessão encerrada.');};"
          new_logout="$('logoutButton').onclick=logoutCurrent;$('logoutTopButton').onclick=logoutCurrent;$('masterLogoutButton').onclick=logoutCurrent;$('masterGroupLoad').onclick=openMasterGroup;$('masterGroupInput').addEventListener('keydown',e=>{if(e.key==='Enter')openMasterGroup()});"
          if old_logout in j:
              j=j.replace(old_logout,new_logout,1)
          elif new_logout not in j:
              raise SystemExit('Binding antigo de logout nao encontrado')

          old_restore="const s=await restoreSession(user);await loadRealGroup(s.role,s.groupId);setLoginMessage('');await emitLog('sprint2.realdata_sessao_restaurada',{papel:s.role})"
          new_restore="const s=await restoreSession(user);if(s.role==='master'&&!s.groupId){const selected=normalizeGroupId(sessionStorage.getItem('rf-sprint2-master-selected-group'));if(selected){await loadRealGroup('master',selected);setLoginMessage('');await emitLog('sprint2.realdata_sessao_restaurada',{papel:s.role,grupoMaster:selected})}else{showMasterGroupPicker();await emitLog('sprint2.realdata_master_restaurado',{papel:s.role})}}else{await loadRealGroup(s.role,s.groupId);setLoginMessage('');await emitLog('sprint2.realdata_sessao_restaurada',{papel:s.role})}"
          if old_restore in j:
              j=j.replace(old_restore,new_restore,1)
          elif new_restore not in j:
              raise SystemExit('Fluxo antigo de restauracao nao encontrado')

          old_catch="setLoginMessage(error.message||'Não foi possível carregar os dados reais.',true);await emitLog('sprint2.realdata_sync_erro'"
          new_catch="if(role==='master')setMasterGroupMessage(error.message||'Não foi possível carregar os dados reais.',true);else setLoginMessage(error.message||'Não foi possível carregar os dados reais.',true);await emitLog('sprint2.realdata_sync_erro'"
          if old_catch in j:
              j=j.replace(old_catch,new_catch,1)
          elif new_catch not in j:
              raise SystemExit('Catch de sincronizacao nao encontrado')

          jp.write_text(j,encoding='utf-8')
          PY

      - name: Auditar ajuste
        shell: bash
        run: |
          set -euo pipefail
          node --check sprint2-integracao-login-realdata-v1.js
          python - <<'PY'
          from pathlib import Path
          h=Path('sprint2-integracao-login-realdata-v1.html').read_text(encoding='utf-8')
          j=Path('sprint2-integracao-login-realdata-v1.js').read_text(encoding='utf-8')
          checks={
            'master_picker':'id="masterGroupPanel"' in h and 'id="masterGroupInput"' in h,
            'grupo_4071_default':'value="CLI-4071"' in h,
            'sair_topo':'id="logoutTopButton"' in h,
            'sair_lateral':'id="logoutButton"' in h,
            'master_sem_grupo_aceito':"session.role==='master'&&!session.groupId" in j,
            'grupo_normalizado':'function normalizeGroupId(value)' in j,
            'master_carrega_grupo':"loadRealGroup('master',groupId)" in j,
            'master_persistencia':"rf-sprint2-master-selected-group" in j,
            'logout_unificado':'logoutCurrent' in j and "$('logoutTopButton').onclick=logoutCurrent" in j,
            'somente_leitura':all(x not in j for x in ['addDoc(','updateDoc(','deleteDoc(','writeBatch(','setDoc(']),
          }
          for k,v in checks.items(): print(f'{k}={v}')
          print(f'MASTER_GROUP_LOGOUT_RESULT={sum(checks.values())}/{len(checks)}')
          if not all(checks.values()): raise SystemExit('Falha na auditoria')
          PY
          changed="$(git diff --name-only | sort)"
          echo "$changed"
          test "$changed" = $'sprint2-integracao-login-realdata-v1.html\nsprint2-integracao-login-realdata-v1.js'

      - name: Commit do ajuste
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sprint2-integracao-login-realdata-v1.html sprint2-integracao-login-realdata-v1.js
          git commit -m 'Sprint 2: permitir Master selecionar grupo e exibir Sair'
          git push
