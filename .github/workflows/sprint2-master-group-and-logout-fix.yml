name: Sprint 2 master group and logout fix

on:
  push:
    paths:
      - '.github/workflows/sprint2-master-group-and-logout-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar seletor Master e Sair visivel
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Auditar ajuste
        shell: bash
        run: |
          set -euo pipefail
          node --check sprint2-integracao-login-realdata-v1.js
          grep -q 'id="masterGroupPanel"' sprint2-integracao-login-realdata-v1.html
          grep -q 'value="CLI-4071"' sprint2-integracao-login-realdata-v1.html
          grep -q 'id="logoutTopButton"' sprint2-integracao-login-realdata-v1.html
          grep -q "session.role==='master'&&!session.groupId" sprint2-integracao-login-realdata-v1.js
          grep -q "loadRealGroup('master',groupId)" sprint2-integracao-login-realdata-v1.js
          grep -q "logoutTopButton').onclick=logoutCurrent" sprint2-integracao-login-realdata-v1.js
          ! grep -Eq 'addDoc\(|updateDoc\(|deleteDoc\(|writeBatch\(|setDoc\(' sprint2-integracao-login-realdata-v1.js
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test "$changed" = $'sprint2-integracao-login-realdata-v1.html\nsprint2-integracao-login-realdata-v1.js'
          echo 'MASTER_GROUP_LOGOUT_RESULT=7/7'
      - name: Commit do ajuste
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sprint2-integracao-login-realdata-v1.html sprint2-integracao-login-realdata-v1.js
          git commit -m 'Sprint 2: permitir Master selecionar grupo e exibir Sair'
          git push
