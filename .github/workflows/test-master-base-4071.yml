name: Testar vínculo operacional Master CLI-4071

on:
  push:
    branches:
      - hotfix-master-vinculo-lara-4071-2026-08-22
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar escopo e invariantes
        shell: python
        run: |
          from pathlib import Path
          index = Path('index.html').read_text(encoding='utf-8')
          base = Path('index-ADMIN-v8.html').read_text(encoding='utf-8')
          assert "MASTER_OPERATIONAL_BASE_GROUP = 'CLI-4071'" in index
          assert "window.rotinaMasterSession?.master !== true" in index
          assert "adminLogadoAtual.tipoAcesso !== 'master'" in index
          assert "adminLogadoAtual.codigoCliente = groupId" in index
          assert "adminLogadoAtual.grupoId = groupId" in index
          assert "iniciarEscutasFirebase();" in index
          assert "rotina-master-operational-group-ready" in index
          assert "detail: { grupoId: groupId }" in index
          assert "rotina-admin-session-ready', { detail: { grupoId: groupId" not in index
          assert 'const qPerfis = query(collection(db, "perfis"), where("grupoId", "==", gId));' in base
          assert 'perfisCache = snapshot.docs.map' in base
          assert "document.getElementById('tarefaResponsavel')" in base
          assert 'const perfilSelecionado = perfisCache.find' in base
          print('VÍNCULO MASTER CLI-4071: invariantes OK')
      - name: Sintaxe do script de entrada
        shell: python
        run: |
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script>\s*(.*?)\s*</script>', html, re.S)
          assert m, 'script principal não encontrado'
          Path('/tmp/index-entry.js').write_text(m.group(1), encoding='utf-8')
      - run: node --check /tmp/index-entry.js
