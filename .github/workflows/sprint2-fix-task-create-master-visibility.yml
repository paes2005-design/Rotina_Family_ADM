name: Sprint2 Consolidate Task And Master

on:
  push:
    paths:
      - '.github/workflows/sprint2-fix-task-create-master-visibility.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidar fontes
        run: python .github/scripts/consolidate_sprint2_task_master.py
      - name: Validar fontes
        run: |
          node --check sprint2-tarefas-realdata-v2.js
          node --check sprint2-master-realdata-v1.js
          node --check sprint2-integracao-login-realdata-bridge-v1.js
          grep -q "tarefas-realdata-v2.8-create-with-details" sprint2-tarefas-realdata-v2.js
          grep -q "function createDetailFields" sprint2-tarefas-realdata-v2.js
          grep -q "createSelectedDays" sprint2-tarefas-realdata-v2.js
          grep -q "create_details_success" sprint2-tarefas-realdata-v2.js
          grep -q "nome:name,icone:icon" sprint2-tarefas-realdata-v2.js
          grep -q "master-realdata-v1.3-role-visibility" sprint2-master-realdata-v1.js
          grep -q "removeAttribute('aria-hidden')" sprint2-master-realdata-v1.js
          grep -q 'id="masterNavButton" class="next-stage" hidden disabled aria-hidden="true"' sprint2-integracao-recompensas-v1.html
          grep -q '20260905-create-with-details-v28' sprint2-integracao-recompensas-v1.html
          grep -q '20260905-master-realdata-v13-role-visibility' sprint2-integracao-login-realdata-bridge-v1.js
          test "$(grep -o 'fs\.onSnapshot' sprint2-data-store-v1.js | wc -l | tr -d ' ')" = "1"
      - name: Publicar consolidação
        run: |
          git config user.name 'paes2005-design'
          git config user.email 'paes2005@gmail.com'
          git add sprint2-tarefas-realdata-v2.js sprint2-master-realdata-v1.js sprint2-integracao-login-realdata-bridge-v1.js sprint2-integracao-recompensas-v1.html
          git commit -m 'Sprint 2: consolida criação completa e visibilidade Master'
          git push
