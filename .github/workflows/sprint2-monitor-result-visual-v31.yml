name: Sprint2 Monitor Result Visual V31

on:
  push:
    paths:
      - '.github/workflows/sprint2-monitor-result-visual-v31.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar consolidação
        run: python scripts/_tmp_monitor_v31.py
      - name: Validar Monitor V3.1
        run: |
          node --check sprint2-monitor-realdata-v2.js
          grep -Fq "monitor-realdata-v3.1-result-colors" sprint2-monitor-realdata-v2.js
          grep -Fq "<span>Resultado</span><span>Pontos</span><span>Ações</span>" sprint2-monitor-realdata-v2.js
          ! grep -Fq "<span>Faixa</span>" sprint2-monitor-realdata-v2.js
          grep -Fq "result-100" sprint2-monitor-realdata-v2.js
          grep -Fq "result-75" sprint2-monitor-realdata-v2.js
          grep -Fq "result-50" sprint2-monitor-realdata-v2.js
          grep -Fq "result-0" sprint2-monitor-realdata-v2.js
          grep -Fq "result-running" sprint2-monitor-realdata-v2.js
          grep -Fq "result-pending" sprint2-monitor-realdata-v2.js
          grep -Fq "sprint2-monitor-realdata-v2.js?v=20260905-monitor-result-v31" sprint2-integracao-recompensas-v1.html
      - name: Publicar consolidação
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sprint2-monitor-realdata-v2.js sprint2-integracao-recompensas-v1.html
          git commit -m 'Sprint 2: unifica resultado e cores do Monitor V3.1'
          git push
