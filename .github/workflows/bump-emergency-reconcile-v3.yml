name: Force emergency reconciliation v3
on:
  push:
    paths:
      - '.github/workflows/bump-emergency-reconcile-v3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump emergency module cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index-ADMIN-v8.html')
          s=p.read_text()
          old='./adm-emergency-reconcile-20260826.js?v=1'
          new='./adm-emergency-reconcile-20260826.js?v=3'
          if old not in s and new not in s:
              raise SystemExit('emergency module tag not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-ADMIN-v8.html
          git diff --cached --quiet && exit 0
          git commit -m 'Load compensated 17:55 test fix'
          git push
