name: Disable emergency reconciliation auto-run v4
on:
  push:
    paths:
      - '.github/workflows/bump-emergency-reconcile-v3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Activate emergency module v4
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index-ADMIN-v8.html')
          s=p.read_text(encoding='utf-8')
          old='./adm-emergency-reconcile-20260826.js?v=3'
          new='./adm-emergency-reconcile-20260826.js?v=4'
          if old not in s and new not in s:
              raise SystemExit('emergency module tag not found')
          p.write_text(s.replace(old,new),encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('index-ADMIN-v8.html?entry=20260826.2','index-ADMIN-v8.html?entry=20260826.4')
          s=s.replace('index-ADMIN-v8.html?entry=20260826.3','index-ADMIN-v8.html?entry=20260826.4')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check adm-emergency-reconcile-20260826.js
          grep -q 'adm-emergency-reconcile-20260826.js?v=4' index-ADMIN-v8.html
          grep -q 'AUTO_ENABLED=false' adm-emergency-reconcile-20260826.js
          grep -q 'index-ADMIN-v8.html?entry=20260826.4' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html index-ADMIN-v8.html
          git diff --cached --quiet && exit 0
          git commit -m 'Stop ADM emergency reconciliation auto-run'
          git push origin main
