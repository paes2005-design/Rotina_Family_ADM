name: Sprint2 Cache Bust V26

on:
  push:
    paths:
      - '.github/workflows/sprint2-cache-bust-v26.yml'

permissions:
  contents: write

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar cache-bust da Tarefas
        run: |
          python -c "from pathlib import Path; p=Path('sprint2-integracao-recompensas-v1.html'); s=p.read_text(encoding='utf-8'); old='sprint2-tarefas-realdata-v2.js?v=20260903-editable-details-v2'; new='sprint2-tarefas-realdata-v2.js?v=20260904-create-inline-v26'; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1),encoding='utf-8')"
          grep -q 'sprint2-tarefas-realdata-v2.js?v=20260904-create-inline-v26' sprint2-integracao-recompensas-v1.html
      - name: Publicar ajuste
        run: |
          git config user.name 'paes2005-design'
          git config user.email 'paes2005@gmail.com'
          git add sprint2-integracao-recompensas-v1.html
          git commit -m 'Sprint 2: atualiza cache da Tarefas v2.6'
          git push
