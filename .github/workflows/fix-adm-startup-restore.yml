name: Fix ADM startup restore
on:
  push:
    paths:
      - '.github/triggers/fix-adm-startup-restore.txt'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corrigir restauração sem concorrência
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1) Guard de startup: não dispara nova autenticação enquanto a restauração original está em curso.
          p=Path('adm-startup-stability-v1.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("import './runtime-build-info.js?v=20260831.1';", "import './runtime-build-info.js?v=20260831.2';")
          s=s.replace('const VERSION = 11;', 'const VERSION = 12;')
          s=s.replace("serviceWorker.register('./sw.js?v=78'", "serviceWorker.register('./sw.js?v=79'")
          pattern=r"function requestRetry\(auth, generation\) \{.*?\n\}\n\nfunction scheduleRecovery\(auth, generation\) \{.*?\n\}\n"
          replacement="""function scheduleRecovery(auth, generation) {
            setTimeout(() => {
              if (generation !== authGeneration || sessionReady || !auth.currentUser) return;
              const main = document.getElementById('sistemaPrincipal');
              if (visible(main)) {
                hide();
                log('startup.adm_restauracao_pendente_interface_ativa', { ms: flowElapsed() }, 'info');
                return;
              }
              log('startup.adm_restauracao_lenta', { ms: flowElapsed() }, 'warning');
            }, 6500);
            setTimeout(() => {
              if (generation !== authGeneration || sessionReady || !auth.currentUser) return;
              const main = document.getElementById('sistemaPrincipal');
              if (visible(main)) { hide(); return; }
              log('startup.adm_restauracao_muito_lenta', { ms: flowElapsed() }, 'warning');
              show('Restaurando seu painel...');
            }, 14000);
          }
"""
          s2,n=re.subn(pattern,replacement,s,flags=re.S)
          if n!=1: raise SystemExit(f'bloco requestRetry/scheduleRecovery inesperado: {n}')
          s=s2
          s=s.replace("log('startup.adm_tela_protegida', { motivo: reason, autenticado: authenticated, sessaoPronta: sessionReady }, 'warning');", "log('startup.adm_tela_protegida', { motivo: reason, autenticado: authenticated, sessaoPronta: sessionReady }, 'info');")
          p.write_text(s,encoding='utf-8')

          # 2) HTML principal: restaura identidade administrativa do Firestore local antes da validação de servidor.
          p=Path('index-ADMIN-v8.html')
          s=p.read_text(encoding='utf-8')
          old_start='<script type="module" src="./adm-startup-stability-v1.js?v=11"></script>'
          new_start='<script type="module" src="./adm-startup-stability-v1.js?v=12"></script>'
          if old_start not in s: raise SystemExit('entrada startup v11 não encontrada')
          s=s.replace(old_start,new_start,1)
          s=s.replace("navigator.serviceWorker.register('./sw.js?v=78',{updateViaCache:'none'})", "navigator.serviceWorker.register('./sw.js?v=79',{updateViaCache:'none'})",1)

          pattern=r"    // Sessão administrativa validada pelo Firebase Authentication\.\n    onAuthStateChanged\(auth, async \(user\) => \{.*?\n    \}\);\n</script>"
          new_block=r'''    // Sessão administrativa validada pelo Firebase Authentication.
    let restauracaoAdminGeracao = 0;

    function aplicarCadastroAdminRestaurado(adminDoc, user, origem) {
        if(!adminDoc || !user) return false;
        const dados=adminDoc.data();
        const grupoNovo=dados.codigoCliente || dados.grupoId || '';
        const grupoAtual=adminLogadoAtual?.codigoCliente || adminLogadoAtual?.grupoId || '';
        if(adminLogadoAtual?.uid===user.uid && grupoAtual===grupoNovo) return false;

        adminLogadoAtual={id:adminDoc.id,...dados};
        document.getElementById('telaAcesso').style.display='none';
        document.getElementById('sistemaPrincipal').style.display='block';
        document.getElementById('displayCodigoAdmin').innerText=adminLogadoAtual.codigoAdmin || 'ADM-Gen';
        document.getElementById('displayCodigoCliente').innerText=grupoNovo || 'CLI-Gen';

        const syncInicialAdm=iniciarEscutasFirebase();
        window.rotinaAdmInitialSyncPromise=syncInicialAdm;
        window.dispatchEvent(new CustomEvent('rotina-admin-session-ready',{detail:{grupoId:grupoNovo,origem}}));
        syncInicialAdm.catch(e=>console.error('Falha na sincronização inicial do ADM',e));
        setTimeout(()=>verificarEExecutarResetSemanal(grupoNovo),1500);
        window.rotinaLog?.('startup.adm_admin_restaurado',{origem,grupoId:grupoNovo},'info');
        return true;
    }

    async function validarCadastroAdminServidor(user, geracao) {
        const inicio=performance.now();
        window.rotinaLog?.('startup.adm_admin_server_inicio',{uid:String(user.uid||'').slice(0,24)},'info');
        try {
            const snap=await getDocsFromServer(query(collection(db,'administradores'), where('uid','==',user.uid)));
            if(geracao!==restauracaoAdminGeracao || auth.currentUser?.uid!==user.uid) return false;
            if(snap.empty) {
                window.rotinaLog?.('startup.adm_admin_server_sem_cadastro',{ms:Math.round(performance.now()-inicio)},'error');
                adminLogadoAtual=null;
                await signOut(auth);
                alert('Sessão autenticada sem cadastro administrativo correspondente.');
                return false;
            }
            aplicarCadastroAdminRestaurado(snap.docs[0],user,'servidor-validado');
            window.rotinaLog?.('startup.adm_admin_server_ok',{ms:Math.round(performance.now()-inicio)},'info');
            return true;
        } catch(e) {
            if(geracao!==restauracaoAdminGeracao) return false;
            window.rotinaLog?.('startup.adm_admin_server_erro',{ms:Math.round(performance.now()-inicio),mensagem:String(e?.message||e).slice(0,140)},'warning');
            if(!adminLogadoAtual) console.error('Falha ao restaurar cadastro administrativo no servidor',e);
            return false;
        }
    }

    onAuthStateChanged(auth, async (user) => {
        const geracao=++restauracaoAdminGeracao;
        if(!user) {
            if(!adminLogadoAtual) {
                document.getElementById('sistemaPrincipal').style.display='none';
                document.getElementById('telaAcesso').style.display='block';
            }
            return;
        }
        if(adminLogadoAtual?.uid === user.uid) return;

        const inicioCache=performance.now();
        const qAdmin=query(collection(db,'administradores'), where('uid','==',user.uid));
        try {
            const snapCache=await getDocsFromCache(qAdmin);
            if(geracao!==restauracaoAdminGeracao || auth.currentUser?.uid!==user.uid) return;
            if(!snapCache.empty) {
                aplicarCadastroAdminRestaurado(snapCache.docs[0],user,'cache-firestore');
                window.rotinaLog?.('startup.adm_admin_cache_hit',{ms:Math.round(performance.now()-inicioCache)},'info');
                void validarCadastroAdminServidor(user,geracao);
                return;
            }
            window.rotinaLog?.('startup.adm_admin_cache_miss',{ms:Math.round(performance.now()-inicioCache)},'info');
        } catch(e) {
            window.rotinaLog?.('startup.adm_admin_cache_erro',{ms:Math.round(performance.now()-inicioCache),mensagem:String(e?.message||e).slice(0,120)},'warning');
        }
        await validarCadastroAdminServidor(user,geracao);
    });
</script>'''
          s2,n=re.subn(pattern,new_block,s,flags=re.S)
          if n!=1: raise SystemExit(f'bloco de restauração administrativa inesperado: {n}')
          p.write_text(s2,encoding='utf-8')

          # 3) Build/versionamento coerente.
          p=Path('runtime-build-info.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("build:'20260831.1'", "build:'20260831.2'").replace("expectedServiceWorkerVersion:'78'", "expectedServiceWorkerVersion:'79'")
          p.write_text(s,encoding='utf-8')

          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('entry=20260831.1','entry=20260831.2')
          p.write_text(s,encoding='utf-8')

          p=Path('sw.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("const CACHE_NAME='rotina-family-adm-v78-justification-rollback';", "const CACHE_NAME='rotina-family-adm-v79-startup-stable';")
          s=s.replace("const ROTINA_SW_VERSION='78';", "const ROTINA_SW_VERSION='79';")
          s=s.replace("const ROTINA_BUILD_ID='20260831.1';", "const ROTINA_BUILD_ID='20260831.2';")
          s=s.replace("runtime-build-info.js?v=20260831.1", "runtime-build-info.js?v=20260831.2")
          p.write_text(s,encoding='utf-8')

      - name: Validar antes de publicar
        shell: bash
        run: |
          set -euo pipefail
          node --check adm-startup-stability-v1.js
          node --check runtime-build-info.js
          node --check sw.js
          test "$(git hash-object adm-justification-review.js)" = '71cf858596170c73bf898d1ba117a7ee5830a09f'
          ! grep -q 'rotina-adm-auth-retry-requested' adm-startup-stability-v1.js
          grep -q 'startup.adm_restauracao_lenta' adm-startup-stability-v1.js
          grep -q 'getDocsFromCache(qAdmin)' index-ADMIN-v8.html
          grep -q 'validarCadastroAdminServidor' index-ADMIN-v8.html
          grep -q 'startup.adm_admin_cache_hit' index-ADMIN-v8.html
          grep -q 'adm-startup-stability-v1.js?v=12' index-ADMIN-v8.html
          grep -q "sw.js?v=79" index-ADMIN-v8.html
          grep -q "build:'20260831.2'" runtime-build-info.js
          grep -q "expectedServiceWorkerVersion:'79'" runtime-build-info.js
          grep -q 'entry=20260831.2' index.html
          grep -q "ROTINA_SW_VERSION='79'" sw.js
          grep -q "ROTINA_BUILD_ID='20260831.2'" sw.js
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index-ADMIN-v8.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script type="module">(.*?)</script>',s,re.S)
          alvo=[b for b in blocks if 'initializeFirestore' in b and 'onAuthStateChanged' in b]
          assert len(alvo)==1, len(alvo)
          Path('/tmp/adm-main-module.mjs').write_text(alvo[0],encoding='utf-8')
          PY
          node --check /tmp/adm-main-module.mjs
          echo 'STARTUP_FIX_VALIDATION=PASS'
          echo 'JUSTIFICATION_HASH_FROZEN=PASS'
      - name: Publicar correção
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rotina-family-startup-fix-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add adm-startup-stability-v1.js index-ADMIN-v8.html runtime-build-info.js index.html sw.js
          git commit -m 'Estabilizar restauração inicial do ADM sem retry concorrente'
          git push
