name: Sprint2 Fix Hidden Semantic

on:
  push:
    paths:
      - '.github/workflows/sprint2-fix-hidden-semantic.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir semantica hidden e cache do CSS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('sprint2-teste-atual.css')
          s = css.read_text(encoding='utf-8')
          rule = '[hidden]{display:none!important}'
          if rule not in s:
              marker = '*{box-sizing:border-box}'
              if marker not in s:
                  raise SystemExit('Marcador CSS base nao encontrado')
              s = s.replace(marker, marker + rule, 1)
              css.write_text(s, encoding='utf-8')

          html = Path('sprint2-integracao-recompensas-v1.html')
          h = html.read_text(encoding='utf-8')
          old = 'href="sprint2-teste-atual.css"'
          new = 'href="sprint2-teste-atual.css?v=20260905-hidden-semantic-v1"'
          if old in h:
              h = h.replace(old, new, 1)
              html.write_text(h, encoding='utf-8')
          elif new not in h:
              raise SystemExit('Link do CSS nao encontrado')
          PY
      - name: Validar regra
        shell: bash
        run: |
          grep -Fq '[hidden]{display:none!important}' sprint2-teste-atual.css
          grep -Fq 'sprint2-teste-atual.css?v=20260905-hidden-semantic-v1' sprint2-integracao-recompensas-v1.html
      - name: Publicar correcao
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sprint2-teste-atual.css sprint2-integracao-recompensas-v1.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Sprint 2: respeita hidden na navegacao Master'
          git push

