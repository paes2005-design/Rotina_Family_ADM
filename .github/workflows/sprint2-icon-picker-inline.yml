name: Sprint 2 icon picker inline

on:
  push:
    paths:
      - '.github/workflows/sprint2-icon-picker-inline.yml'
      - 'scripts/sprint2_icon_picker_inline.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar seletor integrado
        run: python scripts/sprint2_icon_picker_inline.py

      - name: Validar sintaxe
        run: node --check sprint2-tarefas-realdata-v2.js

      - name: Auditar componente
        shell: bash
        run: |
          set -euo pipefail
          grep -q "tarefas-realdata-v2.4-icon-picker" sprint2-tarefas-realdata-v2.js
          grep -q "function iconPicker" sprint2-tarefas-realdata-v2.js
          grep -q "tv2-icon-picker" sprint2-tarefas-realdata-v2.js
          grep -q "tv2-icon-face" sprint2-tarefas-realdata-v2.js
          grep -q "tv2-icon-picker select" sprint2-tarefas-realdata-v2.js
          grep -q "sel.onchange" sprint2-tarefas-realdata-v2.js
          if git diff --name-only | grep -Ev '^sprint2-tarefas-realdata-v2.js$' >/dev/null; then
            echo 'ERRO: alteração funcional saiu do arquivo único de Tarefas V2'
            git diff --name-only
            exit 1
          fi
          git diff --check

      - name: Publicar
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sprint2-tarefas-realdata-v2.js
          git commit -m 'Sprint 2: integra seletor ao próprio ícone'
          git push
