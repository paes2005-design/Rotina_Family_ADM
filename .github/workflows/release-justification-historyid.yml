name: Release justification historyId resolver
on:
  push:
    paths:
      - '.github/triggers/release-justification-historyid.txt'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Alinhar entrada principal
        shell: python
        run: |
          from pathlib import Path
          p=Path('index-ADMIN-v8.html')
          s=p.read_text()
          old_sw="navigator.serviceWorker.register('./sw.js?v=77',{updateViaCache:'none'})"
          new_sw="navigator.serviceWorker.register('./sw.js?v=78',{updateViaCache:'none'})"
          old_start='<script type="module" src="./adm-startup-stability-v1.js?v=6"></script>'
          new_start='<script type="module" src="./adm-startup-stability-v1.js?v=10"></script>'
          if old_sw not in s: raise SystemExit('registro SW77 não encontrado')
          if old_start not in s: raise SystemExit('startup v6 não encontrado')
          s=s.replace(old_sw,new_sw,1).replace(old_start,new_start,1)
          p.write_text(s)
          print('HTML_ENTRY=PASS startup=v10 sw=78')
      - name: Validar módulos
        run: |
          node --check adm-justification-review.js
          node --check adm-justification-live-resolver.js
          node --check adm-startup-stability-v1.js
          node --check sw.js
      - name: Publicar
        shell: bash
        run: |
          git config user.name 'rotina-family-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index-ADMIN-v8.html
          git commit -m 'Ativar resolvedor de justificativa por historyId no ADM'
          git push
