name: Promote Sprint 2 ADM Official V1

on:
  push:
    paths:
      - '.github/triggers/promote-sprint2-adm-official-v1.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preparar painel oficial
        run: python3 scripts/promote-adm-official-v1.py

      - name: Auditar promoção antes do commit
        shell: bash
        run: |
          set -euo pipefail
          test -f index-ADMIN-v9.html
          grep -q "index-ADMIN-v9.html" index.html
          grep -q "index-ADMIN-v9.html" sw.js
          grep -q "LEGACY_MAIN_PATH" sw.js
          grep -q "release=20260905.1" manifest.json
          ! grep -q "index-ADMIN-v8.html" index.html
          ! grep -q "adm-justification-review.js" sw.js
          grep -q "sprint2-master-realdata-v1.js" sprint2-integracao-login-realdata-bridge-v1.js
          test -z "$(git diff -- index-ADMIN-v8.html)"

          for term in "Sprint 2" "dados reais" "conexão real" "versão anterior preservada" "Integração 5" "DADOS REAIS" "tela aprovada" "fase isolada" "produção antiga preservada" "Este incremento" "nesta rodada"; do
            if grep -Fqi "$term" index-ADMIN-v9.html; then
              echo "Rótulo técnico visível no oficial: $term"
              exit 1
            fi
          done
          ! grep -Fq "Participantes • dados reais" sprint2-participantes-realdata-v1.js
          ! grep -Fq "Integração real:" sprint2-recompensas-realdata-v1.js
          ! grep -Fq "tela aprovada" sprint2-conquistas-realdata-v1.js
          ! grep -Fq "fase isolada" sprint2-conquistas-realdata-v1.js
          ! grep -Fq "MASTER V2 · REALDATA" sprint2-master-realdata-v1.js
          ! grep -Fq "Arquitetura Sprint 2" sprint2-master-realdata-v1.js
          ! grep -Fq "produção antiga preservada" sprint2-master-realdata-v1.js

          test "$(grep -F "onSnapshot(" sprint2-data-store-v1.js | wc -l | tr -d ' ')" = "1"
          for f in sprint2-tarefas-realdata-v2.js sprint2-participantes-realdata-v1.js sprint2-recompensas-realdata-v1.js sprint2-conquistas-realdata-v1.js sprint2-monitor-realdata-v2.js sprint2-master-realdata-v1.js; do
            if grep -Fq "onSnapshot(" "$f"; then
              echo "Listener paralelo encontrado em $f"
              exit 1
            fi
            node --check "$f"
          done
          node --check sprint2-data-store-v1.js
          node --check sprint2-integracao-login-realdata-v1.js
          node --check sprint2-integracao-login-realdata-bridge-v1.js
          node --check sprint2-observability-v1.js
          node --check sw.js
          git diff --check

      - name: Commit promoção oficial
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "paes2005-design"
          git config user.email "paes2005@gmail.com"
          git add index-ADMIN-v9.html index.html manifest.json sw.js sprint2-integracao-login-realdata-v1.js sprint2-tarefas-realdata-v2.js sprint2-participantes-realdata-v1.js sprint2-recompensas-realdata-v1.js sprint2-conquistas-realdata-v1.js sprint2-master-realdata-v1.js
          git commit -m "ADM: promove novo painel para produção oficial"
          git push
