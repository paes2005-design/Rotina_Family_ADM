name: Sprint 2 Monitor V3 nav and live sync

on:
  push:
    paths:
      - '.github/workflows/sprint2-monitor-v3-nav-live-sync.yml'
      - 'scripts/sprint2_monitor_v3_nav_live_sync_patch.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Corrigir navegação e atualização automática
        run: python scripts/sprint2_monitor_v3_nav_live_sync_patch.py

      - name: Validar sintaxe JavaScript
        run: |
          node --check sprint2-monitor-realdata-v2.js
          node --check sprint2-data-store-v1.js

      - name: Confirmar isolamento da Sprint 2
        shell: bash
        run: |
          git diff --name-only | sort | tee /tmp/changed.txt
          printf '%s\n' sprint2-data-store-v1.js sprint2-monitor-realdata-v2.js | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Publicar correções auditadas
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sprint2-data-store-v1.js sprint2-monitor-realdata-v2.js
          git commit -m 'Sprint 2: corrige menu e ativa sync automático do Monitor'
          git push
