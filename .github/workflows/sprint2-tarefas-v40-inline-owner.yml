name: Sprint 2 Tarefas V40 Inline Owner

on:
  push:
    paths:
      - '.github/triggers/sprint2-tarefas-v40-inline-owner.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reescrever módulo proprietário de Tarefas
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip
          from pathlib import Path
          payload=''''''
          Path('sprint2-tarefas-realdata-v2.js').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY

      - name: Atualizar integração e auditoria para o proprietário V4
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          h=Path('sprint2-integracao-recompensas-v1.html')
          s=h.read_text(encoding='utf-8')
          old='sprint2-tarefas-realdata-v2.js?v=20260905-series-status-v31'
          new='sprint2-tarefas-realdata-v2.js?v=20260905-inline-owner-v40'
          if s.count(old)!=1: raise SystemExit(f'cache-bust esperado 1x, encontrado {s.count(old)}')
          h.write_text(s.replace(old,new,1),encoding='utf-8')

          a=Path('.github/workflows/sprint2-current-integration-audit.yml')
          s=a.read_text(encoding='utf-8')
          replacements={
            'tarefas-realdata-v3.1-series-status':'tarefas-realdata-v4.0-inline-owner',
            "require('tv3Scope' in tasks and 'Toda a tarefa recorrente' in tasks and 'Somente um dia' in tasks,'edição oferece escopo série completa ou um dia')":"require('data-action=\"scope\"' in tasks and 'Toda a tarefa recorrente' in tasks and 'Somente um dia' in tasks,'edição oferece escopo série completa ou um dia')",
            "require('tv3Active' in tasks and '>Ativa</option>' in tasks and '>Inativa</option>' in tasks,'editor integrado restaura status Ativa/Inativa')":"require('data-field=\"active\"' in tasks and '>Ativa</option>' in tasks and '>Inativa</option>' in tasks,'editor integrado preserva status Ativa/Inativa')"
          }
          for old,new in replacements.items():
            if old not in s: raise SystemExit('assertiva antiga não encontrada: '+old[:80])
            s=s.replace(old,new,1)
          marker="require(\"mode:v.active?v.alarm:'off'\" in tasks,'tarefa inativa desliga seus alarmes')"
          extra="""
          require('tv4-edit-main' in tasks and 'data-action=\"edit\"' in tasks,'edição web acontece na própria linha da tarefa')
          require('tv4-mobile-edit' in tasks,'edição mobile acontece no próprio card')
          require('id=\"tv3Editor\"' not in tasks and 'editorHtml()' not in tasks,'Tarefas não mantém editor global paralelo acima da lista')
          require("if(!await firebaseReady())" in tasks,'toda gravação garante Firebase inicializado antes de editar')
          require("origin==='live-execucoes'" in tasks and 'data_refresh_deferred' in tasks,'atualizações de execuções não desmontam editor de Tarefas aberto')
          require("v.addEventListener('click'" in tasks and "v.addEventListener('change'" in tasks,'Tarefas usa delegação única de eventos em vez de religar botões a cada render')
          require("const v={...editor.draft" in tasks,'rascunho de edição fica no estado do módulo e não depende do DOM')
          """.strip()
          if marker not in s: raise SystemExit('marcador de auditoria não encontrado')
          s=s.replace(marker,marker+'\n          '+extra.replace('\n','\n          '),1)
          a.write_text(s,encoding='utf-8')
          PY

      - name: Validar módulo limpo
        run: |
          set -euo pipefail
          node --check sprint2-tarefas-realdata-v2.js
          grep -q "tarefas-realdata-v4.0-inline-owner" sprint2-tarefas-realdata-v2.js
          grep -q 'tv4-edit-main' sprint2-tarefas-realdata-v2.js
          grep -q "if(!await firebaseReady())" sprint2-tarefas-realdata-v2.js
          grep -q "origin==='live-execucoes'" sprint2-tarefas-realdata-v2.js
          grep -q '20260905-inline-owner-v40' sprint2-integracao-recompensas-v1.html
          ! grep -q 'id="tv3Editor"' sprint2-tarefas-realdata-v2.js

      - name: Commit
        run: |
          git config user.name "paes2005-design"
          git config user.email "paes2005@gmail.com"
          git add sprint2-tarefas-realdata-v2.js sprint2-integracao-recompensas-v1.html .github/workflows/sprint2-current-integration-audit.yml
          git commit -m "Sprint 2: refatora Tarefas sem editor paralelo"
          git push
