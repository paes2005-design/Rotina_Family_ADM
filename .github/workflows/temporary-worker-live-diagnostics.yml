name: Diagnostico temporario Worker Rotina Family
on:
  push:
    paths:
      - '.github/triggers/worker-live-diagnostic.txt'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consultar saude atual do Worker
        shell: bash
        run: |
          set -u
          ROOT='https://rotina-family-onesignal-scheduler.rotina-family-onesignal-scheduler.workers.dev'
          mkdir -p diagnostics /tmp/rfdiag
          health_code=$(curl -sS --max-time 20 -o /tmp/rfdiag/health.json -w '%{http_code}' "$ROOT/monitoramento" || true)
          tech_code=$(curl -sS --max-time 20 -o /tmp/rfdiag/tecnico.json -w '%{http_code}' "$ROOT/diagnostico-tecnico" || true)
          HEALTH_CODE="$health_code" TECH_CODE="$tech_code" python - <<'PY'
          import json, pathlib, datetime, os
          def load(path):
              p=pathlib.Path(path)
              try: return json.loads(p.read_text(errors='replace'))
              except Exception: return {}
          health=load('/tmp/rfdiag/health.json')
          body=load('/tmp/rfdiag/tecnico.json')
          out={
            'capturadoEm':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'monitoramentoHttp':os.environ.get('HEALTH_CODE',''),
            'diagnosticoHttp':os.environ.get('TECH_CODE',''),
            'monitoramento':health,
            'diagnostico':{
              'status':body.get('status'),
              'healthReasons':body.get('healthReasons'),
              'lastRunAt':body.get('lastRunAt'),
              'lastRun':body.get('lastRun'),
              'summary':body.get('summary'),
              'recentCycles':body.get('recentCycles')
            }
          }
          pathlib.Path('diagnostics/worker-health-now.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Gravar diagnostico no repositorio
        shell: bash
        run: |
          git config user.name 'rotina-family-diagnostic-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add diagnostics/worker-health-now.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Registrar snapshot atual de saude do Worker [skip ci]'
          git push
