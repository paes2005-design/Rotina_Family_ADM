name: Diagnostico temporario Worker Rotina Family
on:
  push:
    paths:
      - '.github/triggers/worker-live-diagnostic.txt'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consultar Worker e registrar resultado
        shell: bash
        run: |
          set -u
          ROOT='https://rotina-family-onesignal-scheduler.rotina-family-onesignal-scheduler.workers.dev'
          mkdir -p diagnostics /tmp/rfdiag
          for endpoint in monitoramento diagnostico-tecnico diagnostico-worker; do
            code=$(curl -sS --max-time 15 -o "/tmp/rfdiag/${endpoint}.json" -w '%{http_code}' "$ROOT/$endpoint" || true)
            printf '%s' "$code" > "/tmp/rfdiag/${endpoint}.status"
          done
          logs_code=$(curl -sS --max-time 15 -o /tmp/rfdiag/logs.json -w '%{http_code}' "$ROOT/logs?grupoId=SISTEMA" || true)
          printf '%s' "$logs_code" > /tmp/rfdiag/logs.status
          python - <<'PY'
          import json, pathlib, datetime
          p=pathlib.Path('/tmp/rfdiag')
          def load(name):
              status=(p/f'{name}.status').read_text(errors='replace').strip()
              raw=(p/f'{name}.json').read_text(errors='replace') if (p/f'{name}.json').exists() else ''
              try: body=json.loads(raw)
              except Exception: body=raw[:5000]
              return {'http':status,'body':body}
          out={
            'capturadoEm':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'monitoramento':load('monitoramento'),
            'diagnosticoTecnico':load('diagnostico-tecnico'),
            'diagnosticoWorker':load('diagnostico-worker'),
            'logsPrivadosSemToken':load('logs')
          }
          pathlib.Path('diagnostics/worker-live-latest.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Gravar diagnóstico no repositório
        shell: bash
        run: |
          git config user.name 'rotina-family-diagnostic-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add diagnostics/worker-live-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Registrar diagnostico ao vivo do Worker [skip ci]'
          git push
