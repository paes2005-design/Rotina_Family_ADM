name: Diagnostico temporario Worker Rotina Family
on:
  push:
    paths:
      - '.github/triggers/worker-live-diagnostic.txt'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consultar Worker e filtrar logs da justificativa
        shell: bash
        run: |
          set -u
          ROOT='https://rotina-family-onesignal-scheduler.rotina-family-onesignal-scheduler.workers.dev'
          mkdir -p diagnostics /tmp/rfdiag
          code=$(curl -sS --max-time 20 -o /tmp/rfdiag/tecnico.json -w '%{http_code}' "$ROOT/diagnostico-tecnico" || true)
          CODE="$code" python - <<'PY'
          import json, pathlib, datetime, os
          p=pathlib.Path('/tmp/rfdiag/tecnico.json')
          try: body=json.loads(p.read_text(errors='replace'))
          except Exception as e: body={}
          logs=body.get('logs') or []
          wanted=[]
          for x in logs:
              ev=str(x.get('evento') or '')
              if ev.startswith('justificativa.') or ev.startswith('sync.adm_') or ev.startswith('build.') or ev.startswith('startup.adm_'):
                  wanted.append(x)
          out={
            'capturadoEm':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'http':os.environ.get('CODE',''),
            'workerStatus':body.get('status'),
            'lastLogAt':body.get('lastLogAt'),
            'summary':body.get('summary'),
            'totalFiltrado':len(wanted),
            'logs':wanted
          }
          pathlib.Path('diagnostics/justification-live-logs.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Gravar diagnóstico no repositório
        shell: bash
        run: |
          git config user.name 'rotina-family-diagnostic-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add diagnostics/justification-live-logs.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Registrar logs filtrados da justificativa [skip ci]'
          git push
