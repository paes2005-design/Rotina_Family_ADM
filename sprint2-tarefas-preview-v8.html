<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rotina Family — Sprint 2 • Tarefas v8</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f7fb}#app{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<iframe id="app" src="sprint2-tarefas-preview-v6.html?v=8"></iframe>
<script>
const frame=document.getElementById('app');
const TELEMETRY_ENDPOINT='https://rotina-family-onesignal-scheduler.rotina-family-onesignal-scheduler.workers.dev/app-log';
const SESSION_ID=sessionStorage.getItem('rotinaFamily.sprint2.v8.session')||(crypto.randomUUID?crypto.randomUUID():String(Date.now()));
sessionStorage.setItem('rotinaFamily.sprint2.v8.session',SESSION_ID);
function clean(v){return String(v??'').replace(/\s+/g,' ').slice(0,160)}
function sprintLog(event,details={},level='info'){
  const safe={};Object.entries(details||{}).forEach(([k,v])=>{if(!/senha|password|email|token|secret|pin/i.test(k)&&typeof v!=='object')safe[k.slice(0,40)]=typeof v==='number'||typeof v==='boolean'?v:clean(v)});
  const item={aplicativo:'adm',versaoMonitor:8,evento:'sprint2.tarefas.'+clean(event).replace(/[^a-zA-Z0-9_.:-]/g,'_'),nivel:['info','warning','error'].includes(level)?level:'info',detalhes:safe,grupoId:clean(localStorage.getItem('rotina_admin_push_grupo')||'SPRINT2-PREVIEW'),perfilId:'',sessaoId:SESSION_ID,clienteEm:new Date().toISOString(),pagina:'sprint2-tarefas-preview-v8.html',navegador:'browser',online:navigator.onLine,visibilidade:document.visibilityState,instalado:false};
  try{const key='rotinaFamily.sprint2.v8.logs';const q=JSON.parse(localStorage.getItem(key)||'[]');q.push(item);localStorage.setItem(key,JSON.stringify(q.slice(-120)))}catch(_){ }
  console[level==='error'?'error':level==='warning'?'warn':'info']('[Sprint2 v8]',event,safe);
  if(navigator.onLine)fetch(TELEMETRY_ENDPOINT,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({events:[item]})}).catch(()=>{});
}
window.addEventListener('message',ev=>{if(ev.origin!==location.origin||ev.source!==frame.contentWindow)return;const m=ev.data||{};if(m.type==='sprint2-v8-log')sprintLog(m.event,m.details,m.level)});

frame.addEventListener('load',()=>{
  const w=frame.contentWindow,d=frame.contentDocument;
  d.title='Rotina Family — Sprint 2 • Tarefas v8';
  const style=d.createElement('style');
  style.textContent=`
    .monitor-bar-v8{padding:14px 25px;background:#fbf9ff;border-bottom:1px solid #e7dffa;display:flex;gap:12px;align-items:flex-end}
    .monitor-bar-v8 label{display:block;font-size:10px;text-transform:uppercase;font-weight:850;color:#655c84;margin-bottom:5px}
    .monitor-bar-v8 select{min-width:260px;border:1px solid #d9d2ef;border-radius:10px;background:#fff;padding:10px 11px}
    .monitor-info-v8{font-size:12px;color:#686f85;line-height:1.45}
    @media(max-width:900px){
      .monitor-bar-v8{padding:12px 13px;display:grid;grid-template-columns:1fr}.monitor-bar-v8 select{min-width:0;width:100%}
      .monitorgrid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:9px!important;padding:13px!important}
      .metric-strip{display:contents!important}.metric{min-width:0!important;min-height:108px!important;padding:13px 8px!important;text-align:center!important;align-items:center!important}
      .metric small{font-size:10px!important;line-height:1.2!important}.metric strong{font-size:30px!important}.timeline{grid-column:1/-1!important;margin-top:2px!important;overflow:auto!important}
    }`;
  d.head.appendChild(style);

  const monitor=d.querySelector('#monitorView'),head=monitor?.querySelector('.head');
  if(monitor&&head&&!d.querySelector('#monitorParticipantV8')){
    const bar=d.createElement('div');bar.className='monitor-bar-v8';
    bar.innerHTML='<div><label>Participante no monitor</label><select id="monitorParticipantV8"></select></div><div class="monitor-info-v8" id="monitorInfoV8"></div>';
    head.insertAdjacentElement('afterend',bar);
  }

  w.eval(`
    function __v8Post(event,details,level){window.parent.postMessage({type:'sprint2-v8-log',event:event,details:details||{},level:level||'info'},location.origin)}
    function __v8Targets(t,oldSig){
      if(selectedParticipant()!=='__ALL__')return [t];
      if(t.collectiveKey)return tasks.filter(x=>x.collectiveKey===t.collectiveKey);
      return tasks.filter(x=>signature(x)===oldSig);
    }
    function __v8Apply(t,patch,oldSig){const target=__v8Targets(t,oldSig);target.forEach(x=>Object.assign(x,patch));return target.length}
    function __v8Order(){tasks.sort((a,b)=>a.person.localeCompare(b.person)||a.start.localeCompare(b.start)||a.end.localeCompare(b.end)||a.name.localeCompare(b.name))}
    function addTask(){
      const p=selectedParticipant();
      if(p==='__ALL__'){
        const key='collective-'+Date.now()+'-'+next;let firstId=null;
        participants.forEach(person=>{const id=next++;if(firstId===null)firstId=id;tasks.push({id:id,name:'Nova tarefa',person:person,start:'12:00',end:'12:15',points:5,tol:0,days:['Seg','Ter','Qua','Qui','Sex'],status:'active',alarm:'11:55',icon:'✅',note:'',collectiveKey:key})});
        edit=firstId;open=firstId;__v8Order();render();__v8Post('task.add_collective',{targets:participants.length,taskId:firstId});
      }else{
        const t={id:next++,name:'Nova tarefa',person:p,start:'12:00',end:'12:15',points:5,tol:0,days:['Seg','Ter','Qua','Qui','Sex'],status:'active',alarm:'11:55',icon:'✅',note:''};tasks.push(t);edit=t.id;open=t.id;__v8Order();render();__v8Post('task.add_individual',{participant:p,taskId:t.id});
      }
    }
    function save(id){
      const tr=document.querySelector('tr[data-id="'+id+'"]'),t=tasks.find(x=>x.id===id);if(!tr||!t)return;
      const oldSig=signature(t),patch={};tr.querySelectorAll('[data-k]').forEach(el=>{let v=el.value;if(['points','tol'].includes(el.dataset.k))v=Number(v);patch[el.dataset.k]=v});
      const count=__v8Apply(t,patch,oldSig);__v8Order();edit=null;open=null;render();
      const check=tasks.filter(x=>t.collectiveKey&&x.collectiveKey===t.collectiveKey);const consistent=!t.collectiveKey||check.every(x=>x.start===t.start&&x.end===t.end&&x.name===t.name);
      __v8Post('task.save_web',{taskId:id,start:t.start,end:t.end,targets:count,collective:selectedParticipant()==='__ALL__',consistent:consistent},consistent?'info':'error');
    }
    function saveMobile(id){
      const t=tasks.find(x=>x.id===id);if(!t)return;const oldSig=signature(t);
      const patch={icon:document.querySelector('#m-icon-'+id).value,name:document.querySelector('#m-name-'+id).value,start:document.querySelector('#m-start-'+id).value,end:document.querySelector('#m-end-'+id).value,points:Number(document.querySelector('#m-points-'+id).value),tol:Number(document.querySelector('#m-tol-'+id).value),status:document.querySelector('#m-status-'+id).value,alarm:document.querySelector('#m-alarm-'+id).value,note:document.querySelector('#m-note-'+id).value};
      const count=__v8Apply(t,patch,oldSig);__v8Order();edit=null;open=null;render();
      const check=tasks.filter(x=>t.collectiveKey&&x.collectiveKey===t.collectiveKey);const consistent=!t.collectiveKey||check.every(x=>x.start===t.start&&x.end===t.end&&x.name===t.name);
      __v8Post('task.save_mobile',{taskId:id,start:t.start,end:t.end,targets:count,collective:selectedParticipant()==='__ALL__',consistent:consistent},consistent?'info':'error');
    }
    function toggleDay(id,day){const t=tasks.find(x=>x.id===id);if(!t)return;const oldSig=signature(t),days=t.days.includes(day)?t.days.filter(x=>x!==day):[...t.days,day];const count=__v8Apply(t,{days:days},oldSig);render();__v8Post('task.days_changed',{taskId:id,targets:count})}
    function setExtra(id,key,value){const t=tasks.find(x=>x.id===id);if(!t)return;const count=__v8Apply(t,{[key]:value},signature(t));__v8Post('task.detail_changed',{taskId:id,field:key,targets:count})}
    function removeTask(id){const t=tasks.find(x=>x.id===id);if(!t)return;const oldSig=signature(t),ids=new Set(__v8Targets(t,oldSig).map(x=>x.id));tasks=tasks.filter(x=>!ids.has(x.id));if(edit===id)edit=null;if(open===id)open=null;render();__v8Post('task.remove',{taskId:id,targets:ids.size,collective:selectedParticipant()==='__ALL__'})}
    function __v8SelfTest(){
      const snapshot=tasks.map(x=>({...x,days:[...x.days]})),nextSnapshot=next,participantValue=document.querySelector('#participant').value;
      try{
        document.querySelector('#participant').value='__ALL__';const key='__v8_test__',ids=[];
        participants.forEach(person=>{const id=900000+ids.length;ids.push(id);tasks.push({id:id,name:'Teste v8',person:person,start:'12:00',end:'12:15',points:5,tol:0,days:['Seg'],status:'active',alarm:'',icon:'✅',note:'',collectiveKey:key})});
        const first=tasks.find(x=>x.id===ids[0]),count=__v8Apply(first,{start:'08:00',end:'08:15'},signature(first));__v8Order();
        const copies=tasks.filter(x=>x.collectiveKey===key),propagated=copies.length===participants.length&&copies.every(x=>x.start==='08:00'&&x.end==='08:15');
        const collectiveVisible=commonAll().some(x=>x.collectiveKey===key&&x.start==='08:00');
        const monitorEligible=copies.filter(x=>x.status==='active').length===participants.length;
        return {ok:count===participants.length&&propagated&&collectiveVisible&&monitorEligible,count:count,propagated:propagated,collectiveVisible:collectiveVisible,monitorEligible:monitorEligible};
      }finally{tasks=snapshot;next=nextSnapshot;document.querySelector('#participant').value=participantValue;render()}
    }
  `);

  function frameTasks(){try{return JSON.parse(w.eval('JSON.stringify(tasks)'))}catch(_){return[]}}
  function frameParticipants(){try{return JSON.parse(w.eval('JSON.stringify(participants)'))}catch(_){return[]}}
  function secondsEnd(h){if(!h)return '—';const p=h.split(':').map(Number),s=Math.max(0,p[0]*3600+p[1]*60-1),hh=String(Math.floor(s/3600)%24).padStart(2,'0'),mm=String(Math.floor(s%3600/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');return hh+':'+mm+':'+ss}
  function statusFor(t){
    const key=t.person+'|'+t.name,map={
      'Lara Vitoria|Estudar':['Concluída','ok','▶ 08:00:44<br>■ 09:28:51',t.points+' / '+t.points],
      'Lara Vitoria|Arrumar casa':['Atrasada','late','▶ 09:30:44<br>■ 10:31:25','0 / '+t.points],
      'Maria Eduarda|Arrumar a cama':['Concluída','ok','▶ 07:16:12<br>■ 07:25:40',t.points+' / '+t.points],
      'Maria Eduarda|Estudar':['Em andamento','running','▶ 08:05:10<br>■ —','0 / '+t.points],
      'Pedro|Estudar':['Concluída','ok','▶ 08:00:33<br>■ 09:20:02',t.points+' / '+t.points]
    };return map[key]||['Pendente','pending','▶ —<br>■ —','0 / '+t.points];
  }
  function populateMonitorFilter(){
    const sel=d.querySelector('#monitorParticipantV8');if(!sel)return;const old=sel.value||'__ALL__',people=frameParticipants();
    sel.innerHTML='<option value="__ALL__">Todos os participantes</option>'+people.map(p=>'<option value="'+p.replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'">'+p+'</option>').join('');
    sel.value=people.includes(old)||old==='__ALL__'?old:'__ALL__';
  }
  function syncMonitor(){
    populateMonitorFilter();const sel=d.querySelector('#monitorParticipantV8');if(!sel)return;const chosen=sel.value,tasks=frameTasks();
    const rows=tasks.filter(t=>t.status==='active'&&(chosen==='__ALL__'||t.person===chosen)).sort((a,b)=>a.start.localeCompare(b.start)||a.person.localeCompare(b.person)||a.name.localeCompare(b.name));
    const timeline=d.querySelector('.timeline');if(!timeline)return;timeline.querySelectorAll('.mrow:not(.header)').forEach(r=>r.remove());
    rows.forEach(t=>{const st=statusFor(t),row=d.createElement('div');row.className='mrow';row.dataset.participant=t.person;row.dataset.taskId=t.id;row.innerHTML='<span class="taskicon">'+t.icon+'</span><span><b>'+String(t.name).replace(/</g,'&lt;')+'</b><br><small>'+t.person+'</small></span><span class="rtime">'+(t.start||'—')+':00 – '+secondsEnd(t.end)+'</span><span class="rtime">'+st[2]+'</span><span class="status '+st[1]+'">'+st[0]+'</span><span>'+st[3]+'</span>';timeline.appendChild(row)});
    const metrics=[...d.querySelectorAll('.metric strong')],states=rows.map(statusFor);
    if(metrics[0])metrics[0].textContent=rows.length;if(metrics[1])metrics[1].textContent=states.filter(s=>s[1]==='ok').length;if(metrics[2])metrics[2].textContent=states.filter(s=>s[1]==='running').length;if(metrics[3])metrics[3].textContent=states.filter(s=>s[1]==='pending'||s[1]==='late').length;
    const info=d.querySelector('#monitorInfoV8');if(info)info.innerHTML=chosen==='__ALL__'?'Exibindo <b>todos os participantes</b>. Novas tarefas entram automaticamente no monitor.':'Exibindo o acompanhamento de <b>'+chosen+'</b>.';
    sprintLog('monitor.render',{participant:chosen,rows:rows.length});
  }
  d.querySelector('#monitorParticipantV8')?.addEventListener('change',syncMonitor);
  d.querySelector('#navMonitor')?.addEventListener('click',()=>setTimeout(syncMonitor,0));
  d.querySelector('#navTasks')?.addEventListener('click',()=>setTimeout(()=>sprintLog('tasks.open'),0));
  d.querySelector('#add')?.addEventListener('click',()=>setTimeout(syncMonitor,0));
  d.addEventListener('click',e=>{if(e.target.closest('button[onclick^="save"],button[onclick^="saveMobile"]'))setTimeout(syncMonitor,0)},true);
  d.querySelector('#participant')?.addEventListener('change',()=>sprintLog('tasks.participant_filter',{participant:d.querySelector('#participant').value}));
  populateMonitorFilter();syncMonitor();
  let test={ok:false};try{test=w.eval('__v8SelfTest()')}catch(error){test={ok:false,error:error.message}};
  sprintLog(test.ok?'selftest.ok':'selftest.failed',{targets:test.count||0,propagated:!!test.propagated,collectiveVisible:!!test.collectiveVisible,monitorEligible:!!test.monitorEligible},test.ok?'info':'error');
  syncMonitor();
});
</script>
</body>
</html>
